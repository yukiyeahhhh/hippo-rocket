<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>カバロケット | hippo-rocket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#1b1f2a;overflow:hidden;
    font-family:"M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{background:#0e1118;box-shadow:0 0 40px #000a;border-radius:6px;}
  #hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#8a93a6;font-size:11px;padding:0 8px;}
  #veh button,#stage button{font:700 13px "M PLUS Rounded 1c",system-ui;margin:0 4px;padding:8px 14px;border-radius:13px;
    border:1px solid rgba(255,255,255,0.14);color:#eef2fb;cursor:pointer;
    background:linear-gradient(180deg,rgba(70,80,108,0.92),rgba(40,46,66,0.92));
    box-shadow:0 3px 8px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.18);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    transition:transform .08s ease,box-shadow .12s ease,background .12s ease;}
  #veh button:hover,#stage button:hover{transform:translateY(-1px);
    box-shadow:0 5px 12px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.22);}
  #veh button:active,#stage button:active{transform:translateY(1px);}
  #stage button.on{color:#3a2a08;border-color:rgba(255,255,255,0.5);
    background:linear-gradient(180deg,#ffd564,#ffae2e);
    box-shadow:0 3px 10px rgba(255,150,30,0.5),inset 0 1px 0 rgba(255,255,255,0.6);}

  /* ===== DOMメニュー・オーバーレイ（canvasと同じ仮想解像度に transform:scale で1枚重ねる＝要素ごとの同期不要） ===== */
  #ui{position:fixed;left:50%;top:50%;width:432px;height:768px;transform:translate(-50%,-50%);transform-origin:center center;
    pointer-events:none;overflow:hidden;border-radius:6px;z-index:5;}
  #ui .screen{position:absolute;inset:0;pointer-events:auto;display:none;}
  #ui .screen.show{display:block;}
  /* --- タイトル: キービジュアル(一枚絵)版＝Codexのお絵描きCSS層は非表示にしてKVへ差し替え --- */
  /* 生きてるレイヤー版：プレイと同じトイ世界を層で。実カバスプライト＋横切る鳥＋雲＋きらめき＝浮き解消＋遊び心 */
  #t-title .logoScrim{position:absolute;left:0;right:0;top:0;height:222px;z-index:5;pointer-events:none;
    background:linear-gradient(180deg,rgba(22,42,82,.30),rgba(22,42,82,0));}
  #t-title .logo,#t-title .cta,#t-title .iconbtn{z-index:6;}
  #t-title .hero{z-index:4;} #t-title .vignette{z-index:5;}
  /* 背景を横切る鳥（ゲームのbird_small=トイ世界と一致。たまに横切って“生きてる”を出す） */
  #t-title .bird{position:absolute;width:34px;height:34px;z-index:2;opacity:.92;will-change:transform;
    background:url(assets/sprites/bird_small.png) center/contain no-repeat;filter:drop-shadow(0 4px 5px rgba(40,70,110,.16));}
  #t-title .bird.b1{top:150px;animation:flyR 15s linear infinite 1.5s;}
  #t-title .bird.b2{top:236px;width:26px;height:26px;opacity:.8;animation:flyL 21s linear infinite 7s;}
  #t-title .bird.b3{top:198px;width:20px;height:20px;opacity:.7;animation:flyR 26s linear infinite 13s;}
  @keyframes flyR{0%{transform:translateX(-70px) translateY(0) scaleX(1)}50%{transform:translateX(210px) translateY(-16px) scaleX(1)}100%{transform:translateX(500px) translateY(2px) scaleX(1)}}
  @keyframes flyL{0%{transform:translateX(500px) translateY(0) scaleX(-1)}50%{transform:translateX(210px) translateY(-12px) scaleX(-1)}100%{transform:translateX(-70px) translateY(4px) scaleX(-1)}}
  /* --- タイトル: DESIGN.md の「朝焼け×上昇感×非反復レイヤー」を適用 --- */
  #t-title{isolation:isolate;overflow:hidden;
    background:
      radial-gradient(circle at 73% 13%,rgba(255,238,160,.94) 0 11%,rgba(255,238,160,0) 31%),
      linear-gradient(180deg,#62AEEB 0%,#A9D7FF 48%,#F6D6A1 100%);}
  #t-title .skywash{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(115% 52% at 50% 99%,rgba(255,255,255,.58),rgba(255,255,255,0) 60%),
      radial-gradient(90% 46% at 50% 35%,rgba(255,255,255,.22),rgba(255,255,255,0) 66%);}
  #t-title .goal{position:absolute;left:58px;right:58px;top:215px;height:118px;opacity:.44;filter:blur(.2px);
    background:linear-gradient(180deg,rgba(79,89,124,0) 0 36%,rgba(73,83,118,.32) 37% 100%);
    clip-path:polygon(0 100%,18% 62%,28% 80%,43% 43%,58% 77%,73% 52%,100% 100%);}
  #t-title .goal::after{content:"";position:absolute;left:50%;top:30px;width:18px;height:52px;transform:translateX(-50%);
    border-radius:10px 10px 3px 3px;background:linear-gradient(180deg,#fff6c9,#f0a33f);
    box-shadow:0 0 18px rgba(255,235,150,.58);}
  #t-title .cloud{position:absolute;display:block;background-repeat:no-repeat;background-size:contain;pointer-events:none;
    will-change:transform;filter:drop-shadow(0 7px 10px rgba(64,92,134,.12));}
  #t-title .cloud.c1{left:22px;top:153px;width:112px;height:58px;opacity:.36;filter:blur(1.3px);background-image:url(assets/sprites/cloud_small.png);animation:cloudSlow 17s ease-in-out infinite;}
  #t-title .cloud.c2{right:8px;top:253px;width:154px;height:78px;opacity:.52;filter:blur(.7px);background-image:url(assets/sprites/cloud_big.png);animation:cloudSlow 21s ease-in-out infinite reverse;}
  #t-title .cloud.c3{left:-18px;top:386px;width:190px;height:94px;opacity:.76;background-image:url(assets/sprites/cloud_big.png);animation:cloudMid 13s ease-in-out infinite;}
  #t-title .cloud.c4{right:-34px;top:458px;width:126px;height:66px;opacity:.68;background-image:url(assets/sprites/cloud_small.png);animation:cloudMid 15s ease-in-out infinite reverse;}
  #t-title .cloud.c5{left:45px;bottom:82px;width:250px;height:120px;opacity:.88;filter:blur(.2px);background-image:url(assets/sprites/cloud_big.png);animation:cloudNear 8s ease-in-out infinite;}
  #t-title .streak{position:absolute;width:3px;height:18px;border-radius:3px;background:rgba(255,255,255,.7);
    box-shadow:0 0 10px rgba(255,255,255,.45);transform:rotate(18deg);animation:twinkle 3.8s ease-in-out infinite;}
  #t-title .streak.s1{left:90px;top:250px;animation-delay:.4s}
  #t-title .streak.s2{right:96px;top:360px;height:13px;animation-delay:1.4s}
  #t-title .streak.s3{left:310px;top:162px;height:11px;animation-delay:2.2s}
  @keyframes cloudSlow{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(12px,-8px,0) scale(1.03)}}
  @keyframes cloudMid{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-16px,8px,0)}}
  @keyframes cloudNear{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(18px,-6px,0) scale(1.02)}}
  @keyframes twinkle{0%,70%,100%{opacity:.18;transform:translateY(0) rotate(18deg)}28%{opacity:.9;transform:translateY(-14px) rotate(18deg)}}
  #t-title .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(125% 80% at 50% 42%,transparent 58%,rgba(36,50,78,.24));}
  #t-title .logo{position:absolute;top:64px;left:26px;right:26px;text-align:center;animation:logoDrop .72s cubic-bezier(.18,1.26,.34,1) both .08s;}
  #t-title .logo-main{font-weight:800;font-size:52px;line-height:1;letter-spacing:0;color:#fff;
    text-shadow:0 2px 0 #5F8ED2,0 5px 0 #3F6FB4,0 11px 18px rgba(36,50,78,.34);}
  #t-title .logo-sub{margin-top:13px;display:inline-block;padding:7px 17px;border-radius:999px;
    font-weight:800;font-size:14px;line-height:1.45;color:#24324E;background:rgba(255,247,230,.78);
    box-shadow:0 8px 18px rgba(34,50,78,.18),inset 0 1px 0 rgba(255,255,255,.62);}
  @keyframes logoDrop{0%{opacity:0;transform:translateY(-42px) scale(.96)}72%{opacity:1;transform:translateY(5px) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}
  #t-title .hero{position:absolute;left:50%;bottom:145px;transform:translateX(-50%);width:254px;height:238px;animation:heroLand .7s cubic-bezier(.18,1.16,.34,1) both .35s;}
  #t-title .hero::before{content:"";position:absolute;left:50%;bottom:20px;width:180px;height:34px;border-radius:50%;
    transform:translateX(-50%);background:radial-gradient(ellipse,rgba(36,50,78,.26),rgba(36,50,78,0) 68%);}
  #t-title .hero .flame{position:absolute;left:50%;bottom:54px;width:38px;height:74px;transform:translateX(-50%);
    border-radius:28px 28px 36px 36px;background:linear-gradient(180deg,rgba(255,240,150,.9),rgba(255,138,53,.62) 45%,rgba(255,138,53,0));
    filter:blur(.2px);animation:flamePulse .42s ease-in-out infinite alternate;}
  #t-title .hero .pad{position:absolute;bottom:0;left:50%;width:160px;transform:translateX(-50%);
    filter:drop-shadow(0 12px 12px rgba(34,50,78,.25));}
  #t-title .hero .hippo{position:absolute;bottom:62px;left:50%;width:145px;
    filter:drop-shadow(0 16px 16px rgba(34,50,78,.30));animation:heroFloat 2.5s ease-in-out infinite .9s;}
  @keyframes heroLand{0%{opacity:0;transform:translateX(-50%) translateY(54px) scale(.94)}68%{opacity:1;transform:translateX(-50%) translateY(-8px) scale(1.02)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
  @keyframes heroFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-10px)}}
  @keyframes flamePulse{0%{opacity:.62;transform:translateX(-50%) scale(.82, .9)}100%{opacity:.95;transform:translateX(-50%) scale(1.08, 1.08)}}
  #t-title .cta{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);border:none;cursor:pointer;white-space:nowrap;
    font:800 22px/1.1 "M PLUS Rounded 1c",system-ui;color:#fff;padding:16px 54px;border-radius:999px;
    background:linear-gradient(180deg,#FFB24A 0%,#FF8A35 55%,#F06F2A 100%);text-shadow:0 2px 2px rgba(150,50,0,.34);
    box-shadow:0 8px 0 #D65B23,0 18px 24px rgba(255,112,42,.34),inset 0 2px 0 rgba(255,255,255,.48);
    animation:ctaIn .5s cubic-bezier(.18,1.14,.34,1) both .82s, ctabob 2.15s ease-in-out infinite 1.35s;}
  #t-title .cta:active{animation:none;transform:translateX(-50%) translateY(5px);
    box-shadow:0 3px 0 #D65B23,0 9px 13px rgba(255,112,42,.30),inset 0 2px 0 rgba(255,255,255,.48);}
  @keyframes ctaIn{0%{opacity:0;transform:translateX(-50%) translateY(18px) scale(.96)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
  @keyframes ctabob{0%,100%{margin-bottom:0}50%{margin-bottom:6px}}
  #t-title .iconbtn{position:absolute;top:18px;left:18px;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
    font-size:20px;color:#fff;background:linear-gradient(180deg,rgba(91,65,103,.58),rgba(36,50,78,.56));
    box-shadow:0 8px 18px rgba(34,50,78,.18),inset 0 1px 0 rgba(255,255,255,.24);
    -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<!-- DOMメニュー・オーバーレイ（試作：まずタイトルのみ。scene==='TITLE'で表示） -->
<div id="ui">
  <div id="t-title" class="screen">
    <div class="skywash"></div>
    <div class="goal"></div>
    <span class="cloud c1"></span>
    <span class="cloud c2"></span>
    <span class="cloud c3"></span>
    <span class="cloud c4"></span>
    <span class="cloud c5"></span>
    <span class="bird b1"></span>
    <span class="bird b2"></span>
    <span class="bird b3"></span>
    <span class="streak s1"></span>
    <span class="streak s2"></span>
    <span class="streak s3"></span>
    <div class="logoScrim"></div>
    <div class="vignette"></div>
    <button id="t-gear" class="iconbtn" aria-label="設定">⚙</button>
    <div class="logo">
      <div class="logo-main">カバロケット</div>
      <div class="logo-sub">重いけど、空へ行く。</div>
    </div>
    <div class="hero">
      <span class="flame"></span>
      <img class="pad" src="assets/sprites/pad.png" alt="">
      <img class="hippo" src="assets/sprites/idle.png" alt="">
    </div>
    <button id="t-start" class="cta">出発する</button>
  </div>
</div>
<div id="hint">長押し＝上昇 / 離す＝落下　・　←→ or A/D（PCはドラッグ）＝横移動　・　上＝ステージ / 下＝のりもの切替</div>
<div id="stage" style="position:fixed;top:8px;left:0;right:0;text-align:center;">
  <button data-s="A">ステージA 群れの空</button>
  <button data-s="B">ステージB 雲海</button>
  <button data-s="C">ステージC 嵐</button>
</div>
<div id="veh" style="position:fixed;bottom:30px;left:0;right:0;text-align:center;">
  <button data-v="0">1 ふつう</button>
  <button data-v="1">2 つばさ</button>
  <button data-v="2">3 ふうせん</button>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 432, H = 768;
function fit(){
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  cv.width = W; cv.height = H;
  cv.style.width = (W*s)+'px'; cv.style.height = (H*s)+'px';
  const ui=document.getElementById('ui');                 // DOMオーバーレイにcanvasと同じ拡大率をかける(同期はこの1行だけ)
  if(ui) ui.style.transform='translate(-50%,-50%) scale('+s+')';
}
addEventListener('resize', fit); fit();

// ===== スプライト読込 =====
const sprites = {};
for(const n of ['idle','boost','fall','hit','power','bird_small','bird_large','hawk','storm',
  'pelican','float',
  'ground','pad','hills','cloud_big','cloud_small','star',
  'veh_tsubasa','veh_fuusen','veh_kotsubu','veh_comet','veh_magnet',
  'veh_tsubasa_fall','veh_fuusen_fall','veh_comet_fall','veh_magnet_fall']){ const im=new Image();
  im.__readyAt=null; im.onload=()=>{ im.__readyAt=performance.now()/1000; };
  im.src='assets/sprites/'+n+'.png'; sprites[n]=im; }
const DRAW_H = { idle:78, boost:78, fall:74, hit:46, power:84 }; // 表示高さ(身長基準)
// 鳥タイプ定義：原画は右向き。進行方向(vx)が左ならflip。
// ★役割（各1動詞・被らせない。設計は 敵設計.md / [[ゲームの中身を設計する順序]]）：
//   small  … スイフト＝穴へXを合わせて押して抜ける（基本リズム＝X軸）
//   large  … ★単独の"行"には使わない（＝デカいスイフト化を排す）。ペリカン板/タカ/雷雲の母体専用
//   pelican… 上かぶり＝穴の真上を塞ぐ板。上げ続けを罰し、離して脇から抜けさせる（押し罰＝Y軸）
//   float  … 下脅威＝下からせり上がる泡。落としすぎ・低空居座りを罰す（落とし罰＝Y軸）
//   pulsar … 膨張収縮する発光球。縮んだ瞬間を待って抜ける（タイミング軸）
const BIRD = {
  small: { sprite:'bird_small', r:15, drawH:50 }, // スイフト＝速い小群れ
  large: { sprite:'bird_large', r:30, drawH:98 }, // 母体(タカ/雷雲)の素体。単独行には出さない
};

// ===== チューニング =====
const GRAV=1500, THRUST=2500, V_RISE=540, V_FALL=980;
const HIPPO_X=W*0.5, HIPPO_SCR_Y=H*0.55, HIPPO_R=24, PXPM=18;
const MAX_HP=3, IFRAME=1.2; // HP個数 / 被弾後の無敵秒数
const START_Y=38;           // 開始時の高度＝地面に接地して見える値(浮き解消)

// 乗り物：基準(ふつう)に対する性能。横移動は任意の第2軸。
//  thrust=上がりやすさ倍率 / grav=重さ(大きいほど速く落ちる)倍率 / steer=横の曲がり(px/秒) / size=体の大きさ(当たり&見た目)
//  thrust=上がりやすさ(加速) / vrise=最高上昇速度 / grav=落ち始めの加速(重さ) / vfall=落下の最高速度
//  smax=横の最高速度 / sacc=横の加速(=止まりにくさ。小さいほど慣性が強い) / size=体の大きさ
//  hitW=当たり判定の横幅倍率(>1で横長=上の障害に当たりやすい)
const VEHICLES = [
  { name:'ふつう',   thrust:1.0,  vrise:1.0,  grav:1.0,  vfall:1.0,  smax:235, sacc:1500, size:1.0, hitW:1.0 }, // 万能の基準
  { name:'つばさ',   thrust:0.5,  vrise:0.66, grav:0.34, vfall:0.34, smax:430, sacc:3000, size:1.0, hitW:1.0 }, // 上昇かなり苦手/超ふわ滑空/横は俊敏=滞空して横で避ける
  { name:'ふうせん', thrust:0.95, vrise:0.92, grav:0.5,  vfall:0.34, smax:230, sacc:1500, size:1.0, hitW:1.7 }, // コイン1.5倍×横長ハイリスク。ふわ浮き+横は実用域。体格は全機体1.0固定
  { name:'こつぶ',   thrust:0.78, vrise:0.7,  grav:1.05, vfall:1.2,  smax:330, sacc:2100, size:0.55,hitW:0.85 }, // 力弱く落ちやすいが極小=隙間に強い/キビキビ(一旦外す)
  { name:'コメット', thrust:1.25, vrise:1.15, grav:1.2,  vfall:1.35, smax:250, sacc:1900, size:1.0, hitW:1.0 }, // 速さ特化=爆速で登り爆速で落ちる(縦の反応/速さ★が王)。ふわ滞空・精密は苦手
  { name:'マグ',     thrust:1.0,  vrise:0.95, grav:1.0,  vfall:1.0,  smax:220, sacc:1500, size:1.0, hitW:1.0 }, // コイン磁石=周囲のコインを引き寄せる(危険な位置も安全に回収)。機動はふつう=尖りは経済
];
let vehIdx=0;
function veh(){ return VEHICLES[vehIdx]; }
// 機体ごとの見た目：背中のリグだけ違う別スプライト。★カバ本体は全機体「同じ体高」で描画＝大小はveh().sizeで出す。
//  base=飛行ポーズの原画 / bodyH=画像高に占める"カバ本体"の比率(体基準で正規化) / cy=体の中心が画像上のどこか(縦アンカー)
//  ふつう(0)=null＝従来の状態スプライト(idle/boost/fall)を使う。他は idle/boost/fall をbaseで上書きしcode演出で状態差を出す。
// bodyH=画像高に占める"体"の割合(体を一定の表示高に正規化する基準)。fall=落下絵は腕上げ/汗/リグで体割合が変わる＝状態別に基準を持つ(無いと状態間で体サイズが激変)。
const VEH_ART = [
  null,
  { base:'veh_tsubasa', bodyH:0.95, cy:0.52, fall:{bodyH:0.66, cy:0.5} },  // 羽=横長・体はほぼ全高
  { base:'veh_fuusen',  bodyH:0.5,  cy:0.74, fall:{bodyH:0.55, cy:0.62} }, // 横に広がる3風船で吊る=体は下半分。横長=hitW1.8とセット
  { base:'veh_kotsubu', bodyH:0.82, cy:0.56 }, // プロペラ=やや縦長(廃止)
  { base:'veh_comet',   bodyH:0.58, cy:0.45, fall:{bodyH:0.54, cy:0.5} },  // ジェット橇=横に流線+後方噴射
  { base:'veh_magnet',  bodyH:0.62, cy:0.5, cx:0.36, fall:{bodyH:0.62, cy:0.5} }, // 馬蹄磁石。コインが右に流れる絵
  // ※fall.bodyH(各装備の落下時の体サイズ)は中間値で仮置き＝小さいほど体が大きく描かれる。実機微調整はCodex可(?cap&veh=N&pose=fallで確認)。
];
// 機体メタ：price=価格 / coinMul=獲得倍率 / fx=噴射演出(flame/puff/sparkle) / desc / buy=ショップに並べる
const VEH_META = [
  { price:0,   buy:false, coinMul:1.0, fx:'flame',   desc:'バランス。迷ったらコレ' },
  { price:80,  buy:true,  coinMul:1.0, fx:'puff',    desc:'横にスイスイ・滞空／登坂が苦手' },

// ===== 軽量SE(WebAudio) =====
// 外部音源なしの短い合成音。ブラウザ仕様上、初回入力後にだけAudioContextを起こす。
let audioCtx=null;
function initAudio(){ if(save.settings.mute || audioCtx) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ audioCtx=new AC(); }catch(e){ audioCtx=null; } }
function sfx(kind){ if(save.settings.mute) return; initAudio(); if(!audioCtx) return;
  const now=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
  const map={
    tap:[360,0.045,'sine',0.025], coin:[880,0.075,'triangle',0.045], graze:[1180,0.08,'sine',0.035],
    hit:[120,0.16,'sawtooth',0.055], clear:[660,0.22,'triangle',0.05], buy:[520,0.18,'square',0.035]
  };
  const m=map[kind]||map.tap; o.type=m[2]; o.frequency.setValueAtTime(m[0],now);
  if(kind==='clear'){ o.frequency.linearRampToValueAtTime(990,now+m[1]); }
  else if(kind==='hit'){ o.frequency.linearRampToValueAtTime(70,now+m[1]); }
  else { o.frequency.exponentialRampToValueAtTime(Math.max(40,m[0]*1.35),now+m[1]); }
  g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(m[3],now+0.01); g.gain.exponentialRampToValueAtTime(0.0001,now+m[1]);
  o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now+m[1]+0.02);
}

// ★敵スポーンは1つに統一(綺麗な"降下陣形")。混在(向かってくる/横スライド)とぐちゃぐちゃを排す:
//  ・全部まっすぐ降りてくる(vy・向かってくる)。横移動するのは「斜めストリーム」パターンの時だけ(dvx)。
//  ・穴は常に1つ・画面内・広め。形は「横一列」基本、たまに「穴を頂点にしたV字」。slope/2穴/ランダム揺れは廃止。
//  ・隊形は共通位相で固まって動く＝綺麗な1枚の壁に見える。
const SPAWN_TOP_PAD=260; // 降下する敵は予告時間が要る=画面上端のかなり上で作り、見てから避けられるように
const BIRD_DESCENT=60;   // 鳥の降下速度(全陣形共通=追いつき/重なりを防ぐ。難度を上げるならここを上げる)
const CAP_DY=128;        // 上かぶり(ペリカン)が入口列の上にかぶさる縦距離=ポケットの高さ(離して脇へ抜ける余地)
const FLOAT_RISE=54;     // フロートが下からせり上がる速度(自機の落下より十分遅い=詰みでなく決断)
const PULSAR_R_MAX=48, PULSAR_R_MIN=8;  // パルサーの開閉幅。縮小時だけ広い通路が生まれる
function aheadSpawnY(y){ return Math.max(y, hippoY + HIPPO_SCR_Y + SPAWN_TOP_PAD); }
// スイフト列：穴1つの降下フォーメーション。形=line/vee/stream(斜め)を"設計値"で出す(ランダム散漫を排す)。
//  求める行動＝穴へXを合わせ、押して抜ける（基本リズム＝X軸）。
function spawnBird(y, cfg){
  const spacing = cfg.tight ? 78 : 92;
  const shape = cfg.shape || (Math.random()<0.16?'stream' : Math.random()<0.26?'vee' : 'line');
  const vy = -BIRD_DESCENT*(stage().dmul||1);                           // 降下は全陣形一定＝追いつき/重なり無し(dmulでステージ別に"迫る"速さ)
  // 動き：stream=斜めに流して横断 / それ以外は陣形ごと横にゆれる(穴も一緒に動く＝追わせる/生きてる。揺れは戻るので必ず通れる)。
  const isStream = shape==='stream';
  const dvx = isStream ? (Math.random()<0.5?-1:1)*(58+Math.random()*22) : 0;
  const sway = isStream ? 8 : 20+Math.random()*30;                      // 横ゆれ振幅(陣形共通位相で一緒に動く)
  const veeDir = Math.random()<0.5?1:-1;
  const gapW = 152+Math.random()*16;                                    // 穴は広め
  const gapX = gapW/2+28 + Math.random()*Math.max(0,(W-gapW-56));       // 穴は常に1つ・画面内
  const ph = Math.random()*6.28;                                       // 隊形共通位相(固まって動く)
  for(let x=28; x<=W-28; x+=spacing){
    if(Math.abs(x-gapX)<gapW/2) continue;                              // 穴を空ける
    let yy=y;
    if(shape==='vee')    yy = y + veeDir*(Math.abs(x-gapX)/(W*0.5))*76;        // V字=穴を頂点に
    if(shape==='stream') yy = y + ((x-28)/(W-56))*150 - 75;                   // 斜めの帯
    birds.push({ type:'small', move:'form', r:BIRD.small.r, cy:yy, y:yy, x, sx:x, dvx, vy, sway, fph:ph, ph });
  }
}
// ★上かぶりゲート(ペリカン)：入口列(穴1つ)＋穴の"真上"にかぶさるペリカン板。
//  求める行動＝穴へXを合わせて入る→そのまま上げ続けると板に当たる(押し罰)→離して勢いを殺し、板の脇へずれて抜ける。
//  板は中央寄りに置き両脇に必ず逃げ場を残す。危険側(抜け先)にコイン＝攻めの横移動で取れる(落下/横の報酬)。
function spawnOverhang(y){
  const spacing=92, vy=-BIRD_DESCENT, ph=Math.random()*6.28, gapW=180; // 穴は広め＝通りやすい
  const gapX = (W*0.34) + Math.random()*(W*0.32);
  const capHW=46;                                                      // ★板は細い
  const openSide = (gapX<W/2)?1:-1;                                    // 抜け道を作る側(壁から遠い側に開ける)
  const capX = gapX - openSide*(gapW/2);                               // ★板は穴の"片側"の上だけを塞ぐ＝反対側はまっすぐ登れる抜け道(落下不要=全機体公平)
  for(let x=28; x<=W-28; x+=spacing){
    if(Math.abs(x-gapX)<gapW/2) continue;
    birds.push({ type:'small', move:'form', r:BIRD.small.r, cy:y, y, x, sx:x, dvx:0, vy, fph:ph, ph });
  }
  birds.push({ type:'large', move:'form', cap:true, sprite:'pelican', box:true, hw:capHW, hh:17,
    r:capHW, cy:y+CAP_DY, y:y+CAP_DY, x:capX, sx:capX, dvx:0, vy, fph:ph, ph });
  coins.push({ y:y+CAP_DY-36, x:capX, r:13, t:Math.random()*6.28 });  // 危険側のごほうび：板の真下(攻めて潜ると取れる)
}
// ★下脅威フロート：プレイヤーの下からゆっくりせり上がる泡。落としすぎ・低空での居座りを罰す。
//  横に必ず逃げ道(穴)を残す。せり上がりは落下速度より遅い＝避けられる決断。穴の低い所にコイン＝攻めると取れる。
function spawnFloat(yBeat){
  const baseY = Math.min(yBeat, hippoY) - 60;                           // 画面下〜自機直下から湧く
  const gapX = 96+Math.random()*(W-192);
  for(let k=0;k<4;k++){
    const x = 50 + (k/3)*(W-100);
    if(Math.abs(x-gapX)<82) continue;                                  // 横の抜け道
    birds.push({ type:'small', move:'float', sprite:'float', r:23, box:false,
      cy:baseY-k*10, y:baseY-k*10, x, sx:x, ph:Math.random()*6.28, rise:FLOAT_RISE });
  }
  coins.push({ y:baseY+20, x:gapX, r:13, t:Math.random()*6.28 });      // 下脅威の穴＝攻めの低空でコイン
}
function spawnDiver(y){ // 鋭いタカ：一定だけ追尾→ダッシュで離脱（道に居座らない・テンポの良い脅威）
  birds.push({ type:'large', move:'diver', sprite:'hawk', r:BIRD.large.r*1.05, ds:1.25, cy:y, y, x:60+Math.random()*(W-120), t:0 });
}
function spawnObstacles(y){ // 雷雲＝静止障害物。必ず通れる隙間を1つ残す
  const gapW=150+Math.random()*40, gapX=(gapW/2+30)+Math.random()*(W-gapW-60);
  for(let x=70; x<=W-70; x+=140){
    if(Math.abs(x-gapX)<gapW/2) continue;
    birds.push({ type:'large', move:'static', sprite:'storm', r:BIRD.large.r*1.1, ds:1.3, cy:y+(Math.random()-0.5)*40, y, x, ph:Math.random()*6.28 });
  }
}
// ★斜めダイブ鳥：画面上の角からだいたい自機Xを狙って斜めに突っ込んでくる→Xでよける(全機体可=浮遊機体にも公平)。
//  迫ってくる遊びの本命。一度だけ自機方向へ舵を切り、以後は等速で確定(=読んで横へ逃げられる)。降下が速い＝"迫る"。
function spawnSwoop(yTop, dir){
  const d = dir || (Math.random()<0.5?1:-1);
  birds.push({ type:'small', move:'swoop', sprite:'bird_small', r:BIRD.small.r*1.1,
    y:yTop, cy:yTop, x:(d>0?-28:W+28), dir:d, vx:d*150, vyw:-300, aim:true, ph:Math.random()*6.28 });
}
// ★危険ダイブコイン：安全な登り線の"下"へ伸びるコイン列。攻めて落ちて拾い、登り返す(リスク/リターン=欲張りの決断)。
function spawnDive(yTop){
  const x = 70 + Math.random()*(W-140);
  for(let i=0;i<4;i++) coins.push({ y:yTop - i*52, x:x+Math.sin(i*0.9)*16, r:13, t:Math.random()*6.28 }); // 下方向(yが小)へ潜るほど深い
}
// ★パルサー：横一列の発光球が同時に膨張収縮。縮んだ瞬間に抜けるタイミング敵。
//  最大時は通路がかなり狭いが、最小時は全機体に抜け道が残る。足元のコインは「待って抜ける」誘導。
function spawnPulsar(yTop){
  const ph=Math.random()*6.28, xs=[W*0.21,W*0.50,W*0.79], vy=-BIRD_DESCENT*0.8;
  for(const x of xs){
    birds.push({ type:'small', move:'pulsar', sprite:'pulsar', r:PULSAR_R_MAX, baseR:PULSAR_R_MAX,
      cy:yTop, y:yTop, x, sx:x, vy, ph, vx:0, pulse:1 });
  }
  coins.push({ y:yTop-58, x:W*0.5, r:13, t:Math.random()*6.28 });
}
function spawnAhead(){
  while(nextSpawn < hippoY + H + 200 && nextSpawn < stageTop){ // finite：頂上より上には湧かさない
    if(nextSpawn >= beatEndY) nextBeat();
    if(beatI >= stage().beats.length) break;   // 念のため範囲ガード
    const B=stage().beats[beatI];
    if(B.type==='swarm'){ if(!beatSpawned){ const y=aheadSpawnY(beatStartY+50); if(y<stageTop) spawnBird(y, {tight:true, shape:B.shape}); beatSpawned=true; } nextSpawn=Math.max(nextSpawn,beatEndY); } // swarm=密な降下陣形(形は設計値shapeで指定)
    else if(B.type==='over'){ if(!beatSpawned){ const y=aheadSpawnY(beatStartY+50); if(y<stageTop) spawnOverhang(y); beatSpawned=true; } nextSpawn=Math.max(nextSpawn,beatEndY); } // ★上かぶりゲート(押し罰=離して脇抜け)
    else if(B.type==='float'){ if(!beatSpawned){ spawnFloat(beatStartY); beatSpawned=true; } nextSpawn=Math.max(nextSpawn,beatEndY); } // ★下脅威フロート(落とし罰=下からせり上がる)
    else if(B.type==='swoop'){ if(!beatSpawned){ const y=aheadSpawnY(beatStartY+50); if(y<stageTop){ spawnSwoop(y); if(B.n>1) spawnSwoop(y-150,-(birds[birds.length-1].dir)); } beatSpawned=true; } nextSpawn=Math.max(nextSpawn,beatEndY); } // ★横スウープ(迫る脅威=高度をずらして反応回避)
    else if(B.type==='dive'){ if(!beatSpawned){ const y=aheadSpawnY(beatStartY+50); if(y<stageTop) spawnDive(y); beatSpawned=true; } nextSpawn=Math.max(nextSpawn,beatEndY); } // ★危険ダイブコイン(攻めて落ちて取る)
    else if(B.type==='pulsar'){ if(!beatSpawned){ const y=aheadSpawnY(beatStartY+50); if(y<stageTop) spawnPulsar(y); beatSpawned=true; } nextSpawn=Math.max(nextSpawn,beatEndY); } // ★パルサー(縮む瞬間を待って抜けるタイミング敵)
    else if(B.type==='elite'){ if(!beatSpawned){ const y=aheadSpawnY(beatStartY+50); if(y<stageTop) spawnDiver(y); beatSpawned=true; } nextSpawn=Math.max(nextSpawn,beatEndY); }
    else if(B.type==='obstacle'){ if(!beatSpawned){ const y=aheadSpawnY(beatStartY+50); if(y<stageTop) spawnObstacles(y); beatSpawned=true; } nextSpawn=Math.max(nextSpawn,beatEndY); }
    else if(B.type==='wind'){ if(!beatSpawned){ winds.push({y0:beatStartY, y1:beatEndY+90, dir:B.dir}); beatSpawned=true; } nextSpawn=Math.max(nextSpawn,beatEndY); } // y1を少し延長=間の障害物ビートも風で覆う(風に抗って隙間へ寄せる)
    else {
      const cfg=BEATCFG[B.type], diff=Math.min(Math.max(0,(hippoY-START_Y)/(stageTop-START_Y)),1); // 難度はステージ高さ全体で上げる(40mで頭打ちを解消)
      if(cfg.cloud && !beatSpawned){ // 厚い霧＝上下2枚の雲バンク＋その中に強敵が潜む
        const mid=(beatStartY+beatEndY)/2, span=beatEndY-beatStartY;
        banks.push({ y:mid-span*0.22, h:210+Math.random()*150 });
        banks.push({ y:mid+span*0.22, h:210+Math.random()*150 });
        const dy=aheadSpawnY(mid);
        if(B.elite && dy<stageTop) spawnDiver(dy);
        beatSpawned=true;
      }
      nextSpawn += Math.max(120, cfg.bgap[0]-90*diff + Math.random()*cfg.bgap[1]);
      nextSpawn = aheadSpawnY(nextSpawn);
      if(nextSpawn >= stageTop) break;          // 頂上より上には湧かさない
      if(!cfg.nobird) spawnBird(nextSpawn, cfg); // コイン回廊(nobird)は敵を出さない=ご褒美/集中
      if(cfg.coins) coins.push({ y:nextSpawn+(Math.random()-0.5)*50, x:60+Math.random()*(W-120), r:14, t:Math.random()*6.28 }); // コインの道(緩やかな蛇行)
    }
  }
}

let pressed=false, steerL=false, steerR=false, ptrActive=false, ptrX=W/2, ptrPrevX=W/2;
let hotspots=[];                 // メニュー/結果のクリック領域 {x,y,w,h,fn}。draw時に毎フレーム再構築
let pointer={x:0,y:0,down:false}; // ボタンの押下演出用
const STAGE_ORDER=['A','B','C','D'];
function stageAfter(k){ return STAGE_ORDER[STAGE_ORDER.indexOf(k)+1]; } // 無ければundefined
function canSwapVeh(){ return false; }  // 旧:飛行中ロック判定。今はHUDのstats常時非表示
function markStage(){}                   // 旧:DOMステージボタン。no-op
function syncControls(){}                // 旧:DOMバー表示制御。no-op

function ptrPos(e){ const r=cv.getBoundingClientRect(); const cx=e.touches?e.touches[0].clientX:e.clientX; return (cx-r.left)/r.width*W; }
function ptrXY(e){ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e;
  return { x:(t.clientX-r.left)/r.width*W, y:(t.clientY-r.top)/r.height*H }; }
function inPlay(){ return scene==='PLAY' && !dead && !cleared && !paused; }
function pauseGame(){ if(scene==='PLAY' && !dead && !cleared){ paused=true; pressed=false; ptrActive=false; steerL=false; steerR=false; } }
function resumeGame(){ if(scene==='PLAY' && paused){ paused=false; pressed=false; ptrActive=false; } }
function tapAt(x,y){ for(let i=hotspots.length-1;i>=0;i--){ const h=hotspots[i]; // 後勝ち=前面優先
  if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){ sfx('tap'); h.fn(); return true; } } return false; }
function pressDown(e){ if(trans||domShown) return;        // 遷移カバー中／DOMメニュー表示中は canvas入力を無視
  const p=ptrXY(e); pointer.x=p.x; pointer.y=p.y; pointer.down=true;
  initAudio();
  if(scene==='PLAY' && tapAt(p.x,p.y)) return;
  if(inPlay()){ pressed=true; started=true; ptrActive=true; ptrX=ptrPrevX=p.x; }
  else tapAt(p.x,p.y);   // TITLE/SELECT/SHOP/結果はボタン判定
}
function pressUp(){ pressed=false; ptrActive=false; pointer.down=false; }
addEventListener('mousedown',e=>pressDown(e));
addEventListener('mouseup',()=>pressUp());
addEventListener('mousemove',e=>{ const p=ptrXY(e); pointer.x=p.x; pointer.y=p.y; if(ptrActive) ptrX=p.x; });
// ★DOMメニュー表示中(domShown)はpreventDefaultしない＝touchのpreventDefaultがボタンのclickを潰してタイトルから進めなくなる不具合の修正
addEventListener('touchstart',e=>{ if(domShown) return; e.preventDefault(); pressDown(e); },{passive:false});
addEventListener('touchmove',e=>{ if(domShown) return; e.preventDefault(); const p=ptrXY(e); pointer.x=p.x; pointer.y=p.y; if(ptrActive) ptrX=p.x; },{passive:false});
addEventListener('touchend',e=>{ if(domShown) return; e.preventDefault(); pressUp(); },{passive:false});
addEventListener('keydown',e=>{
  if(e.code==='Escape'){ if(scene==='PLAY' && !dead && !cleared){ e.preventDefault(); paused?resumeGame():pauseGame(); } return; }
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault();
    if(inPlay()){ if(!e.repeat){ pressed=true; started=true; } } else if(!e.repeat) keyPrimary(); }
  if(scene==='PLAY' && paused) return;
  if(e.code==='ArrowLeft'||e.code==='KeyA') steerL=true;
  if(e.code==='ArrowRight'||e.code==='KeyD') steerR=true;
});
addEventListener('keyup',e=>{
  if(e.code==='Space'||e.code==='Enter') pressed=false;
  if(e.code==='ArrowLeft'||e.code==='KeyA') steerL=false;
  if(e.code==='ArrowRight'||e.code==='KeyD') steerR=false;
});
// デバッグ操作(手触り検証用)：P=ON/OFF、ON中のみ各キーが効く
addEventListener('keydown',e=>{
  if(e.code==='KeyP'){ debug.on=!debug.on; return; }
  if(!debug.on) return;
  if(e.code==='KeyI') debug.invinc=!debug.invinc;        // 無敵(死なない)
  else if(e.code==='KeyH') debug.hit=!debug.hit;         // 当たり判定の可視化
  else if(e.code==='KeyU') unlockAll();                  // 全機体/全ステージ解放+コイン
  else if(e.code==='KeyC'){ do{ vehIdx=(vehIdx+1)%VEHICLES.length; }while(VEH_META[vehIdx].retired); save.selected=vehIdx; } // 機体サイクル(廃止はスキップ)
  else if(e.code==='KeyJ'){ if(scene==='PLAY'){ hippoY+=150*PXPM; started=true; } }      // 高度+150m
  else if(e.code==='KeyK'){ if(scene==='PLAY'&&!cleared){ hippoY=stageTop-12; started=true; } } // 頂上付近へ
  else if(e.code>='Digit1'&&e.code<='Digit6'){ vehIdx=Math.min(VEHICLES.length-1,+e.code.slice(5)-1); save.selected=vehIdx; }
});
function keyPrimary(){ // キーボード「決定」＝各シーンの主ボタン
  initAudio(); sfx('tap');
  if(scene==='PLAY' && paused){ resumeGame(); return; }
  if(scene==='TITLE') scene='SELECT';
  else if(scene==='SELECT') launch();
  else if(scene==='SHOP') scene='SELECT';
  else if(scene==='SETTINGS') scene='TITLE';
  else if(scene==='PLAY' && cleared) afterClear();
  else if(scene==='PLAY' && dead) relaunch();
}
// ===== シーン遷移 =====
function launch(){ vehIdx = save.owned.includes(save.selected)?save.selected:0; reset(); scene='PLAY'; pressed=false; started=false; paused=false; }
function relaunch(){ reset(); scene='PLAY'; pressed=false; started=false; paused=false; }  // リトライ(同条件)
function afterClear(){ const nk=stageAfter(stageKey);
  if(nk && STAGES[nk]){ if(!save.unlocked.includes(nk)){ save.unlocked.push(nk); saveNow(); } stageKey=nk; reset(); scene='PLAY'; pressed=false; started=false; paused=false; }
  else scene='SELECT'; }
function buyVeh(i){ const m=VEH_META[i]; if(!m||save.owned.includes(i)||save.coins<m.price) return;
  save.coins-=m.price; save.owned.push(i); save.selected=i; sfx('buy'); saveNow(); }
function resetSaveData(){ save=defaultSave(); saveNow(); vehIdx=0; stageKey='A'; resetConfirm=false; scene='TITLE'; }
// DOM操作バー(旧#stage/#veh/#hint)はcanvasのSELECT/SHOPへ統合＝隠す
for(const id of ['stage','veh','hint']){ const el=document.getElementById(id); if(el) el.style.display='none'; }

function screenY(wy){ return HIPPO_SCR_Y-(wy-hippoY); }
function curState(){ return dead?'hit':(cleared?'idle':(boosting?'boost':(vel<-60?'fall':'idle'))); }

// ===== 炎パーティクル =====
function emitFlame(){
  for(let k=0;k<3;k++){
    parts.push({
      x:hipX+(Math.random()-0.5)*8,
      y:HIPPO_SCR_Y+DRAW_H.boost*veh().size*0.34+Math.random()*6,
      vx:(Math.random()-0.5)*60, vy:180+Math.random()*160,
      life:0, max:0.28+Math.random()*0.18, sz:7+Math.random()*6
    });
  }
}
// 空気パフ（翼/プロペラの推進＝下へ押し出す風。白くふわっと膨らんで消える）
function emitPuff(){
  for(let k=0;k<2;k++){
    parts.push({ kind:'puff',
      x:hipX+(Math.random()-0.5)*26,
      y:HIPPO_SCR_Y+DRAW_H.boost*veh().size*0.3+Math.random()*8,
      vx:(Math.random()-0.5)*120, vy:120+Math.random()*120,
      life:0, max:0.34+Math.random()*0.2, sz:6+Math.random()*7 });
  }
}
function updateParts(dt){
  for(const p of parts){ p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.kind==='puff'?60:200)*dt; }
  parts=parts.filter(p=>p.life<p.max);
}
function drawParts(){
  for(const p of parts){
    const t=p.life/p.max, a=1-t;
    if(p.kind==='puff'){               // 白い空気＝膨らみながら薄く
      ctx.globalAlpha=a*0.4; ctx.fillStyle='#eef4ff';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*(0.7+0.9*t),0,7); ctx.fill();
    }else{                             // 炎：黄→橙→赤
      const r=255, g=Math.round(220-150*t), b=Math.round(60-60*t);
      ctx.globalAlpha=a*0.9; ctx.fillStyle=`rgb(${r},${g},${b})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*(1-0.4*t),0,7); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}

// ===== キラキラ（無敵/取得演出）=====
function emitSparkle(x,y,n,spread){
  for(let k=0;k<n;k++){
    const a=Math.random()*6.28, sp=spread*(0.3+Math.random());
    sparks.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-40,
      life:0, max:0.45+Math.random()*0.4, sz:3+Math.random()*4, hue:Math.random()<0.5?'#fff':'#ffe06a' });
  }
}
function updateSparks(dt){
  for(const p of sparks){ p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=90*dt; }
  sparks=sparks.filter(p=>p.life<p.max);
}
function drawSparks(){
  for(const p of sparks){
    const t=p.life/p.max, a=(1-t)*(0.6+0.4*Math.sin(tsec*30+p.x));
    ctx.globalAlpha=Math.max(0,a); ctx.fillStyle=p.hue;
    const s=p.sz*(1-0.3*t);
    ctx.beginPath(); ctx.arc(p.x,p.y,s,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ===== 風（スピードライン）=====
function drawWind(){
  const intensity=Math.min(Math.abs(vel)/520,1);
  if(intensity<0.28) return;        // 速い時だけ＝鳥の陣形読みを邪魔しない
  windPhase += vel*dtGlobal*1.1;   // velと逆向きに流れる
  const wc = vel>=0 ? '255,255,255' : '255,150,90'; // 上昇=白 / 落下=暖色（向きが分かる）
  ctx.strokeStyle=`rgba(${wc},${0.03+intensity*0.08})`; // 薄く＝視覚ノイズ低減
  ctx.lineWidth=2;
  for(let i=0;i<9;i++){
    const x=22+ (i*87 % (W-30));
    const len=18+intensity*36;
    let y=((i*97 - windPhase)%(H+len)+H+len)%(H+len)-len;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+len); ctx.stroke();
  }
}

// ===== カバ描画（スプライト＋風の煽り）=====
function drawHippo(){
  const st=curState();
  // 機体ごとの見た目：idle/boost/fall は機体baseで上書き（hit/powerは共通スプライト）。ふつう(VEH_ART=null)は従来通り。
  const va=VEH_ART[vehIdx];
  const useVeh = va && (st==='idle'||st==='boost'||st==='fall');
  // 状態別の装備スプライト(例:veh_tsubasa_fall)があれば優先、無ければbaseにフォールバック＝段階導入
  let img, vehStateSprite=false;
  if(useVeh){ const sp=sprites[va.base+'_'+st]; if(sp&&sp.complete&&sp.naturalHeight){ img=sp; vehStateSprite=true; } else img=sprites[va.base]; }
  else img=sprites[st];
  // 体サイズを状態間で揃える：基準アンカーを状態別に選ぶ。base共用=va本体／状態別スプライト=va[st](例va.fall)。
  // どちらも"体の高さ"を一定に正規化する＝落下で体が縮む/伸びるのを防ぐ。状態別の基準が無い時だけ中央・全画面基準にフォールバック。
  const anchor = !useVeh ? null : (vehStateSprite ? (va[st]||null) : va);
  const useRig = !!anchor;
  // 風の煽り：状態ごとに揺れ
  let ang=0, bob=0;
  if(st==='idle'){ ang=Math.sin(tsec*2)*0.04; bob=Math.sin(tsec*2)*3; }
  else if(st==='boost'){ ang=Math.sin(tsec*34)*0.035; bob=Math.sin(tsec*26)*1.5; }
  else if(st==='fall'){ ang=Math.sin(tsec*9)*0.16; bob=Math.sin(tsec*12)*2; }
  if(cleared){ ang=0; bob=0; }
  ctx.save();
  // 被弾無敵中は点滅
  if(iframe>0 && !dead) ctx.globalAlpha = (Math.floor(tsec*18)%2) ? 0.3 : 0.85;
  ctx.translate(hipX, HIPPO_SCR_Y+bob);
  ctx.rotate(ang);
  // boost中の機体ごとの"ポンプ"（縦の伸縮で推進の努力感を出す・炎の代わり）
  if(st==='boost' && useVeh){
    const flapY = vehIdx===1 ? 1+Math.sin(tsec*26)*0.06   // 翼=羽ばたき
                : vehIdx===3 ? 1+Math.sin(tsec*42)*0.04   // プロペラ=細かい振動
                :              1+Math.sin(tsec*6)*0.035;  // 風船=ゆったり伸び
    ctx.scale(1, flapY);
  }
  if(img && img.complete && img.naturalHeight){
    const bodyH=DRAW_H[st]*veh().size;                  // 揃える"体の高さ"（×veh().sizeで大小を出す）
    const dh = useRig ? bodyH/anchor.bodyH : bodyH;      // 体割合で正規化＝状態が変わっても体の高さは一定
    const dw = dh*(img.naturalWidth/img.naturalHeight);
    const ay = useRig ? anchor.cy : 0.5;                 // 体の中心を原点に合わせる縦アンカー
    const ax = (useRig && anchor.cx!=null) ? anchor.cx : 0.5; // 横アンカー(無指定は中央)
    // 主役の分離：暗背景でも埋もれない柔らかいバックライト＋明背景で効くドロップシャドウ（体サイズ基準）
    const gl=ctx.createRadialGradient(0,0,bodyH*0.22,0,0,bodyH*0.64);
    gl.addColorStop(0,'rgba(255,255,255,0.16)'); gl.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(0,0,bodyH*0.64,0,7); ctx.fill();
    ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=8;
    ctx.drawImage(img, -ax*dw, -ay*dh, dw, dh);
    ctx.shadowBlur=0;
  } else {
    ctx.fillStyle='#7d8aa0'; ctx.fillRect(-HIPPO_R,-HIPPO_R,HIPPO_R*2,HIPPO_R*2);
  }
  ctx.restore();
}

let last=performance.now(), dtGlobal=0;
function loop(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05; dtGlobal=dt; tsec+=dt;
  fps += (1/Math.max(dt,1e-4)-fps)*0.1;                             // デバッグ表示用FPS(平滑)
  if(scene!==lastScene){ sceneT=0; lastScene=scene; } sceneT+=dt;   // 画面遷移の経過
  if(trans){ trans.t+=dt; if(!trans.done && trans.t>=trans.dur*0.5){ trans.fn(); trans.done=true; } if(trans.t>=trans.dur) trans=null; } // カバー中点で実際の切替
  if(scene==='PLAY' && !dead && !cleared && !paused){
    const V=veh(), hr=HIPPO_R*V.size;   // 乗り物性能・当たり半径(大きさ依存)
    boosting=pressed; if(boosting) started=true;
    if(started) runTime+=dt;     // クリアタイム(★②速さ/速さコインボーナスに使用)
    windDir=0; if(started) for(const wz of winds){ if(hippoY>=wz.y0 && hippoY<=wz.y1) windDir=wz.dir; } // 現在地の横風(±1=右/左)
    const prevHippoY=hippoY;     // すり抜け防止のスイープ用
    if(started && !window.__capHold){   // __capHold=撮影用に高度を固定し、敵だけ降下させて構図を確認(?cap&hold)
      let a=-GRAV*V.grav+(boosting?THRUST*V.thrust:0);
      vel+=a*dt; if(vel>V_RISE*V.vrise)vel=V_RISE*V.vrise; if(vel<-V_FALL*V.vfall)vel=-V_FALL*V.vfall;
      hippoY+=vel*dt;
    }
    // 横移動（←→/A D/相対ドラッグ・慣性つき）。横風はhvelに効く＝機体の横加速/最高速で抵抗力が変わる
    const dragd = ptrActive ? (ptrX-ptrPrevX) : 0; ptrPrevX = ptrX;
    let want = (steerR?1:0)-(steerL?1:0);
    if(!want && ptrActive) want = Math.max(-1, Math.min(1, dragd*0.5*(save.settings.sens||1)));
    const tgt = want*V.smax;
    hvel += Math.max(-V.sacc*dt, Math.min(V.sacc*dt, tgt-hvel));
    if(started) hvel += windDir*WIND_ACC*dt;                          // 横風の外力
    hvel = Math.max(-V.smax*1.7, Math.min(V.smax*1.7, hvel));         // 風で流されても上限
    hipX += hvel*dt;
    const hbm=hr*0.7;
    if(hipX<hbm){ hipX=hbm; hvel=0; } else if(hipX>W-hbm){ hipX=W-hbm; hvel=0; }
    alt=Math.max(alt,(hippoY-START_Y)/PXPM);
    if(started && hippoY>=stageTop){ // 頂上到達＝ステージクリア
      cleared=true; best=Math.max(best,Math.floor((stageTop-START_Y)/PXPM)); pressed=false; boosting=false; vel=0; hvel=0; hippoY=stageTop;
      sfx('clear');
      for(let k=0;k<46;k++) emitSparkle(Math.random()*W, Math.random()*H*0.55, 1, 230);
    }
    if(iframe>0) iframe-=dt; if(hitFlash>0) hitFlash-=dt;
    if(hippoY<=hr){ hippoY=hr; if(started && !debug.invinc) die('fall'); }   // 地面落下は即死
    if(started){                                            // ★スタート後だけ敵・時間が進む(覚えゲーの公平性)
    spawnAhead();
    for(const b of birds){
      if(b.move==='diver'){            // タカ：画面上部で狙いを定める(予告)→まっすぐ急降下して"列"を塞ぐ＝同じ横位置で上げ続けを罰す
        if(!b.armed){ const dsy=screenY(b.y); if(dsy>-10 && dsy<H*0.46){ b.armed=true; b.t=0; b.lockX=b.x; } }
        else { b.t+=dt;
          if(b.t<0.9){ b.lockX += Math.sign(hipX-b.lockX)*Math.min(Math.abs(hipX-b.lockX), 130*dt); b.x=b.lockX; b.vx=(hipX-b.x)*0.01; } // 横に寄せて狙う
          else { b.x=b.lockX; b.y -= 560*dt; b.vy=-560; }   // 急降下(下方=列を貫く)。横へ避けさせる
        }
      }else if(b.move==='form'){       // 群れ：隊形を保ったまま降下＋陣形ごと横にゆれる/流れる(隙間も一緒に動く＝読めて必ず通れる)
        b.sx += (b.dvx||0)*dt;                   // stream=斜めに流れる
        b.cy += (b.vy||0)*dt;                    // 下向きに降りてくる＝プレイヤーへ迫る
        b.x = b.sx + Math.sin(tsec*0.9+b.fph)*(b.sway||6); // 陣形共通位相で一緒に横ゆれ＝穴を追わせる(生きた動き)
        b.y = b.cy + Math.sin(tsec*2+b.ph)*4;
        b.vx = b.dvx||0;                         // 反転は流れ方向のみ(ゆれでパタパタしない)
      }else if(b.move==='static'){      // 雷雲：その場でふわふわ（動かない障害物）
        b.y = b.cy + Math.sin(tsec*1.5+b.ph)*6;
      }else if(b.move==='float'){       // ★フロート：下からゆっくりせり上がる(落としすぎ罰)。横にゆれて存在を示す
        b.cy += (b.rise||FLOAT_RISE)*dt;
        b.x = b.sx + Math.sin(tsec*1.2+b.ph)*10;
        b.y = b.cy + Math.sin(tsec*1.6+b.ph)*5;
      }else if(b.move==='swoop'){       // ★斜めダイブ：自機Xを狙って斜めに突っ込む。Xでよける(全機体可)
        if(b.aim && screenY(b.y) > 30){                         // 画面に入ったら一度だけ自機方向へ舵→以後等速(読んで横へ逃げられる)
          b.vx = Math.sign(hipX - b.x || b.dir) * Math.abs(b.vx); b.aim=false;
        }
        b.cy += b.vyw*dt;                                       // 斜めに降下＝迫ってくる
        b.x  += b.vx*dt;
        b.y = b.cy;
      }else if(b.move==='pulsar'){      // ★パルサー：膨張時は危険、収縮時に抜け道が開く。押す/離すで通過タイミングを作る
        b.cy += (b.vy==null?-BIRD_DESCENT*0.8:b.vy)*dt;
        b.x = b.sx + Math.sin(tsec*1.0+b.ph)*4;
        b.pulse = 0.5+0.5*Math.sin(tsec*4.2+b.ph);
        b.r = PULSAR_R_MIN + (PULSAR_R_MAX-PULSAR_R_MIN)*b.pulse;
        b.y = b.cy + Math.sin(tsec*1.7+b.ph)*3;
      }
      // すり抜け防止：カバの高度スイープ[prevHippoY..hippoY]と鳥の最短縦距離で判定
      const dx=b.x-hipX, lo=Math.min(prevHippoY,hippoY), hi=Math.max(prevHippoY,hippoY);
      const dy=(b.y>hi)?b.y-hi:(b.y<lo)?lo-b.y:0;
      // 上かぶり板=横長の箱当たり / それ以外=円(機体hitWで横幅補正)。gap>0=当たり判定の外側の余白
      const gap = b.box ? Math.max(Math.abs(dx)-(b.hw+hr*0.5), dy-(b.hh+hr*0.45))
                        : Math.hypot(dx/(V.hitW||1), dy) - (b.r*0.78+hr*0.66);
      if(gap<0){
        if(iframe<=0 && !debug.invinc){ hp--; iframe=IFRAME; hitFlash=0.35; b.grazed=true;
          hvel += (hipX<b.x?-1:1)*280;            // 鳥と反対へノックバック＝同じ鳥に押し戻されない
          if(vel<140) vel=140;                    // 少し上へ逃がす＝落ち込んで再衝突を防ぐ
          sfx('hit');
          emitSparkle(hipX, HIPPO_SCR_Y, 8, 160);
          if(hp<=0){ die('hit'); break; } }
      } else if(!b.grazed && b.move!=='static' && iframe<=0){ // ★ニアミス加点：当てずにかすめて離れたら加点+速度ご褒美(攻めて得する)
        if(gap<GRAZE) b.near=true;
        else if(b.near){ b.grazed=true; grazeCombo++; grazeCount++; coinCount++;
          popups.push({ x:b.x, y:screenY(b.y), t:0, txt:'ニアミス+1' });
          sfx('graze');
          emitSparkle(hipX, HIPPO_SCR_Y, 7, 150); if(vel<280) vel+=80; }
      }
    }
    birds=birds.filter(b=>b.y>hippoY-H && b.y<hippoY+H*1.6 && !b.pop && b.x>-120 && b.x<W+120); // 上端=せり上がるフロートが溜まらないよう上もカリング
    const mag=VEH_META[vehIdx].mag;        // マグ=コインを引き寄せる(危険な位置も安全に回収=経済の幅)
    for(const c of coins){ c.t+=dt;        // コイン収集＝スコア(無敵でない＝支配的戦略にならない)
      if(mag){ const ddx=c.x-hipX, ddy=screenY(c.y)-HIPPO_SCR_Y, dd=Math.hypot(ddx,ddy);
        if(dd<MAG_R && dd>1){ const pull=Math.min(0.9,(1-dd/MAG_R)*8*dt); c.x+=(hipX-c.x)*pull; c.y+=(hippoY-c.y)*pull; } }
      const dx=c.x-hipX, dy=screenY(c.y)-HIPPO_SCR_Y;
      if(Math.hypot(dx,dy) < c.r+hr){ c.got=true; collectCount++; const cv=coinVal(); coinCount+=cv; if(cv>1) popups.push({x:c.x,y:screenY(c.y),t:0,txt:'+'+cv}); sfx('coin'); emitSparkle(c.x, screenY(c.y), 10, 150); }
    }
    coins=coins.filter(c=>!c.got && c.y>hippoY-H);
    let inCloud=0;
    for(const bk of banks){ if(Math.abs(screenY(bk.y)-HIPPO_SCR_Y) < bk.h/2) inCloud=1; }
    fog += (inCloud-fog)*Math.min(1,4*dt);
    banks=banks.filter(bk=>bk.y>hippoY-H-bk.h);
    winds=winds.filter(wz=>wz.y1>hippoY-H);
    } // /started
    if(boosting&&started){                              // boost演出は機体メタfxで分岐(flame=ロケット/ジェット / sparkle=風船 / puff=翼・プロペラ)
      const fx=VEH_META[vehIdx].fx;
      if(fx==='flame') emitFlame();
      else if(fx==='sparkle'){ if(Math.random()<0.5) emitSparkle(hipX+(Math.random()-0.5)*40, HIPPO_SCR_Y-DRAW_H.boost*veh().size*0.2, 1, 70); }
      else emitPuff();
    }
  }
  if(scene==='PLAY'){
    if(cleared && Math.random()<0.6) emitSparkle(Math.random()*W, Math.random()*H*0.5, 1, 170); // クリア中の継続キラキラ
    if((dead||cleared) && !runBanked) bankRun();   // 結果に入った瞬間1回だけコインを総額へ加算
  }
  if(!(scene==='PLAY' && paused)){ updateParts(dt); updateSparks(dt);
    if(popups){ for(const p of popups){ p.t+=dt; p.y-=34*dt; } popups=popups.filter(p=>p.t<0.8); } } // ニアミス浮き文字
  if(scene==='PLAY') draw(); else drawMenu();
  syncDOMUI();   // DOMオーバーレイ(タイトル)の表示同期
  if(trans){ const h=trans.t/trans.dur, a=(h<0.5?h/0.5:(1-h)/0.5); // カバーの濃さ 0→1→0
    ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,a));
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1a2640'); g.addColorStop(1,'#0c1124');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=Math.max(0,Math.min(1,a))*0.9; ctx.fillStyle='#fff';   // 中央に小さなロケット閃光(launch感)
    ctx.font='bold 30px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🚀', W/2, H/2 - (h-0.5)*120); ctx.textBaseline='alphabetic'; ctx.restore(); }
  if(debug.on) drawDebug();
  requestAnimationFrame(loop);
}
function die(cause){ if(dead)return; dead=true; deathCause=cause||'hit'; best=Math.max(best,Math.floor(alt)); pressed=false; }
// 結果に入ったらこのランのコインを総額へ加算＋ベスト/★/解放を更新(1回だけ)
function coinVal(){ return Math.max(1, Math.round(VEH_META[vehIdx].coinMul||1)); } // 1コインあたりの価値(ふうせん=2)＝拾った瞬間に効く/見える
function bankRun(){ runBanked=true;
  const sk=stageKey;
  const par=Math.round((stageTop-START_Y)/PXPM*0.22);   // ★パータイム(秒)=高さ×0.22 ※要実機調整
  const fast = cleared && runTime<=par, noHit = cleared && hp>=MAX_HP;
  const baseCoins = collectCount + grazeCount;
  const runCoins = coinCount;                            // 収集はcoinValで拾得時に倍率適用済(coinCount=実取得額)
  const mulBonus = runCoins - baseCoins;                 // 機体の価値ボーナス(ふうせん等で>0)
  const clearBonus = cleared ? 15 : 0;
  const noHitBonus = noHit ? 8 : 0;
  const fastBonus = fast ? 12 : 0;
  let gain = runCoins + clearBonus + noHitBonus + fastBonus;
  lastBreakdown={ collect:collectCount, graze:grazeCount, mulBonus, clearBonus, noHitBonus, fastBonus };
  lastGain=gain; lastPar=par;
  save.coins += gain;
  save.best[sk]=Math.max(save.best[sk]||0, Math.floor(alt));
  save.selected=vehIdx;
  if(cleared){ const st = 1 + (fast?1:0) + (noHit?1:0); // ★=①クリア ②速さ(パー以内) ③ノーダメ
    save.stars[sk]=Math.max(save.stars[sk]||0, st);
    if(!save.bestTime) save.bestTime={};
    save.bestTime[sk]=Math.min(save.bestTime[sk]||1e9, Math.round(runTime));
    const nk=stageAfter(sk); if(nk && !save.unlocked.includes(nk)) save.unlocked.push(nk); }
  saveNow();
}

// 雲スプライトをパララックスで敷く（imgを使い回し・縦に無限ループ）
// blur=奥行き用のぼかし(遠景ほど強く)＝被写界深度で主役を際立て＋単調さ解消
function spriteFade(img){
  if(!img || !img.complete || !img.naturalWidth) return 0;
  if(img.__readyAt==null) img.__readyAt=tsec-0.8;
  return Math.max(0,Math.min(1,(performance.now()/1000-img.__readyAt)/0.8));
}
function drawClouds(img, par, n, baseScale, alpha, sx, blur){
  const fade=spriteFade(img); if(fade<=0 || alpha<=0.01) return;
  if(blur) ctx.filter=`blur(${blur}px)`;
  const span=H+300;
  for(let k=0;k<n;k++){
    const s=baseScale*(0.72+(k*37%62)/100);     // 大きさを散らす
    const w=img.naturalWidth*s, h=img.naturalHeight*s;
    const yy=((((k*span/n) + hippoY*par + Math.sin(k*1.9)*54)%span)+span)%span - 140; // 登る=雲は下へ流れる
    const x=((k*sx + Math.sin(k*2.4)*90)%(W+160))-80;
    ctx.globalAlpha=alpha*fade*(0.62+(k*19%36)/100);
    ctx.save(); ctx.translate(x,yy); if(k%2) ctx.scale(-1,1);
    ctx.drawImage(img, -w/2, -h/2, w, h); ctx.restore();
  }
  ctx.globalAlpha=1; ctx.filter='none';
}

// 雲バンク（中に入ると視界が狭まる・ダメージ無し）。半透明なので鳥はうっすら見える
function drawBanks(){
  for(const bk of banks){ const sy=screenY(bk.y); if(sy<-bk.h||sy>H+bk.h) continue;
    const top=sy-bk.h/2, bot=sy+bk.h/2;
    ctx.fillStyle='rgba(238,244,255,0.60)'; ctx.fillRect(0,top,W,bk.h);
    ctx.fillStyle='rgba(240,246,255,0.85)'; const r=26;
    for(let x=-r;x<W+r;x+=r*1.05){ ctx.beginPath(); ctx.arc(x,top,r,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(x,bot,r,0,7); ctx.fill(); }
  }
}
// ゴールライン（頂上）：後光の光芒＋たわむチェッカー旗＋左右の支柱＋GOALリボン
// 「頂上に張られた決勝バナー」として読ませる＝ベタ帯のはりぼて感を解消。
function goalSag(x){ const t=(x-W/2)/(W/2); return 26*(1-t*t); } // 中央が垂れる放物線(両端0)
function drawGoal(){
  const sy=screenY(stageTop); if(sy>H+110||sy<-160) return;
  const pulse=0.5+0.5*Math.sin(tsec*4);
  // 後光（放射状の光芒＝頂上の達成感）
  ctx.save();
  const halo=ctx.createRadialGradient(W/2,sy,8,W/2,sy,W*0.62);
  halo.addColorStop(0,`rgba(255,238,150,${0.34+0.12*pulse})`);
  halo.addColorStop(0.4,'rgba(255,214,90,0.12)'); halo.addColorStop(1,'rgba(255,214,90,0)');
  ctx.fillStyle=halo; ctx.fillRect(0,sy-W*0.62,W,W*1.24);
  ctx.translate(W/2,sy); ctx.rotate(tsec*0.12);                 // ゆっくり回る光芒
  for(let i=0;i<12;i++){ ctx.rotate(Math.PI/6);
    ctx.fillStyle=`rgba(255,233,150,${0.05+0.04*pulse})`;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-12,-W*0.7); ctx.lineTo(12,-W*0.7); ctx.fill(); }
  ctx.restore();
  // 支柱（左右・丸い柱＋てっぺんに玉）
  const bh=30, postW=11, edgeY=sy;                              // 端のバナー中心高
  for(const px of [postW/2+6, W-postW/2-6]){
    const top=edgeY-bh/2-4;
    ctx.fillStyle='#c0452e'; rr(px-postW/2, top, postW, 84, postW/2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.22)'; rr(px-postW/2+1.5, top+2, 3, 70, 1.5); ctx.fill();
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(px, top-2, postW*0.7,0,7); ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle='rgba(150,90,0,0.5)'; ctx.stroke();
  }
  // たわむチェッカー旗：上下のたわみ曲線で帯をクリップしてからチェッカーを敷く
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, sy+goalSag(0)-bh/2);
  for(let x=0;x<=W;x+=12) ctx.lineTo(x, sy+goalSag(x)-bh/2);
  for(let x=W;x>=0;x-=12) ctx.lineTo(x, sy+goalSag(x)+bh/2);
  ctx.closePath(); ctx.clip();
  const cs=15;
  for(let x=0;x<W;x+=cs){ const oy=sy+goalSag(x+cs/2)-bh/2;
    for(let r=0;r<2;r++){ ctx.fillStyle=(((x/cs|0)+r)%2)?'#fbfdff':'#262b38'; ctx.fillRect(x, oy+r*cs, cs+1, cs+1); } }
  // 旗の上に光沢
  const sh=ctx.createLinearGradient(0,sy-bh/2,0,sy+bh/2);
  sh.addColorStop(0,'rgba(255,255,255,0.28)'); sh.addColorStop(0.5,'rgba(255,255,255,0)'); sh.addColorStop(1,'rgba(0,0,0,0.18)');
  ctx.fillStyle=sh; ctx.fillRect(0,sy-bh/2-30,W,bh+60);
  ctx.restore();
  // GOALリボン（中央の丸ピル＋文字）
  const ry=sy+goalSag(W/2)+bh/2+18, rw=118, rh=34;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,0.3)'; ctx.shadowBlur=8; ctx.shadowOffsetY=3;
  rr(W/2-rw/2, ry-rh/2, rw, rh, rh/2); ctx.fillStyle='#ff8a2e'; ctx.fill(); ctx.restore();
  rr(W/2-rw/2, ry-rh/2, rw, rh, rh/2); ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.stroke();
  ctx.font='bold 22px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=4; ctx.strokeStyle='rgba(120,50,0,0.7)'; ctx.fillStyle='#fff7df';
  ctx.strokeText('GOAL', W/2, ry+1); ctx.fillText('GOAL', W/2, ry+1); ctx.textBaseline='alphabetic';
}
// 横風の演出：風向きに横へ流れるシェブロン（右=>/左=<）
// 風ゾーン演出：規則的なシェブロンのタイル貼りをやめ、風で寝た「斜めの雨/風ストリーク」へ。
// 長さ・濃さ・太さをばらつかせ規則性(=安っぽさ)を消し、傾きで風向きを伝える。薄めで主役を邪魔しない。
function drawWindFX(){
  if(windDir===0) return;
  const dir=windDir>0?1:-1;
  ctx.lineCap='round';
  const N=24, spX=tsec*900*dir, spY=tsec*430;   // 横=風で強く流れる(>縦) / 縦=雨で落ちる
  const wrapX=W+200, wrapY=H+200;
  for(let i=0;i<N;i++){
    const seed=i*101+7;
    const x=(((seed*53)%wrapX + spX)%wrapX + wrapX)%wrapX - 100;
    const y=(((seed*89)%wrapY + spY)%wrapY + wrapY)%wrapY - 100;
    const len=26+(seed%5)*10;                    // 長さのばらつき
    const a=0.11+(seed%4)*0.05;                  // 濃さのばらつき(薄め)
    ctx.strokeStyle=`rgba(208,226,255,${a})`; ctx.lineWidth=1.4+(seed%2)*0.9;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dir*len*1.5, y+len*0.42); ctx.stroke(); // 吹き付ける=横に強く寝た斜め
  }
}
// アーチ式スピードメーター（真上=0 / 右=上昇(緑) / 左=落下(橙)・固定スケール＋機体MAXマーカー）
function drawSpeedo(){
  const cx=W/2, cy=Math.round(H*0.80), R=60, A0=Math.PI, A1=2*Math.PI, UP=1.5*Math.PI;
  const REF_RISE=V_RISE, REF_FALL=V_FALL*1.1, V=veh();
  ctx.save();
  ctx.fillStyle='rgba(18,22,32,0.42)';
  ctx.beginPath(); ctx.arc(cx,cy,R+9,A0,A1); ctx.closePath(); ctx.fill();
  ctx.lineWidth=7; ctx.lineCap='round';
  ctx.strokeStyle='#ff7a4d'; ctx.beginPath(); ctx.arc(cx,cy,R,A0,UP); ctx.stroke();      // 落下(左)
  ctx.strokeStyle='#46e0a0'; ctx.beginPath(); ctx.arc(cx,cy,R,UP,A1); ctx.stroke();      // 上昇(右)
  ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=1.5;                            // 目盛り
  for(let i=0;i<=8;i++){ const a=A0+(A1-A0)*i/8;
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*(R-9),cy+Math.sin(a)*(R-9)); ctx.lineTo(cx+Math.cos(a)*(R+2),cy+Math.sin(a)*(R+2)); ctx.stroke(); }
  // 機体ごとの最高速マーカー
  const aR=UP+Math.min(1,V.vrise*V_RISE/REF_RISE)*(Math.PI/2);
  const aF=UP-Math.min(1,V.vfall*V_FALL/REF_FALL)*(Math.PI/2);
  ctx.lineWidth=3;
  ctx.strokeStyle='#d6ffec'; ctx.beginPath(); ctx.moveTo(cx+Math.cos(aR)*(R-12),cy+Math.sin(aR)*(R-12)); ctx.lineTo(cx+Math.cos(aR)*(R+5),cy+Math.sin(aR)*(R+5)); ctx.stroke();
  ctx.strokeStyle='#ffd4c2'; ctx.beginPath(); ctx.moveTo(cx+Math.cos(aF)*(R-12),cy+Math.sin(aF)*(R-12)); ctx.lineTo(cx+Math.cos(aF)*(R+5),cy+Math.sin(aF)*(R+5)); ctx.stroke();
  // 針
  let ang = vel>=0 ? UP+Math.min(1,vel/REF_RISE)*(Math.PI/2) : UP-Math.min(1,-vel/REF_FALL)*(Math.PI/2);
  ctx.strokeStyle='#fff'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ang)*(R-6),cy+Math.sin(ang)*(R-6)); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,4,0,7); ctx.fill();
  // ラベルは弧の外(下側)＝弧や針と被らない。黒縁で明背景でも読める
  ctx.font='bold 11px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='center';
  ctx.lineJoin='round'; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,0.7)';
  ctx.strokeText('落下', cx-R-2, cy+15); ctx.fillStyle='#ffb59a'; ctx.fillText('落下', cx-R-2, cy+15);
  ctx.strokeText('上昇', cx+R+2, cy+15); ctx.fillStyle='#9af0c8'; ctx.fillText('上昇', cx+R+2, cy+15);
  ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.font='bold 16px "M PLUS Rounded 1c",system-ui';
  ctx.strokeText(Math.round(Math.abs(vel)/PXPM), cx, cy-R-4); ctx.fillStyle='#fff'; ctx.fillText(Math.round(Math.abs(vel)/PXPM), cx, cy-R-4);
  ctx.restore();
}
// 機体ステータスバー（エアライド風）
function drawStats(x,y){
  // 大きさ(回避)はバーに出さない＝機体スプライトのサイズ変化そのもので伝える
  const V=veh(), rows=[
    ['加速',(V.thrust-0.6)/0.42],
    ['軽さ',(1.1-V.grav)/0.74],
    ['旋回',(V.smax-150)/210],
  ];
  ctx.fillStyle='rgba(18,22,32,0.34)'; ctx.fillRect(x-6,y-4,128,51);
  ctx.textAlign='left';
  for(let i=0;i<rows.length;i++){
    const n=Math.max(0,Math.min(1,rows[i][1])), yy=y+i*15;
    ctx.font='10px "M PLUS Rounded 1c",system-ui'; ctx.fillStyle='#cdd6e6'; ctx.fillText(rows[i][0], x, yy+9);
    for(let s=0;s<5;s++){ ctx.fillStyle = s<Math.round(n*5)?'#7ec8ff':'rgba(255,255,255,0.18)';
      ctx.fillRect(x+36+s*11, yy+1, 8, 8); }
  }
}

// アウトライン付きHUD文字（明るい/暗い背景どちらでも読める＝黒縁＋本色）
function hudText(t,x,y,fill){ ctx.lineJoin='round'; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,0.7)';
  ctx.strokeText(t,x,y); ctx.fillStyle=fill; ctx.fillText(t,x,y); }
// ===== 構造UI（コードで立体的に）=====
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function shade(hex,d){ const n=parseInt(hex.slice(1),16); // #rrggbb を d だけ明暗
  const cl=v=>Math.max(0,Math.min(255,v));
  return `rgb(${cl((n>>16)+d)},${cl(((n>>8)&255)+d)},${cl((n&255)+d)})`; }
// 角丸カード：影＋縦グラデ＋淡い縁＝浮いて見える
function panel(x,y,w,h,r,fill,stroke){
  ctx.save(); ctx.shadowColor='rgba(0,0,0,0.30)'; ctx.shadowBlur=18; ctx.shadowOffsetY=8;
  rr(x,y,w,h,r);
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'rgba(48,56,86,0.80)'); g.addColorStop(1,'rgba(26,32,54,0.80)');
  ctx.fillStyle=fill&&fill[0]==='r'?fill:g; ctx.fill(); ctx.restore();
  rr(x,y,w,h,r); ctx.lineWidth=1.5; ctx.strokeStyle=stroke||'rgba(255,255,255,0.16)'; ctx.stroke();
  // 上面の淡いハイライト(光沢)
  rr(x+3,y+3,w-6,h*0.42,r*0.8); ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.fill();
}
function pill(cx,cy,w,h,color,label){ btnDraw(cx,cy,w,h,label,color,false); } // 旧API互換
// ★押せるボタン：暖色グラデ＋ドロップ影＋上面ハイライト＋縁＋押下スケール＋登録。色は1つ渡せば自動で陰影。
function btnDraw(cx,cy,w,h,label,color,interactive){
  const base=color||'#ff7a2f';
  const press = interactive && pointer.down && Math.abs(pointer.x-cx)<w/2 && Math.abs(pointer.y-cy)<h/2;
  const s=press?0.95:1, ww=w*s, hh=h*s, x=cx-ww/2, y=cy-hh/2, r=hh/2;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.30)'; ctx.shadowBlur=press?5:12; ctx.shadowOffsetY=press?2:6;
  rr(x,y,ww,hh,r);
  const g=ctx.createLinearGradient(0,y,0,y+hh); g.addColorStop(0,shade(base,38)); g.addColorStop(1,shade(base,-16));
  ctx.fillStyle=g; ctx.fill(); ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  rr(x+2.5,y+2.5,ww-5,hh*0.46,r*0.8); ctx.fillStyle='rgba(255,255,255,0.30)'; ctx.fill();  // 上面ツヤ
  rr(x,y,ww,hh,r); ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.stroke(); // 縁
  ctx.font=`bold ${Math.round(hh*0.40)}px "M PLUS Rounded 1c",system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(60,30,5,0.35)'; ctx.fillText(label,cx,cy+2.5);   // 文字の落ち影
  ctx.fillStyle='#fff'; ctx.fillText(label,cx,cy+1); ctx.textBaseline='alphabetic';
  ctx.restore();
}
function btn(cx,cy,w,h,label,fn,color){ btnDraw(cx,cy,w,h,label,color,true); hotspots.push({x:cx-w/2,y:cy-h/2,w,h,fn}); }
function drawStar(cx,cy,r,color){
  const grd=ctx.createRadialGradient(cx-r*0.3,cy-r*0.4,r*0.1,cx,cy,r*1.1); // 立体感(上が明るい)
  grd.addColorStop(0,'#fff7cf'); grd.addColorStop(0.5,color); grd.addColorStop(1,'#e89a18');
  ctx.beginPath();
  for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=(i%2)?r*0.45:r;
    const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath(); ctx.fillStyle=grd; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(120,70,0,0.45)'; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath();             // ツヤ(ハイライト点)
  ctx.ellipse(cx-r*0.28,cy-r*0.34,r*0.16,r*0.1,-0.5,0,7); ctx.fill(); }
function drawGainBreakdown(cx,y){
  const b=lastBreakdown||{collect:0,graze:0,mulBonus:0,clearBonus:0,noHitBonus:0,fastBonus:0};
  const rows=[
    ['収集', b.collect],
    ['ニアミス', b.graze],
    ['機体ボーナス', b.mulBonus],
    ['クリア', b.clearBonus],
    ['ノーダメ', b.noHitBonus],
    ['速さ', b.fastBonus],
  ].filter(r=>r[1]);
  ctx.font='bold 11px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='center';
  if(!rows.length){ hudText('内訳なし',cx,y,'#9aa8c0'); return; }
  const gap=86;
  for(let i=0;i<rows.length;i++){
    const row=Math.floor(i/3), col=i%3, rowLen=Math.min(3, rows.length-row*3);
    const x0=cx-(rowLen-1)*gap/2, x=x0+col*gap, yy=y+row*22;
    ctx.fillStyle='rgba(255,255,255,0.10)'; rr(x-38,yy-12,76,18,9); ctx.fill();
    hudText(rows[i][0],x,yy-1,'#cfe0ff');
    hudText('+'+rows[i][1],x,yy+12,'#ffd23f');
  }
}
// ★上かぶり(ペリカン板)：穴の真上にかぶさる横長の塊。"下に潜って脇から抜けろ"が見て分かる形＝広い翼＋下向きの影。
//  spriteがあれば使い、無ければコード描画(横長・下面に危険影)。
function drawPelican(x,sy,hw,hh){
  const img=sprites.pelican, bw=hw*2.0, bh=hh*3.0;
  if(img&&img.complete&&img.naturalWidth){ const dw=bw*1.7, dh=dw*(img.naturalHeight/img.naturalWidth);
    ctx.save(); ctx.translate(x,sy); ctx.shadowColor='rgba(0,0,0,0.35)'; ctx.shadowBlur=8; ctx.shadowOffsetY=5;
    ctx.drawImage(img,-dw/2,-dh/2,dw,dh); ctx.restore(); return; }
  ctx.save(); ctx.translate(x,sy);
  // 下面の危険影(ここをくぐる合図)
  const us=ctx.createLinearGradient(0,0,0,bh*1.4); us.addColorStop(0,'rgba(20,26,40,0.4)'); us.addColorStop(1,'rgba(20,26,40,0)');
  ctx.fillStyle=us; ctx.beginPath(); ctx.ellipse(0,bh*0.5,bw*0.95,bh*0.9,0,0,7); ctx.fill();
  // 翼(左右に広がる)
  ctx.fillStyle='#5b6680';
  ctx.beginPath(); ctx.moveTo(-bw*0.2,0); ctx.quadraticCurveTo(-bw*1.05,-bh*0.5,-bw*1.15,bh*0.15); ctx.quadraticCurveTo(-bw*0.7,bh*0.2,-bw*0.2,bh*0.2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(bw*0.2,0); ctx.quadraticCurveTo(bw*1.05,-bh*0.5,bw*1.15,bh*0.15); ctx.quadraticCurveTo(bw*0.7,bh*0.2,bw*0.2,bh*0.2); ctx.closePath(); ctx.fill();
  // 胴体(横長ドーム)
  const g=ctx.createLinearGradient(0,-bh,0,bh); g.addColorStop(0,'#8b97b0'); g.addColorStop(1,'#535d75');
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,bw,bh,0,0,7); ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(30,36,52,0.5)'; ctx.stroke();
  // くちばし(下向き)＋目
  ctx.fillStyle='#e8a33c'; ctx.beginPath(); ctx.moveTo(-bw*0.16,bh*0.5); ctx.lineTo(bw*0.16,bh*0.5); ctx.lineTo(0,bh*1.25); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#1b2233'; ctx.beginPath(); ctx.arc(-bw*0.34,-bh*0.1,2.4,0,7); ctx.arc(bw*0.34,-bh*0.1,2.4,0,7); ctx.fill();
  ctx.restore();
}
// ★フロート(下脅威)：下からせり上がる泡/クラゲ。鳥と別物に見える半透明ドーム＋触手＋上昇の泡。
function drawFloat(x,sy,r,ph){
  const img=sprites.float;
  if(img&&img.complete&&img.naturalWidth){ const dh=r*2.4, dw=dh*(img.naturalWidth/img.naturalHeight);
    ctx.save(); ctx.globalAlpha=0.95; ctx.drawImage(img,x-dw/2,sy-dh/2,dw,dh); ctx.restore(); return; }
  const pulse=0.5+0.5*Math.sin(tsec*3+ph);
  ctx.save(); ctx.translate(x,sy);
  ctx.globalAlpha=0.25; ctx.fillStyle='#7fe0ff'; ctx.beginPath(); ctx.arc(0,0,r*1.5,0,7); ctx.fill(); // 光輪
  ctx.globalAlpha=0.9;
  const g=ctx.createRadialGradient(-r*0.3,-r*0.4,r*0.2,0,0,r); g.addColorStop(0,'#e7fbff'); g.addColorStop(0.6,'#67c8ef'); g.addColorStop(1,'#4a7fd6');
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,-r*0.15,r,r*0.85*(0.94+0.12*pulse),0,Math.PI,0); ctx.fill(); // ドーム(上半分)
  ctx.beginPath(); ctx.ellipse(0,-r*0.15,r,r*0.4,0,0,Math.PI); ctx.fill();                                   // 下の縁
  ctx.strokeStyle='rgba(40,90,150,0.6)'; ctx.lineWidth=2;                                                     // 触手
  for(let i=-2;i<=2;i++){ const tx=i*r*0.34; ctx.beginPath(); ctx.moveTo(tx,r*0.2);
    ctx.quadraticCurveTo(tx+Math.sin(tsec*4+i)*5, r*0.7, tx+Math.sin(tsec*4+i+1)*4, r*1.15); ctx.stroke(); }
  ctx.globalAlpha=0.5; ctx.fillStyle='#dffbff';                                                               // 上昇する泡
  ctx.beginPath(); ctx.arc(r*0.2,-r*1.1-pulse*6,2.2,0,7); ctx.arc(-r*0.3,-r*1.5-pulse*4,1.6,0,7); ctx.fill();
  ctx.restore();
}
// ★パルサー：発光球の膨張収縮。危険な最大時を赤い外輪、通れる最小時を青白い芯で見せる。
function drawPulsar(x,sy,r,ph,pulse){
  const p = pulse==null ? 0.5+0.5*Math.sin(tsec*4.2+ph) : pulse;
  ctx.save(); ctx.translate(x,sy);
  ctx.globalAlpha=0.18+0.18*p; ctx.fillStyle='#ff5775';
  ctx.beginPath(); ctx.arc(0,0,PULSAR_R_MAX*1.18,0,7); ctx.fill();
  ctx.globalAlpha=0.55+0.3*p; ctx.strokeStyle='#ff365f'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(0,0,r+5*p,0,7); ctx.stroke();
  const g=ctx.createRadialGradient(-r*0.25,-r*0.3,r*0.1,0,0,r);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.42,'#bff9ff'); g.addColorStop(1,p>0.55?'#ff5f88':'#4fb7ff');
  ctx.globalAlpha=0.92; ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
  ctx.globalAlpha=0.55; ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,0,PULSAR_R_MIN,0,7); ctx.stroke(); // 縮小時の安全目安
  ctx.restore();
}
// デバッグ描画：当たり判定の可視化＋情報HUD＋キー一覧(手触り検証用)
function drawDebug(){
  const V=veh(), hr=HIPPO_R*V.size;
  if(debug.hit && scene==='PLAY'){
    ctx.lineWidth=1.5;
    ctx.strokeStyle='rgba(60,255,130,0.95)'; ctx.beginPath(); ctx.arc(hipX,HIPPO_SCR_Y,hr*0.66,0,7); ctx.stroke();      // 自機当たり
    ctx.strokeStyle='rgba(255,225,0,0.5)';  ctx.beginPath(); ctx.arc(hipX,HIPPO_SCR_Y,hr*0.66+GRAZE,0,7); ctx.stroke();// グレイズ域
    for(const b of birds){ const sy=screenY(b.y); if(sy<-60||sy>H+60) continue;
      ctx.strokeStyle='rgba(255,70,70,0.95)';
      if(b.box){ ctx.strokeRect(b.x-b.hw, sy-b.hh, b.hw*2, b.hh*2); }
      else { ctx.beginPath(); ctx.arc(b.x,sy,b.r*0.78,0,7); ctx.stroke(); } }
    ctx.strokeStyle='rgba(120,200,255,0.7)';
    for(const c of coins){ const sy=screenY(c.y); if(sy<-40||sy>H+40) continue; ctx.beginPath(); ctx.arc(c.x,sy,c.r,0,7); ctx.stroke(); }
  }
  ctx.textAlign='left'; ctx.font='bold 11px monospace';
  const beat=(scene==='PLAY')?(()=>{const bs=stage().beats,cb=bs[Math.min(beatI,bs.length-1)];return cb?cb.type:'頂上';})():'-';
  const lines=[
    'DEBUG[P]  inv[I]:'+(debug.invinc?'ON':'·')+'  hitbox[H]:'+(debug.hit?'ON':'·'),
    'fps'+Math.round(fps)+' vel'+Math.round(vel)+' hp'+hp+' t'+runTime.toFixed(1)+' '+(scene==='PLAY'?'beat:'+beat:scene),
    'veh:'+veh().name+'  coins:'+save.coins,
    'U=全解放  C/1-6=機体  J=+150m  K=頂上' ];
  let yy = (scene==='PLAY')? 150 : 96;
  for(const t of lines){ ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(8,yy-10,t.length*6.7+8,15);
    ctx.fillStyle='#9dffb0'; ctx.fillText(t,12,yy); yy+=16; }
}
function draw(){
  hotspots=[];   // 結果画面のボタン領域を毎フレーム再構築
  const sky=Math.min(alt/300,1), SK=stage().sky;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${SK[0][0]-sky*40},${SK[0][1]-sky*30},${SK[0][2]-sky*20})`);
  g.addColorStop(1,`rgb(${SK[1][0]-sky*30},${SK[1][1]-sky*20},${SK[1][2]-sky*10})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // 雲（3層パララックス）。低高度は近景を抑えて「地上から発射している」感じを残す
  const cloudFade=Math.max(0.25,1-sky*0.5), cn=stageKey==='B'?1:0;
  let midCloud=Math.max(0,Math.min(1,(alt-55)/190));
  let nearCloud=Math.max(0,Math.min(1,(alt-170)/260));
  if(stageKey==='B'){ midCloud=Math.max(midCloud,0.9); nearCloud=Math.max(nearCloud,0.75); } // 雲海は突入直後から雲を敷く(登ってから初描画される問題)
  drawClouds(sprites.cloud_small, 0.10, 4+cn*2, 0.075, (0.22+0.28*midCloud)*cloudFade, 199, 4.2); // 最遠：低高度でも薄く見える
  // 大気ヘイズ：最遠の雲を空色側へ薄く沈めて奥行きを出す（上ほど濃い）
  { const hz=ctx.createLinearGradient(0,0,0,H);
    hz.addColorStop(0,`rgba(${SK[0][0]},${SK[0][1]},${SK[0][2]},0.28)`); hz.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=hz; ctx.fillRect(0,0,W,H); }
  drawClouds(sprites.cloud_small, 0.18, 4+cn*2, 0.12, 0.66*cloudFade*midCloud, 137, 1.8); // 中景：少し登ってから濃く
  drawClouds(sprites.cloud_big,   0.32, 2+cn*2, 0.20, 0.82*cloudFade*nearCloud, 311);      // 近景：序盤は出しすぎない

  drawWind();

  // 地面まわり（遠景の丘→地面板→発射台。すべて画像）
  const gy=screenY(0);
  if(gy<H+80){
    const hl=sprites.hills;
    if(hl.complete&&hl.naturalWidth){ const hh=hl.naturalHeight*W/hl.naturalWidth;
      ctx.drawImage(hl, 0, gy+6-hh, W, hh); }           // 丘：底を接地線あたりに
    const gr=sprites.ground;
    if(gr.complete&&gr.naturalWidth){ ctx.drawImage(gr, 0, gy, W, H-gy+40); }
    else { ctx.fillStyle='#6e5836'; ctx.fillRect(0,gy,W,H-gy+40); }
    const pd=sprites.pad;
    if(pd.complete&&pd.naturalWidth){ const pw=104, ph=pd.naturalHeight*pw/pd.naturalWidth;
      ctx.drawImage(pd, HIPPO_X-pw/2, gy-ph*0.30, pw, ph); } // 発射台：天面が接地線に来るよう配置
  }

  // コイン（収集物・くるくる＝横スケールで回転感／淡い光輪）。コードで描く＝軽い・色替え自由
  for(const c of coins){ const sy=screenY(c.y); if(sy<-40||sy>H+40) continue;
    const bob=Math.sin(c.t*3)*4, spin=Math.abs(Math.cos(c.t*3.2)); // spin=横幅で回転を表現
    ctx.save(); ctx.translate(c.x, sy+bob);
    ctx.globalAlpha=0.30; ctx.fillStyle='#ffe06a';
    ctx.beginPath(); ctx.arc(0,0,c.r*1.7,0,7); ctx.fill(); ctx.globalAlpha=1;
    const grd=ctx.createRadialGradient(-c.r*0.3,-c.r*0.3,c.r*0.2,0,0,c.r);
    grd.addColorStop(0,'#fff3b0'); grd.addColorStop(0.55,'#ffcf3a'); grd.addColorStop(1,'#e89a18');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.ellipse(0,0,Math.max(2,c.r*spin),c.r,0,0,7); ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='rgba(150,90,0,0.5)'; ctx.stroke();
    if(spin>0.45){ ctx.strokeStyle='rgba(180,110,0,0.45)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-c.r*0.28,-c.r*0.34); ctx.quadraticCurveTo(-c.r*0.54,0,-c.r*0.20,c.r*0.36); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(c.r*0.18,-c.r*0.38); ctx.quadraticCurveTo(c.r*0.46,-0.02,c.r*0.12,c.r*0.34); ctx.stroke(); }
    ctx.restore();
  }

  drawBanks(); // 雲バンク（鳥より奥・うっすら透ける）

  // 鳥（スプライト・進行方向に反転）
  for(const b of birds){ const sy=screenY(b.y); if(sy<-60||sy>H+60) continue;
    if(b.move==='diver' && b.armed && b.t<0.9){ // 急降下の予告：狙う"列"を縦の赤ビームで明示＝横へ逃げろ
      const p=0.5+0.5*Math.sin(tsec*20), a=0.2+0.3*p;
      const g=ctx.createLinearGradient(0,sy,0,H);
      g.addColorStop(0,`rgba(255,60,60,${0.05})`); g.addColorStop(1,`rgba(255,60,60,${a})`);
      ctx.fillStyle=g; ctx.fillRect(b.x-b.r*0.9, sy, b.r*1.8, H-sy);
      ctx.strokeStyle=`rgba(255,80,80,${0.5+0.4*p})`; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(b.x,sy,b.r*1.4+p*5,0,7); ctx.stroke();
    }
    if(b.move==='swoop' && sy<H*0.5){ // ★斜めダイブ予告：進む向きに点線の軌道ヒント(まだ上にいる間だけ＝読んで横へ逃げる)
      const p=0.5+0.5*Math.sin(tsec*16), vlen=Math.hypot(b.vx||1,Math.abs(b.vyw||300));
      const ux=(b.vx||0)/vlen, uy=Math.abs(b.vyw||300)/vlen;   // 画面では下向き＝+y
      ctx.strokeStyle=`rgba(255,95,70,${0.4+0.35*p})`; ctx.lineWidth=2.5; ctx.setLineDash([10,8]);
      ctx.beginPath(); ctx.moveTo(b.x,sy); ctx.lineTo(b.x+ux*150, sy+uy*150); ctx.stroke(); ctx.setLineDash([]);
    }
    if(b.cap){ drawPelican(b.x, sy, b.hw, b.hh); continue; }        // ★上かぶり板
    if(b.move==='float'){ drawFloat(b.x, sy, b.r, b.ph); continue; } // ★フロート
    if(b.move==='pulsar'){ drawPulsar(b.x, sy, b.r, b.ph, b.pulse); continue; } // ★パルサー
    const def=BIRD[b.type], img=sprites[b.sprite||def.sprite];
    if(img&&img.complete&&img.naturalWidth){
      const dh=def.drawH*(b.ds||1), dw=dh*(img.naturalWidth/img.naturalHeight);
      const bob=Math.sin(tsec*11+b.cy*0.05)*dh*0.03; // 羽ばたきの微ゆれ(code)
      ctx.save(); ctx.translate(b.x,sy+bob);
      ctx.scale(b.vx<0?-1:1,1);                       // 原画は右向き→左進行で反転
      // 接地影：スプライトが背景に"乗る"よう柔らかい落ち影(カバと統一＝貼っただけ感の解消)
      ctx.shadowColor='rgba(0,0,0,0.28)'; ctx.shadowBlur=6; ctx.shadowOffsetY=4;
      ctx.drawImage(img,-dw/2,-dh/2,dw,dh);
      ctx.restore();
    } else {
      ctx.fillStyle='#d8607a';
      ctx.beginPath(); ctx.arc(b.x,sy,b.r,0,7); ctx.fill();
    }
  }

  drawGoal();    // ゴールライン（頂上）
  drawWindFX();  // 風ゾーンのシェブロン

  drawParts();
  if(VEH_META[vehIdx].mag && started && !dead && !cleared){ const p=0.5+0.5*Math.sin(tsec*3); // マグの吸引範囲(淡いリング)
    ctx.strokeStyle=`rgba(130,205,255,${0.12+0.07*p})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(hipX,HIPPO_SCR_Y,MAG_R*(0.92+0.05*p),0,7); ctx.stroke(); }
  drawHippo();
  drawSparks();
  // ニアミス浮き文字（攻めて得した手応え）
  if(popups) for(const p of popups){ const a=1-p.t/0.8;
    ctx.font='bold 14px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='center';
    ctx.lineWidth=3; ctx.strokeStyle=`rgba(40,20,0,${0.6*a})`; ctx.strokeText(p.txt,p.x,p.y);
    ctx.fillStyle=`rgba(255,224,120,${a})`; ctx.fillText(p.txt,p.x,p.y); }

  // 雲の中＝視界が狭まる（カバの周りだけ見える）
  if(fog>0.01){
    const clear=Math.max(70, 250*(1-fog));
    const g=ctx.createRadialGradient(hipX,HIPPO_SCR_Y,clear*0.4,hipX,HIPPO_SCR_Y,clear+170);
    g.addColorStop(0,'rgba(244,248,255,0)');
    g.addColorStop(1,`rgba(244,248,255,${0.82*fog})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  // 被弾フラッシュ（赤）
  if(hitFlash>0){ ctx.fillStyle=`rgba(220,40,40,${0.32*(hitFlash/0.35)})`; ctx.fillRect(0,0,W,H); }

  // HUD背景スクリム（明るい空/霧でも文字が読めるよう、上部bandを軽く暗くフェード）
  { const sg=ctx.createLinearGradient(0,0,0,132);
    sg.addColorStop(0,'rgba(0,0,0,0.42)'); sg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sg; ctx.fillRect(0,0,W,132); }

  // HUD（プレイ中のみ。クリア/死亡は専用パネルを出すのでプレイHUDは隠す＝雑然さ解消）
  if(!cleared && !dead){
  ctx.font='bold 30px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='left'; ctx.fillStyle='#fff';
  ctx.fillText(Math.floor(Math.max(0,(hippoY-START_Y)/PXPM))+' m',16,46); // 今の高さ(落ちれば下がる)
  ctx.font='14px "M PLUS Rounded 1c",system-ui'; ctx.fillStyle='#eef'; ctx.fillText('BEST '+best+' m',16,68);
  ctx.font='bold 13px "M PLUS Rounded 1c",system-ui'; ctx.fillStyle='#fff';
  ctx.fillText('のりもの：'+veh().name,16,90);
  btn(54,116,82,34,'停止',pauseGame,'#5a6b8c');

  // HP（ハート・右上／右から減る）
  ctx.font='22px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='left';
  const hx=W-8-MAX_HP*26;
  for(let i=0;i<MAX_HP;i++){
    ctx.fillStyle = i<hp ? '#ff4d6d' : 'rgba(255,255,255,0.25)';
    ctx.fillText('♥', hx+i*26, 34);
  }

  // コイン枚数（ハートの下・金）
  ctx.textAlign='right'; ctx.font='bold 16px "M PLUS Rounded 1c",system-ui';
  drawCoinIcon(W-8-46,49,7);
  hudText('×'+coinCount, W-8, 55, '#ffe7a0');

  drawSpeedo();          // 速度メーター（下部中央・カバとは重ならない）
  if(canSwapVeh()) drawStats(14,100);  // 詳細ステータスは停止時(選択時)だけ＝飛行中はHUDをすっきり(変更ロック中で見る必要が薄い)
  // ゴール進捗バー（右端）＋あと何m
  { const prog=Math.max(0,Math.min(1,(hippoY-START_Y)/(stageTop-START_Y)));
    const bX=W-9,bY=120,bH=H-300;
    ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.fillRect(bX,bY,6,bH);
    ctx.fillStyle='#ffd23f'; ctx.fillRect(bX,bY+bH*(1-prog),6,bH*prog);
    ctx.font='bold 11px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='right';
    hudText('あと'+Math.max(0,Math.ceil((stageTop-hippoY)/PXPM))+'m', bX-4, bY-4, '#ffe7a0'); } // 進捗バーの左に寄せる=重なり/見切れ防止

  // ステージ名＋現在ビート（検証用）。黒縁で明/暗どちらの空でも読める
  ctx.font='bold 13px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='center';
  { const bs=stage().beats, cb=bs[Math.min(beatI,bs.length-1)];   // 全ビート消化後(頂上間近)はbeatI=長さ→未定義参照でクラッシュ防止のためクランプ
    hudText(stage().name+'（'+(cb?cb.type:'頂上')+'）', W/2, 18, '#fff'); }
  if(windDir!==0){ ctx.font='bold 13px "M PLUS Rounded 1c",system-ui';
    hudText(windDir>0?'→ 横風':'← 横風', W/2, 34, '#bfe0ff'); }
  }  // /プレイ中HUD

  if(!started&&!dead&&!cleared){ ctx.textAlign='center'; ctx.font='bold 18px "M PLUS Rounded 1c",system-ui';
    hudText('押してスタート',W/2,H*0.4,'#fff'); }

  if(paused && !dead && !cleared){ ctx.fillStyle='rgba(8,12,24,0.58)'; ctx.fillRect(0,0,W,H);
    const pw=300,ph=246,px=(W-pw)/2,py=H*0.25; ctx.textAlign='center';
    panel(px,py,pw,ph,22,'rgba(30,36,54,0.96)','rgba(255,255,255,0.14)');
    ctx.font='bold 30px "M PLUS Rounded 1c",system-ui'; hudText('一時停止',W/2,py+48,'#fff');
    ctx.font='bold 14px "M PLUS Rounded 1c",system-ui'; hudText(Math.floor(Math.max(0,(hippoY-START_Y)/PXPM))+'m / コイン '+coinCount,W/2,py+78,'#cfe0ff');
    btn(W/2,py+118,176,44,'つづける',resumeGame,'#ffb02e');
    btn(W/2,py+168,176,44,'リトライ',()=>go(relaunch),'#ff5d7a');
    btn(W/2,py+218,176,44,'そうびへ',()=>go(()=>{ paused=false; pressed=false; ptrActive=false; scene='SELECT'; }),'#5a6b8c'); }

  if(dead){ ctx.fillStyle='rgba(8,12,24,0.62)'; ctx.fillRect(0,0,W,H);
    const pw=310,ph=258,px=(W-pw)/2,py=H*0.22; ctx.textAlign='center';
    panel(px,py,pw,ph,22,'rgba(30,36,54,0.96)','rgba(255,255,255,0.12)');
    ctx.font='bold 28px "M PLUS Rounded 1c",system-ui';
    hudText(deathCause==='fall'?'墜落…':'ぶつかった！',W/2,py+44,'#ff8aa0');
    ctx.font='bold 40px "M PLUS Rounded 1c",system-ui'; hudText(Math.floor(alt)+' m',W/2,py+90,'#fff');
    ctx.font='bold 15px "M PLUS Rounded 1c",system-ui'; hudText('コイン +'+lastGain+'  （所持 '+save.coins+'枚）',W/2,py+118,'#ffd23f');
    drawGainBreakdown(W/2,py+146);
    btn(W/2-72,py+ph-30,128,42,'リトライ',()=>go(relaunch),'#ff5d7a');
    btn(W/2+78,py+ph-30,116,42,'そうび',()=>go(()=>scene='SELECT'),'#5a6b8c'); }

  if(cleared){ ctx.fillStyle='rgba(14,20,44,0.62)'; ctx.fillRect(0,0,W,H);
    drawSparks();
    const pw=318,ph=302,px=(W-pw)/2,py=H*0.17; ctx.textAlign='center';
    const gg=ctx.createRadialGradient(W/2,py+96,20,W/2,py+96,210);   // 金の後光
    gg.addColorStop(0,'rgba(255,224,120,0.34)'); gg.addColorStop(1,'rgba(255,224,120,0)');
    ctx.fillStyle=gg; ctx.fillRect(0,py-70,W,ph+140);
    panel(px,py,pw,ph,24,'rgba(36,31,20,0.95)','rgba(255,214,90,0.55)');
    ctx.font='bold 30px "M PLUS Rounded 1c",system-ui'; hudText('ステージクリア！',W/2,py+46,'#ffe06a');
    const stN=save.stars[stageKey]||1, sy0=py+88;
    for(let i=0;i<3;i++){ const on=i<stN, pop=1+(on?0.12*Math.sin(tsec*6+i):0);
      ctx.globalAlpha=on?1:0.28; drawStar(W/2+(i-1)*46, sy0, 16*pop, '#ffd23f'); ctx.globalAlpha=1; }
    ctx.font='bold 14px "M PLUS Rounded 1c",system-ui';
    hudText('タイム '+Math.round(runTime)+'s（★は '+lastPar+'s以内＋ノーダメ）',W/2,py+122,'#cfe0ff');
    ctx.font='bold 15px "M PLUS Rounded 1c",system-ui'; hudText('コイン +'+lastGain+'  （所持 '+save.coins+'枚）',W/2,py+148,'#ffd23f');
    drawGainBreakdown(W/2,py+178);
    const nk=stageAfter(stageKey);
    if(nk&&STAGES[nk]) btn(W/2-72,py+ph-30,128,42,'つぎへ',()=>go(afterClear),'#ffb02e');
    else              btn(W/2-72,py+ph-30,128,42,'もういちど',()=>go(relaunch),'#ffb02e');
    btn(W/2+78,py+ph-30,116,42,'そうび',()=>go(()=>scene='SELECT'),'#5a6b8c'); }
}
// ===== メニュー画面（TITLE / SELECT / SHOP）＝canvasで描画＋hotspotでタップ =====
function drawMenuClouds(){ // tsecでゆっくり横に流れる3層(hippoY非依存)
  const enter=Math.min(1, sceneT/0.4);                    // 画面入場で雲をふわっと出す(popの解消)
  const defs=[ {img:sprites.cloud_small,n:6,s:0.12,a:0.50,spd:7, blur:3, y:0.18},
               {img:sprites.cloud_small,n:5,s:0.18,a:0.72,spd:13,blur:1, y:0.48},
               {img:sprites.cloud_big,  n:3,s:0.27,a:0.92,spd:20,blur:0, y:0.78} ];
  for(const d of defs){ if(!d.img||!d.img.complete||!d.img.naturalWidth) continue;
    const fade=spriteFade(d.img)*enter; if(fade<=0) continue;
    if(d.blur) ctx.filter=`blur(${d.blur}px)`;
    const w=d.img.naturalWidth*d.s, h=d.img.naturalHeight*d.s, span=W+w+90;
    for(let k=0;k<d.n;k++){ const x=((k*span/d.n + tsec*d.spd)%span) - w/2 - 45;
      const y=H*d.y + Math.sin(tsec*0.3+k*1.7)*7 + (k%2)*26 - 18 + (1-enter)*16; // 入場で少し下から
      ctx.globalAlpha=d.a*fade*(0.68+(k*17%30)/100);
      ctx.save(); if(k%2){ ctx.translate(x+w/2,y); ctx.scale(-1,1); ctx.drawImage(d.img,-w/2,-h/2,w,h); }
      else ctx.drawImage(d.img, x, y - h/2, w, h); ctx.restore(); }
  }
  ctx.globalAlpha=1; ctx.filter='none';
}
function menuBG(){ // 動く空：グラデ＋陽光グロー＋流れる雲＋浮遊ボケ＋ビネット
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#8fc3ff'); g.addColorStop(0.55,'#aed6ff'); g.addColorStop(1,'#d6e9ff');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const sun=ctx.createRadialGradient(W*0.82,H*0.10,8,W*0.82,H*0.10,300);
  sun.addColorStop(0,'rgba(255,250,222,0.6)'); sun.addColorStop(1,'rgba(255,250,222,0)');
  ctx.fillStyle=sun; ctx.fillRect(0,0,W,H);
  drawMenuClouds();
  for(let i=0;i<11;i++){ const sd=i*97+13, x=(sd*53)%W, base=(sd*89)%H;     // ふわふわ浮く光
    const y=((base - tsec*9 - i*7)%(H+60)+(H+60))%(H+60)-30, r=7+(sd%5)*5, a=0.05+(sd%4)*0.025;
    ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
  const vg=ctx.createRadialGradient(W/2,H*0.46,H*0.34,W/2,H*0.5,H*0.74);     // ビネットで締める
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(20,32,64,0.24)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

}
