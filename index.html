  ctx.fillStyle=lg; ctx.fillText('カバロケット',0,0); ctx.restore();
  ctx.font='bold 14px "M PLUS Rounded 1c",system-ui'; hudText('押して のぼる・離して おちる',W/2,H*0.25+32,'#eaf2ff');
  coinHud();
  btn(54,30,82,34,'設定',()=>{ resetConfirm=false; scene='SETTINGS'; },'#5a6b8c');
  const pulse=1+Math.sin(tsec*3)*0.03; btn(W/2,H*0.52,224*pulse,56*pulse,'タップでスタート',()=>scene='SELECT','#ff7a2f');
}
function drawSettings(){
  ctx.textAlign='center'; ctx.font='bold 22px "M PLUS Rounded 1c",system-ui'; hudText('設定',W/2,58,'#fff'); coinHud();
  const pw=320, ph=390, px=(W-pw)/2, py=H*0.19;
  panel(px,py,pw,ph,20,'rgba(20,26,40,0.70)','rgba(255,255,255,0.14)');
  ctx.font='bold 16px "M PLUS Rounded 1c",system-ui'; hudText('サウンド',W/2,py+48,'#eaf2ff');
  btn(W/2,py+88,180,42,save.settings.mute?'音 OFF':'音 ON',()=>{ save.settings.mute=!save.settings.mute; if(!save.settings.mute){ audioCtx=null; sfx('buy'); } saveNow(); }, save.settings.mute?'#5a6b8c':'#46a0e0');
  ctx.font='bold 16px "M PLUS Rounded 1c",system-ui'; hudText('横ドラッグ感度',W/2,py+140,'#eaf2ff');
  const sensOpts=[['ひかえめ',0.8],['ふつう',1.0],['すばやい',1.25]];
  for(let i=0;i<sensOpts.length;i++){ const [label,val]=sensOpts[i], on=Math.abs((save.settings.sens||1)-val)<0.02;
    btn(W/2-92+i*92,py+180,84,38,label,()=>{ save.settings.sens=val; saveNow(); },on?'#ffb02e':'#46557a'); }
  ctx.font='bold 16px "M PLUS Rounded 1c",system-ui'; hudText('進行データ',W/2,py+238,'#eaf2ff');
  ctx.font='13px "M PLUS Rounded 1c",system-ui';
  hudText('所持コイン・購入機体・ステージ解放を初期化',W/2,py+268,'#cdd6e6');
  const resetLabel = resetConfirm ? '本当に削除' : 'セーブ削除';
  btn(W/2,py+312,180,44,resetLabel,()=>{ if(resetConfirm) resetSaveData(); else resetConfirm=true; }, resetConfirm?'#ff4f68':'#8a4f66');
  if(resetConfirm){ ctx.font='bold 12px "M PLUS Rounded 1c",system-ui'; hudText('もう一度押すと消えます',W/2,py+348,'#ffb7c4'); }
  btn(W/2,py+ph-46,150,44,'もどる',()=>{ resetConfirm=false; scene='TITLE'; },'#5a6b8c');
}
function drawSelect(){
  // 不正値ガード：選択は所持機体・ステージは解放分から
  if(!save.owned.includes(save.selected)) save.selected=0;
  if(!save.unlocked.includes(stageKey)) stageKey=save.unlocked[0]||'A';
  vehIdx=save.selected;                       // プレビュー/ステータスを選択中に同期
  ctx.textAlign='center'; ctx.font='bold 22px "M PLUS Rounded 1c",system-ui'; hudText('そうび せんたく',W/2,52,'#fff'); coinHud();
  btn(54,30,82,34,'設定',()=>{ resetConfirm=false; scene='SETTINGS'; },'#5a6b8c');
  const y=H*0.29, owned=save.owned.slice().sort((a,b)=>a-b);
  let si=owned.indexOf(save.selected); if(si<0) si=0;
  panel(W/2-166, y-68, 332, 232, 22);          // 機体情報カード(雲背景から分離して読みやすく)
  function pickOwned(d){ const ni=(si+d+owned.length)%owned.length; save.selected=owned[ni]; saveNow(); }
  if(owned.length>1){
    const pi=owned[(si-1+owned.length)%owned.length], ni=owned[(si+1)%owned.length];
    ctx.globalAlpha=0.68; vehChip(W/2-108,y+8,28,pi,false); vehChip(W/2+108,y+8,28,ni,false); ctx.globalAlpha=1;
    btn(W/2-148,y+8,42,42,'‹',()=>pickOwned(-1),'#46557a');
    btn(W/2+148,y+8,42,42,'›',()=>pickOwned(1),'#46557a');
    hotspots.push({x:W/2-136,y:y-24,w:64,h:64,fn:()=>pickOwned(-1)});
    hotspots.push({x:W/2+72,y:y-24,w:64,h:64,fn:()=>pickOwned(1)});
  }
  vehChip(W/2,y,58,save.selected,true);
  // 選択中の名前・説明・簡易ステータス
  ctx.textAlign='center'; ctx.font='bold 20px "M PLUS Rounded 1c",system-ui'; hudText(VEHICLES[save.selected].name,W/2,y+76,'#fff');
  ctx.font='12px "M PLUS Rounded 1c",system-ui'; hudText(VEH_META[save.selected].desc,W/2,y+99,'#cdd6e6');
  drawStats(W/2-64,y+116);
  // ステージ選択(解放分)
  ctx.textAlign='center'; ctx.font='bold 13px "M PLUS Rounded 1c",system-ui'; hudText('ステージ',W/2,y+208,'#eaf2ff');
  const us=STAGE_ORDER.filter(s=>save.unlocked.includes(s)), sgx=96, sx0=W/2-(us.length-1)*sgx/2, sy=y+236;
  for(let k=0;k<us.length;k++){ const s=us[k], on=s===stageKey, cx=sx0+k*sgx;
    btn(cx,sy,86,40, STAGES[s].name, ()=>{ stageKey=s; }, on?'#ffb02e':'#46557a');
    const st=save.stars[s]||0, best=save.best[s]||0, bt=save.bestTime&&save.bestTime[s];
    ctx.font='10px "M PLUS Rounded 1c",system-ui'; hudText('★'.repeat(st)+'☆'.repeat(3-st),cx,sy+33,st?'#ffd23f':'#cdd6e6');
    ctx.font='9px "M PLUS Rounded 1c",system-ui'; hudText((best?best+'m':'--')+(bt?' / '+bt+'s':''),cx,sy+48,'#cdd6e6'); }
  // 出撃 / ショップ
  btn(W/2-80,H*0.86,150,52,'出撃！',()=>go(launch),'#ff7a3c');
  btn(W/2+92,H*0.86,116,52,'ショップ',()=>scene='SHOP','#46a0e0');
}
function drawShop(){
  ctx.textAlign='center'; ctx.font='bold 22px "M PLUS Rounded 1c",system-ui'; hudText('ショップ',W/2,52,'#fff'); coinHud();
  const list=[]; for(let i=0;i<VEHICLES.length;i++) if(VEH_META[i].buy) list.push(i);
  let y=104;
  for(const i of list){ const owned=save.owned.includes(i), m=VEH_META[i];
    panel(24,y,W-48,70,14,'rgba(20,26,40,0.55)','rgba(255,255,255,0.12)');
    vehChip(58,y+35,26,i,false);
    ctx.textAlign='left'; ctx.font='bold 16px "M PLUS Rounded 1c",system-ui'; hudText(VEHICLES[i].name,96,y+28,'#fff');
    ctx.font='11px "M PLUS Rounded 1c",system-ui'; ctx.fillStyle='#cdd6e6'; ctx.fillText(m.desc,96,y+50);
    if(owned){ ctx.textAlign='right'; ctx.font='bold 14px "M PLUS Rounded 1c",system-ui'; hudText('所持ずみ',W-44,y+40,'#9af0c8'); }
    else { const afford=save.coins>=m.price; btn(W-86,y+35,104,42,m.price+'枚',()=>buyVeh(i),afford?'#ffb02e':'#566'); }
    y+=84;
  }
  btn(W/2,H*0.9,170,50,'もどる',()=>scene='SELECT','#5a6b8c');
}
function drawMenu(){ hotspots=[]; menuBG();
  const ap=Math.min(1, sceneT/0.22), e=1-(1-ap)*(1-ap);   // フェードイン(イーズ)
  ctx.save(); ctx.globalAlpha=e;
  if(scene==='TITLE') drawTitle();
  else if(scene==='SHOP') drawShop();
  else if(scene==='SETTINGS') drawSettings();
  else drawSelect();
  ctx.restore();
  drawSparks();
}
// スクショ撮影モード（Geminiの視覚レビュー用）：?cap&stage=A&veh=1 で自動上昇
(function(){ const Q=new URLSearchParams(location.search);
  if(Q.has('reset')){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} loadSave(); vehIdx=0; save.selected=0; } // ?reset=セーブ初期化(テスト用)
  if(Q.has('debug')){ debug.on=true; unlockAll(); if(Q.get('debug')==='hit') debug.hit=true; }   // ?debug=ON+全解放+コイン(?debug=hitで当たり可視化も)
  if(Q.has('cap')){ scene='PLAY'; if(Q.get('stage')) stageKey=Q.get('stage'); if(Q.get('veh')) vehIdx=+Q.get('veh');
    reset(); markStage(); started=true; pressed=!Q.has('hold');
    if(Q.has('hold')){ window.__capHold=true; vel=0; }              // ?hold=高度固定で敵だけ降下=ゲート構図を確認
    const a=+Q.get('alt'); if(a){ hippoY=START_Y+a*PXPM; vel=Q.has('hold')?0:200; } // 指定高度へ瞬間移動して敵を画面に出す
    if(Q.get('pose')==='fall'){ window.__capHold=true; pressed=false; vel=-200; } // ?pose=fall=落下スプライト確認(状態を凍結)
    const dm=Q.get('demo');                                          // ?demo=over/float=新敵を1つだけ画面中央に固定表示(他は出さない)
    if(dm){ window.__capHold=true; vel=0; birds.length=0; coins.length=0; nextSpawn=stageTop+1;
      if(dm==='over')  spawnOverhang(hippoY-90);
      if(dm==='float') spawnFloat(hippoY+150);
      if(dm==='swoop'){ spawnSwoop(hippoY+150, 1); const b=birds[birds.length-1]; b.x=W*0.30; b.aim=false; b.vx=150; b.vyw=-220; } // 斜めダイブ＋軌道ヒント(短budgetで撮る)
      if(dm==='dive')  spawnDive(hippoY+120);
      if(dm==='pulsar') spawnPulsar(hippoY+120);
      for(const b of birds){ b.vy=0; b.rise=0; if(b.move!=='swoop'){ } } }   // demoは降下/上昇を止めて中央固定(swoopはx移動のみ短時間)
    if(Q.get('show')==='dead'){ alt=Math.max(alt,a||120); die(Q.get('cause')||'hit'); } } // 死亡パネルの視覚確認用(&cause=fall/hit)
  else if(Q.get('screen')){ scene=Q.get('screen'); if(Q.get('coins')) save.coins=+Q.get('coins'); } // ?screen=TITLE/SELECT/SHOP でメニューを撮影(検証用)
})();
// DOMタイトルのボタン配線
{ const st=document.getElementById('t-start'); if(st&&st.addEventListener) st.addEventListener('click', e=>{ e.stopPropagation(); initAudio(); sfx('tap'); go(()=>{ scene='SELECT'; }); });
  const gr=document.getElementById('t-gear'); if(gr&&gr.addEventListener) gr.addEventListener('click', e=>{ e.stopPropagation(); initAudio(); sfx('tap'); resetConfirm=false; scene='SETTINGS'; }); }
requestAnimationFrame(loop);
</script>
