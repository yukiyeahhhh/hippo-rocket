<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>hippo-rocket — 試作（スプライト版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#1b1f2a;overflow:hidden;
    font-family:"M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{background:#0e1118;box-shadow:0 0 40px #000a;border-radius:6px;}
  #hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#8a93a6;font-size:11px;padding:0 8px;}
  #veh button,#stage button{font:700 13px "M PLUS Rounded 1c",system-ui;margin:0 4px;padding:8px 14px;border-radius:13px;
    border:1px solid rgba(255,255,255,0.14);color:#eef2fb;cursor:pointer;
    background:linear-gradient(180deg,rgba(70,80,108,0.92),rgba(40,46,66,0.92));
    box-shadow:0 3px 8px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.18);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    transition:transform .08s ease,box-shadow .12s ease,background .12s ease;}
  #veh button:hover,#stage button:hover{transform:translateY(-1px);
    box-shadow:0 5px 12px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.22);}
  #veh button:active,#stage button:active{transform:translateY(1px);}
  #stage button.on{color:#3a2a08;border-color:rgba(255,255,255,0.5);
    background:linear-gradient(180deg,#ffd564,#ffae2e);
    box-shadow:0 3px 10px rgba(255,150,30,0.5),inset 0 1px 0 rgba(255,255,255,0.6);}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hint">長押し＝上昇 / 離す＝落下　・　←→ or A/D（PCはドラッグ）＝横移動　・　上＝ステージ / 下＝のりもの切替</div>
<div id="stage" style="position:fixed;top:8px;left:0;right:0;text-align:center;">
  <button data-s="A">ステージA 群れの空</button>
  <button data-s="B">ステージB 雲海</button>
  <button data-s="C">ステージC 嵐</button>
</div>
<div id="veh" style="position:fixed;bottom:30px;left:0;right:0;text-align:center;">
  <button data-v="0">1 ふつう</button>
  <button data-v="1">2 つばさ</button>
  <button data-v="2">3 ふうせん</button>
  <button data-v="3">4 こつぶ</button>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 432, H = 768;
function fit(){
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  cv.width = W; cv.height = H;
  cv.style.width = (W*s)+'px'; cv.style.height = (H*s)+'px';
}
addEventListener('resize', fit); fit();

// ===== スプライト読込 =====
const sprites = {};
for(const n of ['idle','boost','fall','hit','power','bird_small','bird_large','hawk','storm',
  'ground','pad','hills','cloud_big','cloud_small','star',
  'veh_tsubasa','veh_fuusen','veh_kotsubu']){ const im=new Image(); im.src='assets/sprites/'+n+'.png'; sprites[n]=im; }
const DRAW_H = { idle:78, boost:78, fall:74, hit:46, power:84 }; // 表示高さ(身長基準)
// 鳥タイプ定義：原画は右向き。進行方向(vx)が左ならflip。
// 種類＝動き方を結びつける（見て分かる＆リズムが出る）：
//   small … 速い「斜めジグザグ」（自分の高度帯の中で反射しながら飛び回る）
//   large … 遅い「ゆらゆら」（横ゆっくり＋上下サインで漂う・圧）
const BIRD = {
  small: { sprite:'bird_small', r:15, drawH:50, spd:[110, 80, 50] }, // [base, diff係数, ランダム幅] 速い小群れ=横断
  large: { sprite:'bird_large', r:30, drawH:98, spd:[44, 40, 22] },  // 遅い壁=横断
};

// ===== チューニング =====
const GRAV=1500, THRUST=2500, V_RISE=540, V_FALL=980;
const HIPPO_X=W*0.5, HIPPO_SCR_Y=H*0.55, HIPPO_R=24, PXPM=18;
const MAX_HP=3, IFRAME=1.2; // HP個数 / 被弾後の無敵秒数
const START_Y=38;           // 開始時の高度＝地面に接地して見える値(浮き解消)

// 乗り物：基準(ふつう)に対する性能。横移動は任意の第2軸。
//  thrust=上がりやすさ倍率 / grav=重さ(大きいほど速く落ちる)倍率 / steer=横の曲がり(px/秒) / size=体の大きさ(当たり&見た目)
//  thrust=上がりやすさ(加速) / vrise=最高上昇速度 / grav=落ち始めの加速(重さ) / vfall=落下の最高速度
//  smax=横の最高速度 / sacc=横の加速(=止まりにくさ。小さいほど慣性が強い) / size=体の大きさ
//  hitW=当たり判定の横幅倍率(>1で横長=上の障害に当たりやすい)
const VEHICLES = [
  { name:'ふつう',   thrust:1.0,  vrise:1.0,  grav:1.0,  vfall:1.0,  smax:235, sacc:1500, size:1.0, hitW:1.0 }, // 万能の基準
  { name:'つばさ',   thrust:0.5,  vrise:0.66, grav:0.34, vfall:0.34, smax:430, sacc:3000, size:1.0, hitW:1.0 }, // 上昇かなり苦手/超ふわ滑空/横は俊敏=滞空して横で避ける
  { name:'ふうせん', thrust:0.95, vrise:1.0,  grav:0.3,  vfall:0.28, smax:120, sacc:560,  size:1.0, hitW:1.8 }, // よく浮きほぼ落ちない代わりに横長=上の障害に当たりやすい高リスク/横は鈍重
  { name:'こつぶ',   thrust:0.78, vrise:0.7,  grav:1.05, vfall:1.2,  smax:330, sacc:2100, size:0.55,hitW:0.85 }, // 力弱く落ちやすいが極小=隙間に強い/キビキビ
];
let vehIdx=0;
function veh(){ return VEHICLES[vehIdx]; }
// 機体ごとの見た目：背中のリグだけ違う別スプライト。★カバ本体は全機体「同じ体高」で描画＝大小はveh().sizeで出す。
//  base=飛行ポーズの原画 / bodyH=画像高に占める"カバ本体"の比率(体基準で正規化) / cy=体の中心が画像上のどこか(縦アンカー)
//  ふつう(0)=null＝従来の状態スプライト(idle/boost/fall)を使う。他は idle/boost/fall をbaseで上書きしcode演出で状態差を出す。
const VEH_ART = [
  null,
  { base:'veh_tsubasa', bodyH:0.95, cy:0.52 }, // 羽=横長・体はほぼ全高
  { base:'veh_fuusen',  bodyH:0.5,  cy:0.74 }, // 横に広がる3風船で吊る=体は下半分。横長=hitW1.8とセット
  { base:'veh_kotsubu', bodyH:0.82, cy:0.56 }, // プロペラ=やや縦長
];

// ===== ステージ＝決め打ちビート列（覚えて対策できる／緩急を手で設計）=====
// 連続湧きビートの設定。swarm/elite/wind はビート開始時の特別処理（下記 spawnAhead 参照）
//  bgap=鳥の間隔 / big=大鳥率 / coins=コイン帯(収集) / cloud=雲バンク(視界減)
const BEATCFG = {
  calm:    { bgap:[620,140], big:0.14, cloud:false }, // 息抜き(静)=陣形を疎に、均等リズムで1つずつ
  trickle: { bgap:[520,140], big:0.22, cloud:false }, // 薄い圧
  dense:   { bgap:[400,120], big:0.36, cloud:false, tight:true }, // 急(密な降下陣形)
  bonus:   { bgap:[230, 90], big:0,    coins:true,  cloud:false, nobird:true }, // コイン回廊=敵なしのご褒美/集中(緩)
  cloud:   { bgap:[500,140], big:0.24, cloud:true },
};
// 3ステージ＝コンセプト違い。各ステージ内で緩急カーブを持ち、ビート合計＝頂上（到達でクリア・finite）
const STAGES = {
  // A 群れの空＝陣形ゲートの隙間読みが主役(得意=つばさ)。★区間で緩急を設計：導入(静)→波(急)→コイン回廊(ご褒美/集中)→休符(静)→…→クライマックス→ゴール前(静)
  A: { name:'群れの空', rec:'つばさ', sky:[[135,180,230],[175,205,235]], beats:[
    /* 導入(静) */      {type:'calm',len:600},
    /* 第1波(急・軽) */ {type:'trickle',len:420},{type:'swarm',len:60,shape:'line'},
                        {type:'trickle',len:400},{type:'swarm',len:60,shape:'vee'},
                        {type:'trickle',len:400},{type:'swarm',len:60,shape:'stream'},
    /* コイン回廊 */    {type:'bonus',len:560},
    /* 休符(静) */      {type:'calm',len:480},
    /* 第2波(急・密) */ {type:'trickle',len:380},{type:'swarm',len:70,shape:'arc'},
                        {type:'dense',len:560},
                        {type:'trickle',len:380},{type:'swarm',len:70,shape:'line'},
                        {type:'dense',len:560},
    /* コイン回廊 */    {type:'bonus',len:540},
    /* 休符(静) */      {type:'calm',len:460},
    /* 第3波(急・密) */ {type:'trickle',len:380},{type:'swarm',len:80,shape:'vee'},
                        {type:'dense',len:580},
                        {type:'trickle',len:380},{type:'swarm',len:80,shape:'stream'},
    /* コイン回廊 */    {type:'bonus',len:520},
    /* 休符(静) */      {type:'calm',len:440},
    /* クライマックス(畳み掛け) */ {type:'swarm',len:70,shape:'line'},{type:'trickle',len:300},
                        {type:'swarm',len:80,shape:'vee'},{type:'dense',len:600},
                        {type:'swarm',len:90,shape:'arc'},{type:'trickle',len:300},
                        {type:'swarm',len:100,shape:'stream'},
    /* ゴール前(静) */  {type:'calm',len:560},
  ]},
  // B 雲海＝霧で視界を奪い、霧から潜むタカ(得意=こつぶ)。★区間：導入→霧+タカ(急/持続)→コイン回廊(視界回復のご褒美)→休符→…
  B: { name:'雲海', rec:'こつぶ', sky:[[150,165,185],[200,210,222]], beats:[
    /* 導入(静) */      {type:'calm',len:520},
    /* 霧帯1(持続) */   {type:'cloud',len:960,elite:true},
    /* コイン回廊 */    {type:'bonus',len:520},
    /* 休符(静) */      {type:'calm',len:420},
    /* 霧帯2 */         {type:'cloud',len:1040,elite:true},{type:'trickle',len:320},
                        {type:'cloud',len:1040,elite:true},
    /* コイン回廊 */    {type:'bonus',len:500},
    /* 休符(静) */      {type:'calm',len:420},
    /* 霧帯3 */         {type:'cloud',len:1120,elite:true},{type:'dense',len:460},
                        {type:'cloud',len:1120,elite:true},
    /* コイン回廊 */    {type:'bonus',len:500},
    /* 休符(静) */      {type:'calm',len:420},
    /* クライマックス(濃霧連続) */ {type:'cloud',len:1180,elite:true},{type:'dense',len:460},
                        {type:'cloud',len:1200,elite:true},
    /* ゴール前(静) */  {type:'calm',len:540},
  ]},
  // C 嵐＝横風で流されつつ雷雲の隙間を抜ける(得意=ふつう)。★区間：導入(無風)→風+壁(急)→コイン回廊(無風のご褒美)→休符→…→クライマックス→ゴール前(静)
  C: { name:'嵐', rec:'ふつう', sky:[[80,95,130],[120,135,165]], beats:[
    /* 導入(無風・静) */ {type:'calm',len:520},
    /* 嵐1(風+壁) */    {type:'wind',len:560,dir:1},{type:'obstacle',len:60},{type:'wind',len:540,dir:1},
    /* コイン回廊(無風) */ {type:'bonus',len:500},
    /* 休符(静) */      {type:'calm',len:420},
    /* 嵐2 */           {type:'wind',len:580,dir:-1},{type:'obstacle',len:60},{type:'wind',len:560,dir:-1},
                        {type:'trickle',len:320},
                        {type:'wind',len:580,dir:1},{type:'obstacle',len:60},{type:'wind',len:560,dir:1},
    /* コイン回廊 */    {type:'bonus',len:500},
    /* 休符(静) */      {type:'calm',len:420},
    /* 嵐3 */           {type:'wind',len:600,dir:-1},{type:'obstacle',len:60},{type:'wind',len:580,dir:-1},
                        {type:'trickle',len:320},
                        {type:'wind',len:600,dir:1},{type:'obstacle',len:60},{type:'wind',len:580,dir:1},
    /* コイン回廊 */    {type:'bonus',len:500},
    /* 休符(静) */      {type:'calm',len:420},
    /* クライマックス(連続嵐) */ {type:'wind',len:620,dir:-1},{type:'obstacle',len:60},{type:'wind',len:600,dir:-1},
                        {type:'obstacle',len:60},{type:'wind',len:600,dir:1},
    /* ゴール前(静) */  {type:'calm',len:560},
  ]},
};

let hippoY, vel, boosting, birds, nextSpawn, alt, best=0, dead, started;
let parts, sparks, windPhase, tsec, hp, iframe, hitFlash;
let coins, banks, winds, fog, deathCause, coinCount;  // スター無敵は廃止＝コイン収集(支配的戦略を除去/避ける以外の正の動機)
let hipX, hvel;                 // カバの横位置・横速度
const WIND_ACC=650;             // 横風＝横速度に加わる外力。機体のsacc/smaxで抵抗力が変わる（縦進行は止めない）
let stageKey='A';
function stage(){ return STAGES[stageKey]; }
function stageTopY(){ let t=0; for(const b of stage().beats) t+=(b.len||1); return START_Y + Math.round(t/PXPM/100)*100*PXPM; } // 頂上=ビート合計を100m刻みに丸め(切りよく)
function nextStageKey(){ const ks=Object.keys(STAGES); return ks[(ks.indexOf(stageKey)+1)%ks.length]; }
let beatI, beatStartY, beatEndY, beatSpawned, windDir; // ビートカーソル / 現在の風向き(0=無風)
let stageTop, cleared;          // 頂上の高さ / クリア済みフラグ

function reset(){
  hippoY=START_Y; hipX=HIPPO_X; hvel=0; vel=0; boosting=false;
  birds=[]; banks=[]; winds=[]; nextSpawn=560; alt=0; dead=false; started=false;
  parts=[]; sparks=[]; windPhase=0; tsec=0;
  hp=MAX_HP; iframe=0; hitFlash=0;
  coins=[]; coinCount=0; fog=0; windDir=0;
  beatI=0; beatStartY=START_Y; beatEndY=START_Y+stage().beats[0].len; beatSpawned=false;
  stageTop=stageTopY(); cleared=false;
}
reset();

function nextBeat(){
  const S=stage(); beatI++;
  if(beatI>=S.beats.length) return;   // finite：これ以上は無い（spawnAheadのstageTopガードで止まる）
  beatStartY=beatEndY; beatEndY=beatStartY + (S.beats[beatI].len||1); beatSpawned=false;
}
// ★敵スポーンは1つに統一(綺麗な"降下陣形")。混在(向かってくる/横スライド)とぐちゃぐちゃを排す:
//  ・全部まっすぐ降りてくる(vy・向かってくる)。横移動するのは「斜めストリーム」パターンの時だけ(dvx)。
//  ・穴は常に1つ・画面内・広め。形は「横一列」基本、たまに「穴を頂点にしたV字」。slope/2穴/ランダム揺れは廃止。
//  ・隊形は共通位相で固まって動く＝綺麗な1枚の壁に見える。
const SPAWN_TOP_PAD=260; // 降下する敵は予告時間が要る=画面上端のかなり上で作り、見てから避けられるように
function aheadSpawnY(y){ return Math.max(y, hippoY + HIPPO_SCR_Y + SPAWN_TOP_PAD); }
function spawnBird(y, cfg){
  const big = Math.random()<cfg.big, t = big?'large':'small', def=BIRD[t];
  const spacing = big ? 150 : (cfg.tight ? 78 : 92);
  const diagonal = !big && Math.random()<0.22;                          // 斜めストリーム(この時だけ横移動)
  const vy  = big ? -(34+Math.random()*12) : -(56+Math.random()*22);    // 降下=向かってくる(一定・見てから避けられる速さ)
  const dvx = diagonal ? (Math.random()<0.5?-1:1)*(82+Math.random()*28) : 0; // 横移動は斜めの時だけ
  const useVee = !big && !diagonal && Math.random()<0.3;                // たまにV字(穴を頂点)
  const veeDir = Math.random()<0.5?1:-1;
  const gapW = (big?186:152)+Math.random()*14;                          // 穴は広め
  const gapX = gapW/2+28 + Math.random()*Math.max(0,(W-gapW-56));       // 穴は常に1つ・画面内
  const ph = Math.random()*6.28;                                       // 隊形共通位相(固まって動く)
  for(let x=28; x<=W-28; x+=spacing){
    if(Math.abs(x-gapX)<gapW/2) continue;                              // 穴を空ける
    const yy = useVee ? y + veeDir*(Math.abs(x-gapX)/(W*0.5))*76 : y;  // V字は穴を頂点に開く(穴が読める)
    birds.push({ type:t, move:'form', r:def.r, cy:yy, y:yy, x, sx:x, dvx, vy, fph:ph, ph });
  }
}
// 群れ＝整列フォーメーション。必ず通れる隙間を1つ残し、重ねない（哲学）。
// 群れ全体が横にゆっくり揺れて"飛んでる"＝静止して見えない（隙間は群れごと平行移動するので保たれる）
function spawnForm(y, shape){
  const gapW=150+Math.random()*40;                     // 隙間を広めに(自機幅＋余裕)＝1マスよけのストレス低減
  const gapX=(gapW/2+30)+Math.random()*Math.max(0,(W-gapW-60));
  const spacing=70, fph=Math.random()*6.28, ph=Math.random()*6.28; // fph/ph=群れ共通の揺れ位相
  const dvx=(Math.random()<0.5?-1:1)*(38+Math.random()*28); // 群れ全体の横流れ＝隊形ごと通り過ぎる
  for(let x=34; x<=W-34; x+=spacing){
    if(Math.abs(x-gapX) < gapW/2) continue;
    let yy=y;
    if(shape==='vee')      yy = y + (Math.abs(x-W/2)/(W/2))*110 - 55;
    else if(shape==='arc') yy = y - Math.sin(x/W*Math.PI)*88 + 44;
    else if(shape==='stream') yy = y + ((x-34)/(W-68))*150 - 75; // 斜めの帯
    birds.push({ type:'small', move:'form', r:BIRD.small.r, cy:yy, y:yy, x, sx:x, dvx, fph, ph });
  }
}
function spawnDiver(y){ // 鋭いタカ：一定だけ追尾→ダッシュで離脱（道に居座らない・テンポの良い脅威）
  birds.push({ type:'large', move:'diver', sprite:'hawk', r:BIRD.large.r*1.05, ds:1.25, cy:y, y, x:60+Math.random()*(W-120), t:0 });
}
function spawnObstacles(y){ // 雷雲＝静止障害物。必ず通れる隙間を1つ残す
  const gapW=150+Math.random()*40, gapX=(gapW/2+30)+Math.random()*(W-gapW-60);
  for(let x=70; x<=W-70; x+=140){
    if(Math.abs(x-gapX)<gapW/2) continue;
    birds.push({ type:'large', move:'static', sprite:'storm', r:BIRD.large.r*1.1, ds:1.3, cy:y+(Math.random()-0.5)*40, y, x, ph:Math.random()*6.28 });
  }
}
function spawnAhead(){
  while(nextSpawn < hippoY + H + 200 && nextSpawn < stageTop){ // finite：頂上より上には湧かさない
    if(nextSpawn >= beatEndY) nextBeat();
    if(beatI >= stage().beats.length) break;   // 念のため範囲ガード
    const B=stage().beats[beatI];
    if(B.type==='swarm'){ if(!beatSpawned){ const y=aheadSpawnY(beatStartY+50); if(y<stageTop) spawnBird(y, {big:0, tight:true}); beatSpawned=true; } nextSpawn=Math.max(nextSpawn,beatEndY); } // swarm=密な降下陣形(spawnBirdに統一=横スライドのまま残らない)
    else if(B.type==='elite'){ if(!beatSpawned){ const y=aheadSpawnY(beatStartY+50); if(y<stageTop) spawnDiver(y); beatSpawned=true; } nextSpawn=Math.max(nextSpawn,beatEndY); }
    else if(B.type==='obstacle'){ if(!beatSpawned){ const y=aheadSpawnY(beatStartY+50); if(y<stageTop) spawnObstacles(y); beatSpawned=true; } nextSpawn=Math.max(nextSpawn,beatEndY); }
    else if(B.type==='wind'){ if(!beatSpawned){ winds.push({y0:beatStartY, y1:beatEndY+90, dir:B.dir}); beatSpawned=true; } nextSpawn=Math.max(nextSpawn,beatEndY); } // y1を少し延長=間の障害物ビートも風で覆う(風に抗って隙間へ寄せる)
    else {
      const cfg=BEATCFG[B.type], diff=Math.min(alt/40,1);
      if(cfg.cloud && !beatSpawned){ // 厚い霧＝上下2枚の雲バンク＋その中に強敵が潜む
        const mid=(beatStartY+beatEndY)/2, span=beatEndY-beatStartY;
        banks.push({ y:mid-span*0.22, h:210+Math.random()*150 });
        banks.push({ y:mid+span*0.22, h:210+Math.random()*150 });
        const dy=aheadSpawnY(mid);
        if(B.elite && dy<stageTop) spawnDiver(dy);
        beatSpawned=true;
      }
      nextSpawn += Math.max(120, cfg.bgap[0]-90*diff + Math.random()*cfg.bgap[1]);
      nextSpawn = aheadSpawnY(nextSpawn);
      if(nextSpawn >= stageTop) break;          // 頂上より上には湧かさない
      if(!cfg.nobird) spawnBird(nextSpawn, cfg); // コイン回廊(nobird)は敵を出さない=ご褒美/集中
      if(cfg.coins) coins.push({ y:nextSpawn+(Math.random()-0.5)*50, x:60+Math.random()*(W-120), r:14, t:Math.random()*6.28 }); // コインの道(緩やかな蛇行)
    }
  }
}

let pressed=false, steerL=false, steerR=false, ptrActive=false, ptrX=W/2, ptrPrevX=W/2;
function down(){
  if(cleared){ stageKey=nextStageKey(); reset(); markStage(); return; } // クリア後タップ＝次のステージ
  if(dead){ reset(); return; }
  pressed=true;
}
function up(){ pressed=false; }
function ptrPos(e){ const r=cv.getBoundingClientRect(); const cx=e.touches?e.touches[0].clientX:e.clientX; return (cx-r.left)/r.width*W; }
function onBtn(e){ return e.target && e.target.closest && e.target.closest('#veh,#stage'); } // ボタン上のタップは除外
// ブーストは画面どこでも反応（黒帯/余白でも）。ボタンだけ除外
addEventListener('mousedown',e=>{ if(onBtn(e)) return; down(); ptrActive=true; ptrX=ptrPrevX=ptrPos(e); });
addEventListener('mouseup',()=>{ up(); ptrActive=false; });
addEventListener('mousemove',e=>{ if(ptrActive) ptrX=ptrPos(e); });
addEventListener('touchstart',e=>{ if(onBtn(e)) return; e.preventDefault(); down(); ptrActive=true; ptrX=ptrPrevX=ptrPos(e);},{passive:false});
addEventListener('touchmove',e=>{ if(ptrActive){ e.preventDefault(); ptrX=ptrPos(e);} },{passive:false});
addEventListener('touchend',e=>{e.preventDefault(); up(); ptrActive=false;},{passive:false});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault(); if(!e.repeat) down();}
  if(e.code==='ArrowLeft'||e.code==='KeyA') steerL=true;
  if(e.code==='ArrowRight'||e.code==='KeyD') steerR=true;
  if(e.code>='Digit1'&&e.code<='Digit4' && canSwapVeh()) vehIdx=+e.code.slice(5)-1;
});
addEventListener('keyup',e=>{
  if(e.code==='Space') up();
  if(e.code==='ArrowLeft'||e.code==='KeyA') steerL=false;
  if(e.code==='ArrowRight'||e.code==='KeyD') steerR=false;
});
// 乗り物切替ボタン（DOM）
function canSwapVeh(){ return !started || dead || cleared; } // 飛行中は機体変更ロック(トレードオフを守る)
document.querySelectorAll('#veh button').forEach(b=>{
  b.addEventListener('click',()=>{ if(canSwapVeh()) vehIdx=+b.dataset.v; b.blur(); });
});
// ステージ切替ボタン（選ぶと最初からそのステージで開始）
const stageBtns=document.querySelectorAll('#stage button');
function markStage(){ stageBtns.forEach(b=>b.classList.toggle('on', b.dataset.s===stageKey)); }
stageBtns.forEach(b=>{
  b.addEventListener('click',()=>{ stageKey=b.dataset.s; reset(); markStage(); b.blur(); });
});
markStage();
// 飛行中(=機体変更ロック中)は検証ボタンを隠す＝HUDの「高さ」等と被らない。停止時(開始前/死亡/クリア)だけ表示
const stageBar=document.getElementById('stage'), vehBar=document.getElementById('veh'), hintBar=document.getElementById('hint');
let _ctrlsShown=null;
function syncControls(){ const show=canSwapVeh(); if(show===_ctrlsShown) return; _ctrlsShown=show;
  const d=show?'':'none'; stageBar.style.display=d; vehBar.style.display=d; hintBar.style.display=d; }
syncControls();

function screenY(wy){ return HIPPO_SCR_Y-(wy-hippoY); }
function curState(){ return dead?'hit':(boosting?'boost':(vel<-60?'fall':'idle')); }

// ===== 炎パーティクル =====
function emitFlame(){
  for(let k=0;k<3;k++){
    parts.push({
      x:hipX+(Math.random()-0.5)*8,
      y:HIPPO_SCR_Y+DRAW_H.boost*veh().size*0.34+Math.random()*6,
      vx:(Math.random()-0.5)*60, vy:180+Math.random()*160,
      life:0, max:0.28+Math.random()*0.18, sz:7+Math.random()*6
    });
  }
}
// 空気パフ（翼/プロペラの推進＝下へ押し出す風。白くふわっと膨らんで消える）
function emitPuff(){
  for(let k=0;k<2;k++){
    parts.push({ kind:'puff',
      x:hipX+(Math.random()-0.5)*26,
      y:HIPPO_SCR_Y+DRAW_H.boost*veh().size*0.3+Math.random()*8,
      vx:(Math.random()-0.5)*120, vy:120+Math.random()*120,
      life:0, max:0.34+Math.random()*0.2, sz:6+Math.random()*7 });
  }
}
function updateParts(dt){
  for(const p of parts){ p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.kind==='puff'?60:200)*dt; }
  parts=parts.filter(p=>p.life<p.max);
}
function drawParts(){
  for(const p of parts){
    const t=p.life/p.max, a=1-t;
    if(p.kind==='puff'){               // 白い空気＝膨らみながら薄く
      ctx.globalAlpha=a*0.4; ctx.fillStyle='#eef4ff';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*(0.7+0.9*t),0,7); ctx.fill();
    }else{                             // 炎：黄→橙→赤
      const r=255, g=Math.round(220-150*t), b=Math.round(60-60*t);
      ctx.globalAlpha=a*0.9; ctx.fillStyle=`rgb(${r},${g},${b})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*(1-0.4*t),0,7); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}

// ===== キラキラ（無敵/取得演出）=====
function emitSparkle(x,y,n,spread){
  for(let k=0;k<n;k++){
    const a=Math.random()*6.28, sp=spread*(0.3+Math.random());
    sparks.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-40,
      life:0, max:0.45+Math.random()*0.4, sz:3+Math.random()*4, hue:Math.random()<0.5?'#fff':'#ffe06a' });
  }
}
function updateSparks(dt){
  for(const p of sparks){ p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=90*dt; }
  sparks=sparks.filter(p=>p.life<p.max);
}
function drawSparks(){
  for(const p of sparks){
    const t=p.life/p.max, a=(1-t)*(0.6+0.4*Math.sin(tsec*30+p.x));
    ctx.globalAlpha=Math.max(0,a); ctx.fillStyle=p.hue;
    const s=p.sz*(1-0.3*t);
    ctx.beginPath(); ctx.arc(p.x,p.y,s,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ===== 風（スピードライン）=====
function drawWind(){
  const intensity=Math.min(Math.abs(vel)/520,1);
  if(intensity<0.28) return;        // 速い時だけ＝鳥の陣形読みを邪魔しない
  windPhase += vel*dtGlobal*1.1;   // velと逆向きに流れる
  const wc = vel>=0 ? '255,255,255' : '255,150,90'; // 上昇=白 / 落下=暖色（向きが分かる）
  ctx.strokeStyle=`rgba(${wc},${0.03+intensity*0.08})`; // 薄く＝視覚ノイズ低減
  ctx.lineWidth=2;
  for(let i=0;i<9;i++){
    const x=22+ (i*87 % (W-30));
    const len=18+intensity*36;
    let y=((i*97 - windPhase)%(H+len)+H+len)%(H+len)-len;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+len); ctx.stroke();
  }
}

// ===== カバ描画（スプライト＋風の煽り）=====
function drawHippo(){
  const st=curState();
  // 機体ごとの見た目：idle/boost/fall は機体baseで上書き（hit/powerは共通スプライト）。ふつう(VEH_ART=null)は従来通り。
  const va=VEH_ART[vehIdx];
  const useVeh = va && (st==='idle'||st==='boost'||st==='fall');
  const img = useVeh ? sprites[va.base] : sprites[st];
  // 風の煽り：状態ごとに揺れ
  let ang=0, bob=0;
  if(st==='idle'){ ang=Math.sin(tsec*2)*0.04; bob=Math.sin(tsec*2)*3; }
  else if(st==='boost'){ ang=Math.sin(tsec*34)*0.035; bob=Math.sin(tsec*26)*1.5; }
  else if(st==='fall'){ ang=Math.sin(tsec*9)*0.16; bob=Math.sin(tsec*12)*2; }
  ctx.save();
  // 被弾無敵中は点滅
  if(iframe>0 && !dead) ctx.globalAlpha = (Math.floor(tsec*18)%2) ? 0.3 : 0.85;
  ctx.translate(hipX, HIPPO_SCR_Y+bob);
  ctx.rotate(ang);
  // boost中の機体ごとの"ポンプ"（縦の伸縮で推進の努力感を出す・炎の代わり）
  if(st==='boost' && useVeh){
    const flapY = vehIdx===1 ? 1+Math.sin(tsec*26)*0.06   // 翼=羽ばたき
                : vehIdx===3 ? 1+Math.sin(tsec*42)*0.04   // プロペラ=細かい振動
                :              1+Math.sin(tsec*6)*0.035;  // 風船=ゆったり伸び
    ctx.scale(1, flapY);
  }
  if(img && img.complete && img.naturalHeight){
    const bodyH=DRAW_H[st]*veh().size;                  // 揃える"体の高さ"（×veh().sizeで大小を出す）
    const dh = useVeh ? bodyH/va.bodyH : bodyH;          // 機体絵は体基準でフル高さを逆算（リグは体外へはみ出す）
    const dw = dh*(img.naturalWidth/img.naturalHeight);
    const ay = useVeh ? va.cy : 0.5;                     // 体の中心を原点に合わせる縦アンカー
    // 主役の分離：暗背景でも埋もれない柔らかいバックライト＋明背景で効くドロップシャドウ（体サイズ基準）
    const gl=ctx.createRadialGradient(0,0,bodyH*0.22,0,0,bodyH*0.64);
    gl.addColorStop(0,'rgba(255,255,255,0.16)'); gl.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(0,0,bodyH*0.64,0,7); ctx.fill();
    ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=8;
    ctx.drawImage(img, -dw/2, -ay*dh, dw, dh);
    ctx.shadowBlur=0;
  } else {
    ctx.fillStyle='#7d8aa0'; ctx.fillRect(-HIPPO_R,-HIPPO_R,HIPPO_R*2,HIPPO_R*2);
  }
  ctx.restore();
}

let last=performance.now(), dtGlobal=0;
function loop(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05; dtGlobal=dt; tsec+=dt;
  if(!dead && !cleared){
    const V=veh(), hr=HIPPO_R*V.size;   // 乗り物性能・当たり半径(大きさ依存)
    boosting=pressed; if(boosting) started=true;
    windDir=0; if(started) for(const wz of winds){ if(hippoY>=wz.y0 && hippoY<=wz.y1) windDir=wz.dir; } // 現在地の横風(±1=右/左)
    const prevHippoY=hippoY;     // すり抜け防止のスイープ用
    if(started){
      let a=-GRAV*V.grav+(boosting?THRUST*V.thrust:0);
      vel+=a*dt; if(vel>V_RISE*V.vrise)vel=V_RISE*V.vrise; if(vel<-V_FALL*V.vfall)vel=-V_FALL*V.vfall;
      hippoY+=vel*dt;
    }
    // 横移動（←→/A D/相対ドラッグ・慣性つき）。横風はhvelに効く＝機体の横加速/最高速で抵抗力が変わる
    const dragd = ptrActive ? (ptrX-ptrPrevX) : 0; ptrPrevX = ptrX;
    let want = (steerR?1:0)-(steerL?1:0);
    if(!want && ptrActive) want = Math.max(-1, Math.min(1, dragd*0.5));
    const tgt = want*V.smax;
    hvel += Math.max(-V.sacc*dt, Math.min(V.sacc*dt, tgt-hvel));
    if(started) hvel += windDir*WIND_ACC*dt;                          // 横風の外力
    hvel = Math.max(-V.smax*1.7, Math.min(V.smax*1.7, hvel));         // 風で流されても上限
    hipX += hvel*dt;
    const hbm=hr*0.7;
    if(hipX<hbm){ hipX=hbm; hvel=0; } else if(hipX>W-hbm){ hipX=W-hbm; hvel=0; }
    alt=Math.max(alt,(hippoY-START_Y)/PXPM);
    if(started && hippoY>=stageTop){ // 頂上到達＝ステージクリア
      cleared=true; best=Math.max(best,Math.floor((stageTop-START_Y)/PXPM)); pressed=false;
      for(let k=0;k<46;k++) emitSparkle(Math.random()*W, Math.random()*H*0.55, 1, 230);
    }
    if(iframe>0) iframe-=dt; if(hitFlash>0) hitFlash-=dt;
    if(hippoY<=hr){ hippoY=hr; if(started) die('fall'); }   // 地面落下は即死
    if(started){                                            // ★スタート後だけ敵・時間が進む(覚えゲーの公平性)
    spawnAhead();
    for(const b of birds){
      if(b.move==='diver'){            // タカ：画面上部で狙いを定める(予告)→まっすぐ急降下して"列"を塞ぐ＝同じ横位置で上げ続けを罰す
        if(!b.armed){ const dsy=screenY(b.y); if(dsy>-10 && dsy<H*0.46){ b.armed=true; b.t=0; b.lockX=b.x; } }
        else { b.t+=dt;
          if(b.t<0.9){ b.lockX += Math.sign(hipX-b.lockX)*Math.min(Math.abs(hipX-b.lockX), 130*dt); b.x=b.lockX; b.vx=(hipX-b.x)*0.01; } // 横に寄せて狙う
          else { b.x=b.lockX; b.y -= 560*dt; b.vy=-560; }   // 急降下(下方=列を貫く)。横へ避けさせる
        }
      }else if(b.move==='form'){       // 群れ：隊形を保ったまま一方向へゆっくり流れて通り過ぎる(隙間も一緒に動く＝読める)
        b.sx += (b.dvx||0)*dt;
        b.cy += (b.vy||0)*dt;                    // 下向きに降りてくる＝プレイヤーへ迫る(閉じる速度=動的)
        b.x = b.sx + Math.sin(tsec*0.8+b.fph)*6; // 横揺れ控えめ＝穴が動かず読める
        b.y = b.cy + Math.sin(tsec*2+b.ph)*4;    // 縦揺れ控えめ＝クリーンな一列
        b.vx = b.dvx||0;
      }else if(b.move==='static'){      // 雷雲：その場でふわふわ（動かない障害物）
        b.y = b.cy + Math.sin(tsec*1.5+b.ph)*6;
      }
      // すり抜け防止：カバの高度スイープ[prevHippoY..hippoY]と鳥の最短縦距離で判定
      const dx=b.x-hipX, lo=Math.min(prevHippoY,hippoY), hi=Math.max(prevHippoY,hippoY);
      const dy=(b.y>hi)?b.y-hi:(b.y<lo)?lo-b.y:0;
      const ex=dx/(V.hitW||1);   // 機体ごとの横幅(ふうせん=横長=上の障害に当たりやすい高リスク)
      if(Math.hypot(ex,dy) < b.r*0.78+hr*0.66){ // 当たりは見た目より気持ち甘め
        if(iframe<=0){ hp--; iframe=IFRAME; hitFlash=0.35;
          hvel += (hipX<b.x?-1:1)*280;            // 鳥と反対へノックバック＝同じ鳥に押し戻されない
          if(vel<140) vel=140;                    // 少し上へ逃がす＝落ち込んで再衝突を防ぐ
          emitSparkle(hipX, HIPPO_SCR_Y, 8, 160);
          if(hp<=0){ die('hit'); break; } }
      }
    }
    birds=birds.filter(b=>b.y>hippoY-H && !b.pop && b.x>-120 && b.x<W+120);
    for(const c of coins){ c.t+=dt;       // コイン収集＝スコア(無敵でない＝支配的戦略にならない)
      const dx=c.x-hipX, dy=screenY(c.y)-HIPPO_SCR_Y;
      if(Math.hypot(dx,dy) < c.r+hr){ c.got=true; coinCount++; emitSparkle(c.x, screenY(c.y), 10, 150); }
    }
    coins=coins.filter(c=>!c.got && c.y>hippoY-H);
    let inCloud=0;
    for(const bk of banks){ if(Math.abs(screenY(bk.y)-HIPPO_SCR_Y) < bk.h/2) inCloud=1; }
    fog += (inCloud-fog)*Math.min(1,4*dt);
    banks=banks.filter(bk=>bk.y>hippoY-H-bk.h);
    winds=winds.filter(wz=>wz.y1>hippoY-H);
    } // /started
    if(boosting&&started){                              // boost演出は機体ごと：炎=ロケット / 上昇キラキラ=風船 / 空気パフ=翼・プロペラ
      if(vehIdx===0) emitFlame();
      else if(vehIdx===2){ if(Math.random()<0.5) emitSparkle(hipX+(Math.random()-0.5)*40, HIPPO_SCR_Y-DRAW_H.boost*veh().size*0.2, 1, 70); }
      else emitPuff();
    }
  }
  if(cleared && Math.random()<0.6) emitSparkle(Math.random()*W, Math.random()*H*0.5, 1, 170); // クリア中の継続キラキラ(更新側)
  updateParts(dt); updateSparks(dt);
  draw();
  syncControls();   // 飛行中は検証ボタンを隠す（状態が変わった時だけDOM更新）
  requestAnimationFrame(loop);
}
function die(cause){ if(dead)return; dead=true; deathCause=cause||'hit'; best=Math.max(best,Math.floor(alt)); pressed=false; }

// 雲スプライトをパララックスで敷く（imgを使い回し・縦に無限ループ）
// blur=奥行き用のぼかし(遠景ほど強く)＝被写界深度で主役を際立て＋単調さ解消
function drawClouds(img, par, n, baseScale, alpha, sx, blur){
  if(!img || !img.complete || !img.naturalWidth) return;
  ctx.globalAlpha=alpha;
  if(blur) ctx.filter=`blur(${blur}px)`;
  const span=H+300;
  for(let k=0;k<n;k++){
    const s=baseScale*(0.8+(k*37%50)/100);      // 大きさを少し散らす
    const w=img.naturalWidth*s, h=img.naturalHeight*s;
    const yy=((((k*span/n) + hippoY*par)%span)+span)%span - 140; // 登る=雲は下へ流れる(地面と同じ向き)
    const x=((k*sx)%(W+120))-60;
    ctx.drawImage(img, x-w/2, yy-h/2, w, h);
  }
  ctx.globalAlpha=1; ctx.filter='none';
}

// 雲バンク（中に入ると視界が狭まる・ダメージ無し）。半透明なので鳥はうっすら見える
function drawBanks(){
  for(const bk of banks){ const sy=screenY(bk.y); if(sy<-bk.h||sy>H+bk.h) continue;
    const top=sy-bk.h/2, bot=sy+bk.h/2;
    ctx.fillStyle='rgba(238,244,255,0.60)'; ctx.fillRect(0,top,W,bk.h);
    ctx.fillStyle='rgba(240,246,255,0.85)'; const r=26;
    for(let x=-r;x<W+r;x+=r*1.05){ ctx.beginPath(); ctx.arc(x,top,r,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(x,bot,r,0,7); ctx.fill(); }
  }
}
// ゴールライン（頂上）：光のグロー＋チェッカーの旗＋文字
function drawGoal(){
  const sy=screenY(stageTop); if(sy>H+70||sy<-140) return;
  // グロー
  const g=ctx.createLinearGradient(0,sy-46,0,sy+46);
  g.addColorStop(0,'rgba(255,236,150,0)'); g.addColorStop(0.5,`rgba(255,228,110,${0.5+0.22*Math.sin(tsec*5)})`); g.addColorStop(1,'rgba(255,236,150,0)');
  ctx.fillStyle=g; ctx.fillRect(0,sy-46,W,92);
  // チェッカーの帯（2段）
  const cs=18, bh=cs*2;
  for(let x=0;x<W;x+=cs){ for(let r=0;r<2;r++){
    ctx.fillStyle=(((x/cs|0)+r)%2)?'#ffffff':'#2b2f3a';
    ctx.fillRect(x, sy-bh/2+r*cs, cs, cs);
  }}
  // 文字
  ctx.font='bold 28px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='center';
  ctx.lineWidth=5; ctx.strokeStyle='rgba(60,45,0,0.85)'; ctx.fillStyle='#ffe45a';
  ctx.strokeText('GOAL', W/2, sy-bh/2-10); ctx.fillText('GOAL', W/2, sy-bh/2-10);
}
// 横風の演出：風向きに横へ流れるシェブロン（右=>/左=<）
// 風ゾーン演出：規則的なシェブロンのタイル貼りをやめ、風で寝た「斜めの雨/風ストリーク」へ。
// 長さ・濃さ・太さをばらつかせ規則性(=安っぽさ)を消し、傾きで風向きを伝える。薄めで主役を邪魔しない。
function drawWindFX(){
  if(windDir===0) return;
  const dir=windDir>0?1:-1;
  ctx.lineCap='round';
  const N=24, spX=tsec*900*dir, spY=tsec*430;   // 横=風で強く流れる(>縦) / 縦=雨で落ちる
  const wrapX=W+200, wrapY=H+200;
  for(let i=0;i<N;i++){
    const seed=i*101+7;
    const x=(((seed*53)%wrapX + spX)%wrapX + wrapX)%wrapX - 100;
    const y=(((seed*89)%wrapY + spY)%wrapY + wrapY)%wrapY - 100;
    const len=26+(seed%5)*10;                    // 長さのばらつき
    const a=0.11+(seed%4)*0.05;                  // 濃さのばらつき(薄め)
    ctx.strokeStyle=`rgba(208,226,255,${a})`; ctx.lineWidth=1.4+(seed%2)*0.9;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dir*len*1.5, y+len*0.42); ctx.stroke(); // 吹き付ける=横に強く寝た斜め
  }
}
// アーチ式スピードメーター（真上=0 / 右=上昇(緑) / 左=落下(橙)・固定スケール＋機体MAXマーカー）
function drawSpeedo(){
  const cx=W/2, cy=Math.round(H*0.80), R=60, A0=Math.PI, A1=2*Math.PI, UP=1.5*Math.PI;
  const REF_RISE=V_RISE, REF_FALL=V_FALL*1.1, V=veh();
  ctx.save();
  ctx.fillStyle='rgba(18,22,32,0.42)';
  ctx.beginPath(); ctx.arc(cx,cy,R+9,A0,A1); ctx.closePath(); ctx.fill();
  ctx.lineWidth=7; ctx.lineCap='round';
  ctx.strokeStyle='#ff7a4d'; ctx.beginPath(); ctx.arc(cx,cy,R,A0,UP); ctx.stroke();      // 落下(左)
  ctx.strokeStyle='#46e0a0'; ctx.beginPath(); ctx.arc(cx,cy,R,UP,A1); ctx.stroke();      // 上昇(右)
  ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=1.5;                            // 目盛り
  for(let i=0;i<=8;i++){ const a=A0+(A1-A0)*i/8;
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*(R-9),cy+Math.sin(a)*(R-9)); ctx.lineTo(cx+Math.cos(a)*(R+2),cy+Math.sin(a)*(R+2)); ctx.stroke(); }
  // 機体ごとの最高速マーカー
  const aR=UP+Math.min(1,V.vrise*V_RISE/REF_RISE)*(Math.PI/2);
  const aF=UP-Math.min(1,V.vfall*V_FALL/REF_FALL)*(Math.PI/2);
  ctx.lineWidth=3;
  ctx.strokeStyle='#d6ffec'; ctx.beginPath(); ctx.moveTo(cx+Math.cos(aR)*(R-12),cy+Math.sin(aR)*(R-12)); ctx.lineTo(cx+Math.cos(aR)*(R+5),cy+Math.sin(aR)*(R+5)); ctx.stroke();
  ctx.strokeStyle='#ffd4c2'; ctx.beginPath(); ctx.moveTo(cx+Math.cos(aF)*(R-12),cy+Math.sin(aF)*(R-12)); ctx.lineTo(cx+Math.cos(aF)*(R+5),cy+Math.sin(aF)*(R+5)); ctx.stroke();
  // 針
  let ang = vel>=0 ? UP+Math.min(1,vel/REF_RISE)*(Math.PI/2) : UP-Math.min(1,-vel/REF_FALL)*(Math.PI/2);
  ctx.strokeStyle='#fff'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ang)*(R-6),cy+Math.sin(ang)*(R-6)); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,4,0,7); ctx.fill();
  ctx.font='bold 11px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='center';
  ctx.fillStyle='#ffb59a'; ctx.fillText('落下', cx-R+4, cy-3);
  ctx.fillStyle='#9af0c8'; ctx.fillText('上昇', cx+R-4, cy-3);
  ctx.fillStyle='#fff'; ctx.font='bold 16px "M PLUS Rounded 1c",system-ui'; ctx.fillText(Math.round(Math.abs(vel)/PXPM), cx, cy-R-4);
  ctx.restore();
}
// 機体ステータスバー（エアライド風）
function drawStats(x,y){
  // 大きさ(回避)はバーに出さない＝機体スプライトのサイズ変化そのもので伝える
  const V=veh(), rows=[
    ['加速',(V.thrust-0.6)/0.42],
    ['軽さ',(1.1-V.grav)/0.74],
    ['旋回',(V.smax-150)/210],
  ];
  ctx.fillStyle='rgba(18,22,32,0.34)'; ctx.fillRect(x-6,y-4,128,51);
  ctx.textAlign='left';
  for(let i=0;i<rows.length;i++){
    const n=Math.max(0,Math.min(1,rows[i][1])), yy=y+i*15;
    ctx.font='10px "M PLUS Rounded 1c",system-ui'; ctx.fillStyle='#cdd6e6'; ctx.fillText(rows[i][0], x, yy+9);
    for(let s=0;s<5;s++){ ctx.fillStyle = s<Math.round(n*5)?'#7ec8ff':'rgba(255,255,255,0.18)';
      ctx.fillRect(x+36+s*11, yy+1, 8, 8); }
  }
}

// アウトライン付きHUD文字（明るい/暗い背景どちらでも読める＝黒縁＋本色）
function hudText(t,x,y,fill){ ctx.lineJoin='round'; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,0.7)';
  ctx.strokeText(t,x,y); ctx.fillStyle=fill; ctx.fillText(t,x,y); }
// 結果画面の構造UI（コードで作る＝綺麗・伸縮自在）：角丸カード / ピル型ボタン / 星
function panel(x,y,w,h,r,fill,stroke){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
  ctx.fillStyle=fill; ctx.fill(); if(stroke){ ctx.lineWidth=2; ctx.strokeStyle=stroke; ctx.stroke(); } }
function pill(cx,cy,w,h,color,label){ const x=cx-w/2,y=cy-h/2;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,h/2); ctx.fillStyle=color; ctx.fill();
  const pulse=0.5+0.5*Math.sin(tsec*4); ctx.globalAlpha=0.25+0.35*pulse;          // 軽く点滅＝押せる合図
  ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke(); ctx.globalAlpha=1;
  ctx.font='bold 15px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.fillText(label, cx, cy+1); ctx.textBaseline='alphabetic'; }
function drawStar(cx,cy,r,color){
  const grd=ctx.createRadialGradient(cx-r*0.3,cy-r*0.4,r*0.1,cx,cy,r*1.1); // 立体感(上が明るい)
  grd.addColorStop(0,'#fff7cf'); grd.addColorStop(0.5,color); grd.addColorStop(1,'#e89a18');
  ctx.beginPath();
  for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=(i%2)?r*0.45:r;
    const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath(); ctx.fillStyle=grd; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(120,70,0,0.45)'; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath();             // ツヤ(ハイライト点)
  ctx.ellipse(cx-r*0.28,cy-r*0.34,r*0.16,r*0.1,-0.5,0,7); ctx.fill(); }
function draw(){
  const sky=Math.min(alt/300,1), SK=stage().sky;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${SK[0][0]-sky*40},${SK[0][1]-sky*30},${SK[0][2]-sky*20})`);
  g.addColorStop(1,`rgb(${SK[1][0]-sky*30},${SK[1][1]-sky*20},${SK[1][2]-sky*10})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // 雲（3層パララックス・スプライト／上空でも残して動きの基準を確保）。雲海(B)は多め
  const cloudFade=Math.max(0.25,1-sky*0.5), cn=stageKey==='B'?1:0;
  drawClouds(sprites.cloud_small, 0.10, 6+cn*4, 0.09, 0.5*cloudFade, 199, 3.5); // 最遠：小・遅・薄・ぼかし強
  // 大気ヘイズ：最遠の雲を空色側へ薄く沈めて奥行きを出す（上ほど濃い）
  { const hz=ctx.createLinearGradient(0,0,0,H);
    hz.addColorStop(0,`rgba(${SK[0][0]},${SK[0][1]},${SK[0][2]},0.28)`); hz.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=hz; ctx.fillRect(0,0,W,H); }
  drawClouds(sprites.cloud_small, 0.18, 5+cn*3, 0.13, 0.72*cloudFade, 137, 1.3); // 中景：軽くぼかし
  drawClouds(sprites.cloud_big,   0.32, 3+cn*2, 0.21, 0.92*cloudFade, 311);      // 近景：大・速・くっきり

  drawWind();

  // 地面まわり（遠景の丘→地面板→発射台。すべて画像）
  const gy=screenY(0);
  if(gy<H+80){
    const hl=sprites.hills;
    if(hl.complete&&hl.naturalWidth){ const hh=hl.naturalHeight*W/hl.naturalWidth;
      ctx.drawImage(hl, 0, gy+6-hh, W, hh); }           // 丘：底を接地線あたりに
    const gr=sprites.ground;
    if(gr.complete&&gr.naturalWidth){ ctx.drawImage(gr, 0, gy, W, H-gy+40); }
    else { ctx.fillStyle='#6e5836'; ctx.fillRect(0,gy,W,H-gy+40); }
    const pd=sprites.pad;
    if(pd.complete&&pd.naturalWidth){ const pw=104, ph=pd.naturalHeight*pw/pd.naturalWidth;
      ctx.drawImage(pd, HIPPO_X-pw/2, gy-ph*0.30, pw, ph); } // 発射台：天面が接地線に来るよう配置
  }

  // コイン（収集物・くるくる＝横スケールで回転感／淡い光輪）。コードで描く＝軽い・色替え自由
  for(const c of coins){ const sy=screenY(c.y); if(sy<-40||sy>H+40) continue;
    const bob=Math.sin(c.t*3)*4, spin=Math.abs(Math.cos(c.t*3.2)); // spin=横幅で回転を表現
    ctx.save(); ctx.translate(c.x, sy+bob);
    ctx.globalAlpha=0.30; ctx.fillStyle='#ffe06a';
    ctx.beginPath(); ctx.arc(0,0,c.r*1.7,0,7); ctx.fill(); ctx.globalAlpha=1;
    const grd=ctx.createRadialGradient(-c.r*0.3,-c.r*0.3,c.r*0.2,0,0,c.r);
    grd.addColorStop(0,'#fff3b0'); grd.addColorStop(0.55,'#ffcf3a'); grd.addColorStop(1,'#e89a18');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.ellipse(0,0,Math.max(2,c.r*spin),c.r,0,0,7); ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='rgba(150,90,0,0.5)'; ctx.stroke();
    if(spin>0.45){ ctx.fillStyle='rgba(180,110,0,0.6)'; ctx.font='bold '+Math.round(c.r*1.1)+'px "M PLUS Rounded 1c",system-ui';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('¢',0,1); ctx.textBaseline='alphabetic'; }
    ctx.restore();
  }

  drawBanks(); // 雲バンク（鳥より奥・うっすら透ける）

  // 鳥（スプライト・進行方向に反転）
  for(const b of birds){ const sy=screenY(b.y); if(sy<-60||sy>H+60) continue;
    if(b.move==='diver' && b.armed && b.t<0.9){ // 急降下の予告：狙う"列"を縦の赤ビームで明示＝横へ逃げろ
      const p=0.5+0.5*Math.sin(tsec*20), a=0.2+0.3*p;
      const g=ctx.createLinearGradient(0,sy,0,H);
      g.addColorStop(0,`rgba(255,60,60,${0.05})`); g.addColorStop(1,`rgba(255,60,60,${a})`);
      ctx.fillStyle=g; ctx.fillRect(b.x-b.r*0.9, sy, b.r*1.8, H-sy);
      ctx.strokeStyle=`rgba(255,80,80,${0.5+0.4*p})`; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(b.x,sy,b.r*1.4+p*5,0,7); ctx.stroke();
    }
    const def=BIRD[b.type], img=sprites[b.sprite||def.sprite];
    if(img&&img.complete&&img.naturalWidth){
      const dh=def.drawH*(b.ds||1), dw=dh*(img.naturalWidth/img.naturalHeight);
      const bob=Math.sin(tsec*11+b.cy*0.05)*dh*0.03; // 羽ばたきの微ゆれ(code)
      ctx.save(); ctx.translate(b.x,sy+bob);
      ctx.scale(b.vx<0?-1:1,1);                       // 原画は右向き→左進行で反転
      ctx.drawImage(img,-dw/2,-dh/2,dw,dh);
      ctx.restore();
    } else {
      ctx.fillStyle='#d8607a';
      ctx.beginPath(); ctx.arc(b.x,sy,b.r,0,7); ctx.fill();
    }
  }

  drawGoal();    // ゴールライン（頂上）
  drawWindFX();  // 風ゾーンのシェブロン

  drawParts();
  drawHippo();
  drawSparks();

  // 雲の中＝視界が狭まる（カバの周りだけ見える）
  if(fog>0.01){
    const clear=Math.max(70, 250*(1-fog));
    const g=ctx.createRadialGradient(hipX,HIPPO_SCR_Y,clear*0.4,hipX,HIPPO_SCR_Y,clear+170);
    g.addColorStop(0,'rgba(244,248,255,0)');
    g.addColorStop(1,`rgba(244,248,255,${0.82*fog})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  // 被弾フラッシュ（赤）
  if(hitFlash>0){ ctx.fillStyle=`rgba(220,40,40,${0.32*(hitFlash/0.35)})`; ctx.fillRect(0,0,W,H); }

  // HUD背景スクリム（明るい空/霧でも文字が読めるよう、上部bandを軽く暗くフェード）
  { const sg=ctx.createLinearGradient(0,0,0,132);
    sg.addColorStop(0,'rgba(0,0,0,0.42)'); sg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sg; ctx.fillRect(0,0,W,132); }

  // HUD（プレイ中のみ。クリア/死亡は専用パネルを出すのでプレイHUDは隠す＝雑然さ解消）
  if(!cleared && !dead){
  ctx.font='bold 30px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='left'; ctx.fillStyle='#fff';
  ctx.fillText(Math.floor(Math.max(0,(hippoY-START_Y)/PXPM))+' m',16,46); // 今の高さ(落ちれば下がる)
  ctx.font='14px "M PLUS Rounded 1c",system-ui'; ctx.fillStyle='#eef'; ctx.fillText('BEST '+best+' m',16,68);
  ctx.font='bold 13px "M PLUS Rounded 1c",system-ui'; ctx.fillStyle='#fff';
  ctx.fillText('のりもの：'+veh().name,16,90);

  // HP（ハート・右上／右から減る）
  ctx.font='22px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='left';
  const hx=W-8-MAX_HP*26;
  for(let i=0;i<MAX_HP;i++){
    ctx.fillStyle = i<hp ? '#ff4d6d' : 'rgba(255,255,255,0.25)';
    ctx.fillText('♥', hx+i*26, 34);
  }

  // コイン枚数（ハートの下・金）
  ctx.textAlign='right'; ctx.font='bold 16px "M PLUS Rounded 1c",system-ui';
  ctx.fillStyle='#ffcf3a'; ctx.beginPath(); ctx.arc(W-8-46,49,7,0,7); ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle='rgba(150,90,0,0.5)'; ctx.stroke();
  hudText('×'+coinCount, W-8, 55, '#ffe7a0');

  drawSpeedo();          // 速度メーター（下部中央・カバとは重ならない）
  if(canSwapVeh()) drawStats(14,100);  // 詳細ステータスは停止時(選択時)だけ＝飛行中はHUDをすっきり(変更ロック中で見る必要が薄い)
  // ゴール進捗バー（右端）＋あと何m
  { const prog=Math.max(0,Math.min(1,(hippoY-START_Y)/(stageTop-START_Y)));
    const bX=W-9,bY=120,bH=H-300;
    ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.fillRect(bX,bY,6,bH);
    ctx.fillStyle='#ffd23f'; ctx.fillRect(bX,bY+bH*(1-prog),6,bH*prog);
    ctx.font='bold 11px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='right';
    hudText('あと'+Math.max(0,Math.ceil((stageTop-hippoY)/PXPM))+'m', bX-4, bY-4, '#ffe7a0'); } // 進捗バーの左に寄せる=重なり/見切れ防止

  // ステージ名＋現在ビート（検証用）。黒縁で明/暗どちらの空でも読める
  ctx.font='bold 13px "M PLUS Rounded 1c",system-ui'; ctx.textAlign='center';
  { const bs=stage().beats, cb=bs[Math.min(beatI,bs.length-1)];   // 全ビート消化後(頂上間近)はbeatI=長さ→未定義参照でクラッシュ防止のためクランプ
    hudText(stage().name+'（'+(cb?cb.type:'頂上')+'）', W/2, 18, '#fff'); }
  if(windDir!==0){ ctx.font='bold 13px "M PLUS Rounded 1c",system-ui';
    hudText(windDir>0?'→ 横風':'← 横風', W/2, 34, '#bfe0ff'); }
  }  // /プレイ中HUD

  if(!started&&!dead&&!cleared){ ctx.textAlign='center'; ctx.font='bold 18px "M PLUS Rounded 1c",system-ui';
    hudText('押してスタート',W/2,H*0.4,'#fff'); }

  if(dead){ ctx.fillStyle='rgba(8,12,24,0.62)'; ctx.fillRect(0,0,W,H);
    const pw=288,ph=188,px=(W-pw)/2,py=H*0.30; ctx.textAlign='center';
    panel(px,py,pw,ph,22,'rgba(30,36,54,0.96)','rgba(255,255,255,0.12)');
    ctx.font='bold 28px "M PLUS Rounded 1c",system-ui';
    hudText(deathCause==='fall'?'墜落…':'ぶつかった！',W/2,py+48,'#ff8aa0');
    ctx.font='bold 46px "M PLUS Rounded 1c",system-ui'; hudText(Math.floor(alt)+' m',W/2,py+104,'#fff');
    ctx.font='14px "M PLUS Rounded 1c",system-ui'; ctx.fillStyle='#aeb6c8'; ctx.fillText('BEST '+best+' m',W/2,py+130);
    pill(W/2,py+ph-28,200,40,'#ff5d7a','押してリトライ'); }

  if(cleared){ ctx.fillStyle='rgba(14,20,44,0.62)'; ctx.fillRect(0,0,W,H);
    drawSparks();
    const pw=302,ph=236,px=(W-pw)/2,py=H*0.25; ctx.textAlign='center';
    const gg=ctx.createRadialGradient(W/2,py+96,20,W/2,py+96,210);   // 金の後光
    gg.addColorStop(0,'rgba(255,224,120,0.34)'); gg.addColorStop(1,'rgba(255,224,120,0)');
    ctx.fillStyle=gg; ctx.fillRect(0,py-70,W,ph+140);
    panel(px,py,pw,ph,24,'rgba(36,31,20,0.95)','rgba(255,214,90,0.55)');
    ctx.font='bold 32px "M PLUS Rounded 1c",system-ui'; hudText('ステージクリア！',W/2,py+50,'#ffe06a');
    const sy0=py+94; for(let i=0;i<3;i++){ const pop=1+0.12*Math.sin(tsec*6+i); drawStar(W/2+(i-1)*44, sy0, 16*pop, '#ffd23f'); }
    ctx.font='bold 16px "M PLUS Rounded 1c",system-ui'; hudText(stage().name+'  '+Math.floor((stageTop-START_Y)/PXPM)+' m 到達',W/2,py+138,'#fff');
    ctx.font='bold 15px "M PLUS Rounded 1c",system-ui'; hudText('コイン ¢×'+coinCount,W/2,py+164,'#ffd23f');
    pill(W/2,py+ph-28,250,42,'#ffb02e','タップで次へ（'+STAGES[nextStageKey()].name+'）'); }
}
// スクショ撮影モード（Geminiの視覚レビュー用）：?cap&stage=A&veh=1 で自動上昇
(function(){ const Q=new URLSearchParams(location.search);
  if(Q.has('cap')){ if(Q.get('stage')) stageKey=Q.get('stage'); if(Q.get('veh')) vehIdx=+Q.get('veh');
    reset(); markStage(); started=true; pressed=true;
    const a=+Q.get('alt'); if(a){ hippoY=START_Y+a*PXPM; vel=200; } // 指定高度へ瞬間移動して敵を画面に出す
    if(Q.get('show')==='dead'){ alt=Math.max(alt,a||120); die(Q.get('cause')||'hit'); } } // 死亡パネルの視覚確認用(&cause=fall/hit)
})();
requestAnimationFrame(loop);
</script>
