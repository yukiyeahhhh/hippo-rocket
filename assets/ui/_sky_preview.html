<!doctype html><meta charset=utf8>
<title>地域別の空 — 4地域プレビュー</title>
<style>
  body{margin:0;background:#15171c;font-family:system-ui;color:#e6e6e6;padding:18px;}
  h2{font-size:16px;margin:14px 0 8px;border-left:4px solid #E85D43;padding-left:8px}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
  .card{background:#23252b;border-radius:10px;padding:8px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .card h3{margin:4px 0 8px;font-size:12px;color:#bcd}
  img{display:block;border-radius:6px}
  .shot{width:300px}
  .sky{height:300px}
  .note{font-size:12px;color:#9aa;margin:6px 0 0}
</style>
<h2>① 実機・各地域の飛び立ち（足元の世界＋地域別の“中身のある空”）</h2>
<div class="row">
  <div class="card"><h3>鳥の空域（朝焼けの青空）</h3><img class="shot" src="../../.shots/sky4_A_birds.png"></div>
  <div class="card"><h3>雲海（ふわふわ雲海）</h3><img class="shot" src="../../.shots/sky4_B_mist.png"></div>
  <div class="card"><h3>嵐（荒天＋稲妻グロー）</h3><img class="shot" src="../../.shots/sky4_C_storm.png"></div>
  <div class="card"><h3>星脈（夜空＋星雲＋三日月）</h3><img class="shot" src="../../.shots/sky4_D_stars.png"></div>
</div>
<h2>② 生成した空背景（元画像・縦長／登ると上部へ視差スクロール）</h2>
<div class="row">
  <div class="card"><h3>sky_birds_v1</h3><img class="sky" src="sky_birds_v1.png"></div>
  <div class="card"><h3>sky_mist_v1</h3><img class="sky" src="sky_mist_v1.png"></div>
  <div class="card"><h3>sky_storm_v1</h3><img class="sky" src="sky_storm_v1.png"></div>
  <div class="card"><h3>sky_stars_v2（星雲を絵本調に修正）</h3><img class="sky" src="sky_stars_v2.png"></div>
</div>
<p class="note">足元の世界は地域共通の透過素材。空だけ地域別に差し替えて特色を出しています。星脈は写実的な星雲だったv1→フラットな絵本調v2に作り直し済み。</p>
