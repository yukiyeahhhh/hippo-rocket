<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>hippo-rocket 画像プレビュー</title>
<style>
  body{margin:0;background:#15171e;color:#e6e9f0;font-family:system-ui,"Segoe UI",sans-serif;}
  h1{font-size:16px;font-weight:600;padding:14px 18px;margin:0;border-bottom:1px solid #2a2e3a;}
  .grid{display:flex;flex-wrap:wrap;gap:18px;padding:18px;}
  figure{margin:0;background:#1d212b;border:1px solid #2a2e3a;border-radius:10px;padding:10px;width:260px;}
  figure img{width:100%;height:auto;border-radius:6px;background:
    repeating-conic-gradient(#2a2e3a 0% 25%, #232732 0% 50%) 50%/20px 20px;display:block;}
  figcaption{font-size:13px;color:#aeb6c6;margin-top:8px;text-align:center;word-break:break-all;}
</style></head><body>
<h1>主役キービジュアル候補 — 並べて比較（ロック前）</h1>
<div class="grid">
  <figure><img src="hero_cand1.png"><figcaption>cand1 — 王道・愛嬌（ロケット脇）</figcaption></figure>
  <figure><img src="hero_cand2.png"><figcaption>cand2 — ゴーグル＋背中ブースター</figcaption></figure>
  <figure><img src="hero_cand3.png"><figcaption>cand3 — キリッ・ぽっちゃり</figcaption></figure>
</div>
</body></html>
