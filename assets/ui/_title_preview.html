<!doctype html><meta charset="utf-8">
<title>タイトル候補プレビュー</title>
<style>
  body{margin:0;background:#11151c;color:#cdd6e6;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;padding:18px}
  h1{font-size:16px;margin:0 0 14px;color:#fff}
  .grid{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .card{background:#1a2030;border:1px solid #2a3346;border-radius:12px;padding:10px;width:300px}
  .card img{width:100%;border-radius:8px;display:block;background:#000}
  .card .name{font-weight:700;color:#fff;margin:8px 2px 2px}
  .card .note{font-size:12px;color:#9fb0c8;margin:2px}
  .best{outline:3px solid #ffb02e}
</style>
<h1>hippo-rocket タイトル候補（左ほど新しい/推し）</h1>
<div class="grid">
  <div class="card best">
    <img src="title_kv_v4.png">
    <div class="name">title_kv_v4.png ★最新・推し</div>
    <div class="note">健気な決意の表情(こぶし突き上げ廃止)。星空へ上昇・概念整合◎</div>
  </div>
  <div class="card">
    <img src="title_kv_v3.png">
    <div class="name">title_kv_v3.png</div>
    <div class="note">星空版だが表情が勝ち誇り(こぶし)＝解釈違い</div>
  </div>
  <div class="card">
    <img src="title_kv_v2.png">
    <div class="name">title_kv_v2.png</div>
    <div class="note">一貫ポップ画風だが行き先が山（概念ミス）</div>
  </div>
  <div class="card">
    <img src="title_kv.png">
    <div class="name">title_kv.png</div>
    <div class="note">最初の朝焼けKV（半写実背景＋カバ＝混在で浮き）</div>
  </div>
  <div class="card">
    <img src="title_bg.png">
    <div class="name">title_bg.png</div>
    <div class="note">カバ抜き背景（旧ハイブリッド用・撤回方針）</div>
  </div>
</div>
