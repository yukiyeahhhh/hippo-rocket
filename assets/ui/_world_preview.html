<!doctype html><meta charset=utf8>
<title>足元の世界  — 生成プレビュー</title>
<style>
  body{margin:0;background:#1b1d22;font-family:system-ui;color:#e6e6e6;padding:18px;}
  h2{font-size:16px;margin:18px 0 8px;border-left:4px solid #E85D43;padding-left:8px}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
  .card{background:#26282e;border-radius:10px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .card h3{margin:4px 0 8px;font-size:12px;color:#bcd}
  img.raw{width:360px;display:block;border-radius:6px;background:
    conic-gradient(#444 25%,#333 0 50%,#444 0 75%,#333 0) 0/18px 18px}
  canvas{display:block;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.5)}
  .note{font-size:12px;color:#9aa;margin:4px 0 0}
</style>

<h2>① 生成画像（元・マゼンタキー）→ ② 透過抜き</h2>
<div class="row">
  <div class="card"><h3>① 生成元 (_world_raw.png)</h3><img class="raw" src="_world_raw.png"></div>
  <div class="card"><h3>② 透過後 (world_launch_v1.png) ※市松＝透明</h3><img class="raw" src="world_launch_v1.png"></div>
</div>

<h2>③ 4地域の空に乗せた様子（共通の足元＋地域別の空）</h2>
<div class="row" id="root"></div>
<p class="note">※空は現状コードのグラデ（鳥=青空 / 雲海=霧グレー / 嵐=暗い荒天 / 星脈=夜紫）。次フェーズで各地域の空を画像生成して背面に敷くと地域差がさらに出ます。</p>

<script>
const W=240,H=426; // ゲーム比 9:16 を縮小表示
const regions=[
  ['鳥の空域', [135,180,230],[175,205,235]],
  ['雲海',     [150,165,185],[200,210,222]],
  ['嵐',       [80,95,130],  [120,135,165]],
  ['星脈',     [55,62,118],  [122,116,170]],
];
const world=new Image(); world.src='world_launch_v1.png';
world.onload=()=>{
  const root=document.getElementById('root');
  for(const [name,top,bot] of regions){
    const card=document.createElement('div'); card.className='card';
    card.innerHTML='<h3>'+name+'</h3>';
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H; card.appendChild(cv);
    const ctx=cv.getContext('2d');
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,`rgb(${top})`); g.addColorStop(1,`rgb(${bot})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    const dh=world.naturalHeight*W/world.naturalWidth;
    ctx.drawImage(world, 0, H-dh, W, dh);
    root.appendChild(card);
  }
};
</script>
