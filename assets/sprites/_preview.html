<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>透過スプライト 同サイズ確認</title>
<style>
  body{margin:0;background:#15171e;color:#e6e9f0;font-family:system-ui,"Segoe UI",sans-serif;}
  h1{font-size:15px;padding:12px 16px;margin:0;border-bottom:1px solid #2a2e3a;}
  .row{display:flex;gap:16px;padding:18px;align-items:flex-end;}
  figure{margin:0;text-align:center;}
  .box{width:160px;height:200px;display:flex;align-items:flex-end;justify-content:center;
    background:repeating-conic-gradient(#3a3f4c 0% 25%, #2b2f3a 0% 50%) 50%/24px 24px;border-radius:8px;}
  /* 身長基準：高さを揃えて表示（hitだけ平たいので低めに） */
  .box img{height:150px;width:auto;image-rendering:auto;}
  .box.hit img{height:72px;}
  figcaption{font-size:12px;color:#aeb6c6;margin-top:6px;}
</style></head><body>
<h1>透過＋身長基準で同サイズ表示（抜け・サイズ・テイスト確認）</h1>
<div class="row">
  <figure><div class="box"><img src="idle.png"></div><figcaption>idle</figcaption></figure>
  <figure><div class="box"><img src="boost.png"></div><figcaption>boost</figcaption></figure>
  <figure><div class="box"><img src="fall.png"></div><figcaption>fall</figcaption></figure>
  <figure><div class="box hit"><img src="hit.png"></div><figcaption>hit(平たいので低め)</figcaption></figure>
</div>
</body></html>
