<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>hippo-rocket — グレイボックス試作</title>
<style>
  html,body{margin:0;height:100%;background:#1b1f2a;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{background:#0e1118;box-shadow:0 0 40px #000a;border-radius:6px;}
  #hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#8a93a6;font-size:12px;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hint">押している間ブースト上昇 / 離すと落下（マウス長押し・タップ・スペース）</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
// 縦長(9:16)。ウィンドウに収める。論理解像度は固定して計算を安定させる。
const W = 432, H = 768;
function fit(){
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  cv.width = W; cv.height = H;
  cv.style.width = (W*s)+'px'; cv.style.height = (H*s)+'px';
}
addEventListener('resize', fit); fit();

// ===== チューニング（手触りはここを触る）=====
const GRAV    = 1500;   // 重力(px/s^2)。大きいほど重い
const THRUST  = 2500;   // ブースト時に上向きへ加える加速度
const V_RISE  = 540;    // 上昇速度の上限
const V_FALL  = 980;    // 落下速度の上限（落下の方が速い＝重い手触り）
const HIPPO_X = W*0.5;  // カバの横位置は固定（縦の制御だけ）
const HIPPO_SCR_Y = H*0.55; // カバの画面上のY（ワールドはこの周りをスクロール）
const HIPPO_R = 22;
const PXPM = 18;        // 1メートル=何px（高度表示用）
// ============================================

let hippoY, vel, boosting, birds, nextSpawn, alt, best=0, dead, started, t0;

function reset(){
  hippoY = 200;          // ワールドY（上ほど大きい＝高い）。地面はY=0
  vel = 0; boosting=false;
  birds = []; nextSpawn = 700;
  alt = 0; dead=false; started=false;
  t0 = performance.now();
}
reset();

function spawnAhead(){
  // カバの上方に鳥を生成。高度が上がるほど間隔が詰まり・速くなる
  while(nextSpawn < hippoY + H + 200){
    const diff = Math.min(alt/40, 1);           // 0→1で難化
    const gap  = 360 - 150*diff + Math.random()*120;
    nextSpawn += gap;
    birds.push({
      y: nextSpawn,
      x: 40 + Math.random()*(W-80),
      dir: Math.random()<0.5?-1:1,
      spd: 70 + 120*diff + Math.random()*60,
      r: 18
    });
  }
}

let pressed=false;
function down(){ if(dead){ reset(); return; } pressed=true; }
function up(){ pressed=false; }
addEventListener('mousedown', down); addEventListener('mouseup', up);
addEventListener('touchstart', e=>{e.preventDefault();down();}, {passive:false});
addEventListener('touchend',   e=>{e.preventDefault();up();},   {passive:false});
addEventListener('keydown', e=>{ if(e.code==='Space'){e.preventDefault(); if(!e.repeat) down();}});
addEventListener('keyup',   e=>{ if(e.code==='Space') up(); });

function screenY(wy){ return HIPPO_SCR_Y - (wy - hippoY); }

let last=performance.now();
function loop(now){
  let dt = (now-last)/1000; last=now; if(dt>0.05) dt=0.05;
  if(!dead){
    boosting = pressed;
    if(boosting) started=true;
    // 縦の物理（スタートするまで回さない＝速度を溜めない）
    if(started){
      let a = -GRAV + (boosting? THRUST : 0);
      vel += a*dt;
      if(vel> V_RISE) vel= V_RISE;
      if(vel<-V_FALL) vel=-V_FALL;
      hippoY += vel*dt;
    }
    alt = Math.max(alt, (hippoY-200)/PXPM);

    // 地面に落ちたら死亡（＝落としすぎの罰）
    if(hippoY <= HIPPO_R){ hippoY=HIPPO_R; if(started) die(); }

    // 鳥更新＋当たり
    spawnAhead();
    for(const b of birds){
      b.x += b.dir*b.spd*dt;
      if(b.x< b.r){ b.x=b.r; b.dir=1; }
      if(b.x> W-b.r){ b.x=W-b.r; b.dir=-1; }
      const dx=b.x-HIPPO_X, dy=screenY(b.y)-HIPPO_SCR_Y;
      if(Math.hypot(dx,dy) < b.r+HIPPO_R-4) die();
    }
    birds = birds.filter(b=> b.y > hippoY - H);
  }
  draw();
  requestAnimationFrame(loop);
}
function die(){ if(dead) return; dead=true; best=Math.max(best, Math.floor(alt)); pressed=false; }

function draw(){
  // 背景（高度で色が変わる＋スクロールするライン）
  const sky = Math.min(alt/300,1);
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, `rgb(${20+sky*10},${30+sky*20},${60+sky*60})`);
  g.addColorStop(1, `rgb(${30+sky*40},${50+sky*60},${90+sky*90})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=2;
  for(let k=0;k<12;k++){ const yy=((k*120 - hippoY*0.4)%(H+120)+H+120)%(H+120); ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke(); }

  // 地面
  const gy=screenY(0);
  if(gy<H+40){ ctx.fillStyle='#3a2e2a'; ctx.fillRect(0,gy,W,H-gy+40);
    ctx.fillStyle='#4a3b34'; ctx.fillRect(0,gy,W,6); }

  // 鳥（グレイボックス＝三角）
  for(const b of birds){
    const sy=screenY(b.y); if(sy<-40||sy>H+40) continue;
    ctx.fillStyle='#d8607a';
    ctx.beginPath(); ctx.moveTo(b.x-b.r,sy); ctx.lineTo(b.x+b.r,sy); ctx.lineTo(b.x,sy-b.r*0.9); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(b.x-b.r,sy); ctx.lineTo(b.x+b.r,sy); ctx.lineTo(b.x,sy+b.r*0.5); ctx.closePath(); ctx.fill();
  }

  // カバ（状態でポーズ・表情が変わる：boost/fall/hit/idle）
  // ※本番ではここをスプライト差し替え。状態機械はこの形を踏襲する
  const x=HIPPO_X, y=HIPPO_SCR_Y;
  const state = dead?'hit':(boosting?'boost':(vel<-60?'fall':'idle'));
  let rw=HIPPO_R, rh=HIPPO_R;
  if(state==='boost'){ rw=HIPPO_R*0.86; rh=HIPPO_R*1.16; }       // 上に伸びる
  else if(state==='fall'){ rw=HIPPO_R*1.15; rh=HIPPO_R*0.86; }   // 縮む
  else if(state==='hit'){ rw=HIPPO_R*1.30; rh=HIPPO_R*0.70; }    // ぺちゃんこ
  if(state==='boost'){ // 噴射炎
    ctx.fillStyle='#ffb24d';
    ctx.beginPath(); ctx.moveTo(x-8,y+rh); ctx.lineTo(x+8,y+rh);
    ctx.lineTo(x, y+rh+18+Math.random()*10); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = state==='hit' ? '#9aa0ad' : '#7d8aa0';
  roundRect(x-rw, y-rh, rw*2, rh*2, 12); ctx.fill();
  ctx.fillStyle='#566076'; ctx.fillRect(x-6, y-rh-10, 12, 12); // ロケット
  // 表情
  const ex=8; ctx.strokeStyle='#2b3040'; ctx.lineWidth=2.5; ctx.fillStyle='#2b3040';
  if(state==='hit'){                 // ×目
    for(const s of [-1,1]){ const cx=x+s*ex, cy=y-2;
      ctx.beginPath(); ctx.moveTo(cx-4,cy-4); ctx.lineTo(cx+4,cy+4);
      ctx.moveTo(cx+4,cy-4); ctx.lineTo(cx-4,cy+4); ctx.stroke(); }
  } else if(state==='fall'){          // 見開き＋口あんぐり
    ctx.fillStyle='#eef'; ctx.beginPath(); ctx.arc(x-ex,y-4,5,0,7); ctx.arc(x+ex,y-4,5,0,7); ctx.fill();
    ctx.fillStyle='#2b3040'; ctx.beginPath(); ctx.arc(x-ex,y-3,2.5,0,7); ctx.arc(x+ex,y-3,2.5,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(x,y+8,3,0,7); ctx.fill();
  } else if(state==='boost'){         // キリッ（への字目）
    ctx.beginPath(); ctx.moveTo(x-ex-4,y-6); ctx.lineTo(x-ex+3,y-3);
    ctx.moveTo(x+ex+4,y-6); ctx.lineTo(x+ex-3,y-3); ctx.stroke();
  } else {                            // idle つぶら
    ctx.beginPath(); ctx.arc(x-ex,y-4,3.5,0,7); ctx.arc(x+ex,y-4,3.5,0,7); ctx.fill();
  }

  // HUD
  ctx.fillStyle='#fff'; ctx.font='bold 30px system-ui'; ctx.textAlign='left';
  ctx.fillText(Math.floor(Math.max(alt,0))+' m', 16, 44);
  ctx.font='14px system-ui'; ctx.fillStyle='#aeb6c6';
  ctx.fillText('BEST '+best+' m', 16, 66);

  if(!started && !dead){
    ctx.fillStyle='#fff'; ctx.font='16px system-ui'; ctx.textAlign='center';
    ctx.fillText('押してスタート', W/2, H*0.4);
  }
  if(dead){
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.font='bold 40px system-ui'; ctx.fillText(Math.floor(alt)+' m', W/2, H*0.42);
    ctx.font='16px system-ui'; ctx.fillStyle='#aeb6c6';
    ctx.fillText('BEST '+best+' m', W/2, H*0.42+30);
    ctx.fillStyle='#fff'; ctx.fillText('押してリトライ', W/2, H*0.55);
  }
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

requestAnimationFrame(loop);
</script>
</body>
</html>
