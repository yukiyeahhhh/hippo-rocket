<!doctype html><meta charset="utf-8">
<title>UI素材プレビュー</title>
<style>
  body{margin:0;background:#11151c;color:#d7e0f2;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;padding:18px}
  h1{font-size:16px;margin:0 0 14px;color:#fff}
  .grid{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .card{width:320px;background:#1a2030;border:1px solid #2a3346;border-radius:8px;padding:10px}
  .card img{width:100%;display:block;border-radius:8px;background:linear-gradient(180deg,#62AEEB,#F6D6A1)}
  .name{font-weight:800;color:#fff;margin:8px 2px 2px}
  .note{font-size:12px;color:#9fb0c8;margin:2px}
  .button-sample{position:relative;width:300px;height:92px;background:linear-gradient(180deg,#62AEEB,#F6D6A1);border-radius:8px;overflow:hidden}
  .button-sample img{position:absolute;left:50%;top:50%;width:250px;transform:translate(-50%,-50%);background:none}
  .button-sample span{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
    font-weight:800;font-size:24px;color:#fff;text-shadow:0 2px 0 #c95522,0 4px 8px rgba(94,55,18,.35)}
  .button-sample.baked span{display:none}
</style>
<h1>hippo-rocket UI素材</h1>
<div class="grid">
  <div class="card">
    <div class="button-sample baked">
      <img src="ui_btn_start.png" alt="出発する">
      <span>出発する</span>
    </div>
    <div class="name">ui_btn_start.png</div>
    <div class="note">文字込みの主要CTA。「出発する」専用。</div>
  </div>
  <div class="card">
    <div class="button-sample baked">
      <img src="ui_btn_shop.png" alt="ショップ">
      <span>ショップ</span>
    </div>
    <div class="name">ui_btn_shop.png</div>
    <div class="note">文字込みのショップ導線ボタン。</div>
  </div>
  <div class="card">
    <div class="button-sample baked">
      <img src="ui_btn_back.png" alt="もどる">
      <span>もどる</span>
    </div>
    <div class="name">ui_btn_back.png</div>
    <div class="note">文字込みの戻るボタン。</div>
  </div>
  <div class="card">
    <div class="button-sample">
      <img src="ui_btn_orange.png" alt="">
      <span>ショップ</span>
    </div>
    <div class="name">ui_btn_orange.png</div>
    <div class="note">共通の大ボタン用。文字はコード側で描画。</div>
  </div>
  <div class="card">
    <img src="shop_merchant_sunglasses.png" alt="">
    <div class="name">shop_merchant_sunglasses.png</div>
    <div class="note">SHOP上部の商人コビトカバ。サングラス版。</div>
  </div>
  <div class="card">
    <img src="shop_merchant.png" alt="">
    <div class="name">shop_merchant.png</div>
    <div class="note">旧商人案。比較用。</div>
  </div>
</div>
