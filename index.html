<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>hippo-rocket — 試作（スプライト版）</title>
<style>
  html,body{margin:0;height:100%;background:#1b1f2a;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{background:#0e1118;box-shadow:0 0 40px #000a;border-radius:6px;}
  #hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#8a93a6;font-size:11px;padding:0 8px;}
  #veh button,#stage button{font:600 13px system-ui;margin:0 3px;padding:7px 12px;border-radius:8px;
    border:1px solid #3b4252;background:#2b3142;color:#cdd3e0;cursor:pointer;}
  #veh button:hover,#stage button:hover{background:#39415a;}
  #stage button.on{background:#3a5a8c;border-color:#5b7fb8;color:#fff;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hint">長押し＝上昇 / 離す＝落下　・　←→ or A/D（PCはドラッグ）＝横移動　・　上＝ステージ / 下＝のりもの切替</div>
<div id="stage" style="position:fixed;top:8px;left:0;right:0;text-align:center;">
  <button data-s="A">ステージA 群れの空</button>
  <button data-s="B">ステージB 雲海</button>
  <button data-s="C">ステージC 嵐</button>
</div>
<div id="veh" style="position:fixed;bottom:30px;left:0;right:0;text-align:center;">
  <button data-v="0">1 ふつう</button>
  <button data-v="1">2 つばさ</button>
  <button data-v="2">3 ふうせん</button>
  <button data-v="3">4 こつぶ</button>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 432, H = 768;
function fit(){
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  cv.width = W; cv.height = H;
  cv.style.width = (W*s)+'px'; cv.style.height = (H*s)+'px';
}
addEventListener('resize', fit); fit();

// ===== スプライト読込 =====
const sprites = {};
for(const n of ['idle','boost','fall','hit','power','bird_small','bird_large',
  'ground','pad','hills','cloud_big','cloud_small','star']){ const im=new Image(); im.src='assets/sprites/'+n+'.png'; sprites[n]=im; }
const DRAW_H = { idle:78, boost:78, fall:74, hit:46, power:84 }; // 表示高さ(身長基準)
// 鳥タイプ定義：原画は右向き。進行方向(vx)が左ならflip。
// 種類＝動き方を結びつける（見て分かる＆リズムが出る）：
//   small … 速い「斜めジグザグ」（自分の高度帯の中で反射しながら飛び回る）
//   large … 遅い「ゆらゆら」（横ゆっくり＋上下サインで漂う・圧）
const BIRD = {
  small: { sprite:'bird_small', r:15, drawH:50, spd:[150,150,70], move:'diag' }, // [base, diff係数, ランダム幅]
  large: { sprite:'bird_large', r:30, drawH:98, spd:[42, 45, 25], move:'sway' },
};

// ===== チューニング =====
const GRAV=1500, THRUST=2500, V_RISE=540, V_FALL=980;
const HIPPO_X=W*0.5, HIPPO_SCR_Y=H*0.55, HIPPO_R=24, PXPM=18;
const MAX_HP=3, IFRAME=1.2; // HP個数 / 被弾後の無敵秒数
const START_Y=38;           // 開始時の高度＝地面に接地して見える値(浮き解消)
const INVINC=5.0;           // スター無敵の秒数（スターはbonusゾーンで出る）

// 乗り物：基準(ふつう)に対する性能。横移動は任意の第2軸。
//  thrust=上がりやすさ倍率 / grav=重さ(大きいほど速く落ちる)倍率 / steer=横の曲がり(px/秒) / size=体の大きさ(当たり&見た目)
//  thrust=上がりやすさ(加速) / vrise=最高上昇速度 / grav=落ち始めの加速(重さ) / vfall=落下の最高速度
//  smax=横の最高速度 / sacc=横の加速(=止まりにくさ。小さいほど慣性が強い) / size=体の大きさ
const VEHICLES = [
  { name:'ふつう',   thrust:1.0,  vrise:1.0,  grav:1.0,  vfall:1.0,  smax:235, sacc:1500, size:1.0 },
  { name:'つばさ',   thrust:0.62, vrise:0.78, grav:0.5,  vfall:0.5,  smax:360, sacc:2400, size:1.0 }, // 上がり遅い/ふわ滑空/横キビキビ
  { name:'ふうせん', thrust:0.9,  vrise:0.95, grav:0.42, vfall:0.36, smax:150, sacc:700,  size:1.5 }, // ずっとゆっくり落ちる/横は鈍重
  { name:'こつぶ',   thrust:0.8,  vrise:0.72, grav:0.95, vfall:1.05, smax:300, sacc:1900, size:0.6 }, // やや力弱い/小さくて当たりにくい
];
let vehIdx=0;
function veh(){ return VEHICLES[vehIdx]; }

// ===== ステージ＝決め打ちビート列（覚えて対策できる／緩急を手で設計）=====
// 連続湧きビートの設定。swarm/elite/wind はビート開始時の特別処理（下記 spawnAhead 参照）
//  bgap=鳥の間隔 / big=大鳥率 / stars=スター帯 / cloud=雲バンク(視界減)
const BEATCFG = {
  calm:    { bgap:[560,220], big:0.20, stars:false, cloud:false },
  trickle: { bgap:[360,160], big:0.30, stars:false, cloud:false },
  dense:   { bgap:[195, 90], big:0.45, stars:false, cloud:false },
  bonus:   { bgap:[520,200], big:0.20, stars:true,  cloud:false },
  cloud:   { bgap:[330,150], big:0.30, stars:false, cloud:true },
};
// 3ステージ＝コンセプト違い。各ステージ内で緩急カーブを持ち、末尾は loopFrom からループ（エンドレス尾）
const STAGES = {
  A: { name:'群れの空', rec:'つばさ', sky:[[135,180,230],[175,205,235]], loopFrom:1, beats:[
    {type:'calm',len:620},{type:'trickle',len:820},{type:'swarm',len:70,side:'L'},
    {type:'trickle',len:620},{type:'swarm',len:70,side:'R'},{type:'bonus',len:460},
    {type:'trickle',len:560},{type:'swarm',len:90,side:'both'},{type:'dense',len:740},{type:'calm',len:520},
  ]},
  B: { name:'雲海', rec:'こつぶ', sky:[[150,165,185],[200,210,222]], loopFrom:1, beats:[
    {type:'calm',len:600},{type:'cloud',len:760},{type:'elite',len:120},
    {type:'trickle',len:560},{type:'cloud',len:820},{type:'elite',len:120},
    {type:'bonus',len:440},{type:'cloud',len:700},{type:'elite',len:140},{type:'calm',len:520},
  ]},
  C: { name:'嵐', rec:'ふうせん', sky:[[80,95,130],[120,135,165]], loopFrom:1, beats:[
    {type:'calm',len:560},{type:'wind',len:520,dir:1},{type:'trickle',len:560},
    {type:'wind',len:520,dir:-1},{type:'dense',len:560},{type:'wind',len:600,dir:1},
    {type:'bonus',len:440},{type:'wind',len:640,dir:-1},{type:'trickle',len:640},{type:'calm',len:520},
  ]},
};

let hippoY, vel, boosting, birds, nextSpawn, alt, best=0, dead, started;
let parts, sparks, windPhase, tsec, hp, iframe, hitFlash;
let stars, banks, winds, invinc, fog;
let hipX, hvel;                 // カバの横位置・横速度
const WIND_FORCE=1000;          // 風ゾーンの上下押し
let stageKey='A';
function stage(){ return STAGES[stageKey]; }
let beatI, beatStartY, beatEndY, beatSpawned, windDir; // ビートカーソル / 現在の風向き(0=無風)

function reset(){
  hippoY=START_Y; hipX=HIPPO_X; hvel=0; vel=0; boosting=false;
  birds=[]; banks=[]; winds=[]; nextSpawn=560; alt=0; dead=false; started=false;
  parts=[]; sparks=[]; windPhase=0; tsec=0;
  hp=MAX_HP; iframe=0; hitFlash=0;
  stars=[]; invinc=0; fog=0; windDir=0;
  beatI=0; beatStartY=START_Y; beatEndY=START_Y+stage().beats[0].len; beatSpawned=false;
}
reset();

function nextBeat(){
  const S=stage();
  beatI++; if(beatI>=S.beats.length) beatI=S.loopFrom;
  beatStartY=beatEndY; beatEndY=beatStartY + (S.beats[beatI].len||1); beatSpawned=false;
}
function spawnBird(y, cfg){
  const diff=Math.min(alt/40,1);
  const t = Math.random()<cfg.big ? 'large' : 'small';
  const def=BIRD[t], s=def.spd, speed=s[0]+s[1]*diff+Math.random()*s[2];
  const dir=Math.random()<0.5?-1:1;
  const b={ type:t, move:def.move, r:def.r, cy:y, y, x:40+Math.random()*(W-80), vx:dir*speed };
  if(def.move==='diag'){ b.vy=(Math.random()<0.5?-1:1)*speed*0.7; b.band=78; }
  else { b.amp=38+Math.random()*34; b.freq=1.0+Math.random()*0.7; b.phase=Math.random()*6.28; b.swayT=0; }
  birds.push(b);
}
function spawnSwarm(y, side){
  const n=9+Math.floor(Math.random()*4);
  for(let i=0;i<n;i++){
    const yy=y+(Math.random()-0.5)*120;
    const x = side==='L'? 20+Math.random()*W*0.4 : side==='R'? W*0.6+Math.random()*(W*0.4-20) : 20+Math.random()*(W-40);
    const speed=170+Math.random()*90, dir=(side==='L')?1:(side==='R')?-1:(Math.random()<0.5?-1:1);
    birds.push({ type:'small', move:'diag', r:BIRD.small.r, cy:yy, y:yy, x, vx:dir*speed,
      vy:(Math.random()<0.5?-1:1)*speed*0.7, band:64 });
  }
}
function spawnElite(y){ // ゆっくり迫る大型＝位置取りを強要（横ホーミング）
  birds.push({ type:'large', move:'elite', r:BIRD.large.r*1.25, ds:1.3, cy:y, y, x:Math.random()<0.5?60:W-60, vx:0, spd:46+Math.random()*22 });
}
function spawnAhead(){
  while(nextSpawn < hippoY + H + 200){
    if(nextSpawn >= beatEndY) nextBeat();
    const B=stage().beats[beatI];
    if(B.type==='swarm'){ if(!beatSpawned){ spawnSwarm(beatStartY+40, B.side); beatSpawned=true; } nextSpawn=beatEndY; }
    else if(B.type==='elite'){ if(!beatSpawned){ spawnElite(beatStartY+50); beatSpawned=true; } nextSpawn=beatEndY; }
    else if(B.type==='wind'){ if(!beatSpawned){ winds.push({y0:beatStartY, y1:beatEndY, dir:B.dir}); beatSpawned=true; } nextSpawn=beatEndY; }
    else {
      const cfg=BEATCFG[B.type], diff=Math.min(alt/40,1);
      if(cfg.cloud && !beatSpawned){ banks.push({ y:(beatStartY+beatEndY)/2, h:240+Math.random()*180 }); beatSpawned=true; }
      nextSpawn += Math.max(120, cfg.bgap[0]-90*diff + Math.random()*cfg.bgap[1]);
      spawnBird(nextSpawn, cfg);
      if(cfg.stars && Math.random()<0.7) stars.push({ y:nextSpawn+(Math.random()-0.5)*80, x:50+Math.random()*(W-100), r:18, t:Math.random()*6.28 });
    }
  }
}

let pressed=false, steerL=false, steerR=false, ptrActive=false, ptrX=W/2, ptrPrevX=W/2;
function down(){ if(dead){ reset(); return; } pressed=true; }
function up(){ pressed=false; }
function ptrPos(e){ const r=cv.getBoundingClientRect(); const cx=e.touches?e.touches[0].clientX:e.clientX; return (cx-r.left)/r.width*W; }
// ブースト入力はキャンバス上だけ（下のボタンを押しても上昇しないように）
cv.addEventListener('mousedown',e=>{ down(); ptrActive=true; ptrX=ptrPrevX=ptrPos(e); });
addEventListener('mouseup',()=>{ up(); ptrActive=false; });
addEventListener('mousemove',e=>{ if(ptrActive) ptrX=ptrPos(e); });
cv.addEventListener('touchstart',e=>{e.preventDefault(); down(); ptrActive=true; ptrX=ptrPrevX=ptrPos(e);},{passive:false});
addEventListener('touchmove',e=>{ if(ptrActive){ e.preventDefault(); ptrX=ptrPos(e);} },{passive:false});
addEventListener('touchend',e=>{e.preventDefault(); up(); ptrActive=false;},{passive:false});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault(); if(!e.repeat) down();}
  if(e.code==='ArrowLeft'||e.code==='KeyA') steerL=true;
  if(e.code==='ArrowRight'||e.code==='KeyD') steerR=true;
  if(e.code>='Digit1'&&e.code<='Digit4') vehIdx=+e.code.slice(5)-1;
});
addEventListener('keyup',e=>{
  if(e.code==='Space') up();
  if(e.code==='ArrowLeft'||e.code==='KeyA') steerL=false;
  if(e.code==='ArrowRight'||e.code==='KeyD') steerR=false;
});
// 乗り物切替ボタン（DOM）
document.querySelectorAll('#veh button').forEach(b=>{
  b.addEventListener('click',()=>{ vehIdx=+b.dataset.v; b.blur(); });
});
// ステージ切替ボタン（選ぶと最初からそのステージで開始）
const stageBtns=document.querySelectorAll('#stage button');
function markStage(){ stageBtns.forEach(b=>b.classList.toggle('on', b.dataset.s===stageKey)); }
stageBtns.forEach(b=>{
  b.addEventListener('click',()=>{ stageKey=b.dataset.s; reset(); markStage(); b.blur(); });
});
markStage();

function screenY(wy){ return HIPPO_SCR_Y-(wy-hippoY); }
function curState(){ return dead?'hit':(invinc>0?'power':(boosting?'boost':(vel<-60?'fall':'idle'))); }

// ===== 炎パーティクル =====
function emitFlame(){
  for(let k=0;k<3;k++){
    parts.push({
      x:hipX+(Math.random()-0.5)*8,
      y:HIPPO_SCR_Y+DRAW_H.boost*veh().size*0.34+Math.random()*6,
      vx:(Math.random()-0.5)*60, vy:180+Math.random()*160,
      life:0, max:0.28+Math.random()*0.18, sz:7+Math.random()*6
    });
  }
}
function updateParts(dt){
  for(const p of parts){ p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=200*dt; }
  parts=parts.filter(p=>p.life<p.max);
}
function drawParts(){
  for(const p of parts){
    const t=p.life/p.max, a=1-t;
    // 黄→橙→赤
    const r=255, g=Math.round(220-150*t), b=Math.round(60-60*t);
    ctx.globalAlpha=a*0.9; ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*(1-0.4*t),0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ===== キラキラ（無敵/取得演出）=====
function emitSparkle(x,y,n,spread){
  for(let k=0;k<n;k++){
    const a=Math.random()*6.28, sp=spread*(0.3+Math.random());
    sparks.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-40,
      life:0, max:0.45+Math.random()*0.4, sz:3+Math.random()*4, hue:Math.random()<0.5?'#fff':'#ffe06a' });
  }
}
function updateSparks(dt){
  for(const p of sparks){ p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=90*dt; }
  sparks=sparks.filter(p=>p.life<p.max);
}
function drawSparks(){
  for(const p of sparks){
    const t=p.life/p.max, a=(1-t)*(0.6+0.4*Math.sin(tsec*30+p.x));
    ctx.globalAlpha=Math.max(0,a); ctx.fillStyle=p.hue;
    const s=p.sz*(1-0.3*t);
    ctx.beginPath(); ctx.arc(p.x,p.y,s,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ===== 風（スピードライン）=====
function drawWind(){
  const intensity=Math.min(Math.abs(vel)/520,1);
  if(intensity<0.12) return;
  windPhase += vel*dtGlobal*1.1;   // velと逆向きに流れる
  const wc = vel>=0 ? '255,255,255' : '255,150,90'; // 上昇=白 / 落下=暖色（向きが分かる）
  ctx.strokeStyle=`rgba(${wc},${0.05+intensity*0.18})`;
  ctx.lineWidth=2;
  for(let i=0;i<16;i++){
    const x=22+ (i*53 % (W-30));
    const len=18+intensity*36;
    let y=((i*97 - windPhase)%(H+len)+H+len)%(H+len)-len;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+len); ctx.stroke();
  }
}

// ===== カバ描画（スプライト＋風の煽り）=====
function drawHippo(){
  const st=curState();
  const img=sprites[st];
  // 風の煽り：状態ごとに揺れ
  let ang=0, bob=0;
  if(st==='idle'){ ang=Math.sin(tsec*2)*0.04; bob=Math.sin(tsec*2)*3; }
  else if(st==='boost'){ ang=Math.sin(tsec*34)*0.035; bob=Math.sin(tsec*26)*1.5; }
  else if(st==='fall'){ ang=Math.sin(tsec*9)*0.16; bob=Math.sin(tsec*12)*2; }
  ctx.save();
  // 被弾無敵中は点滅
  if(iframe>0 && invinc<=0 && !dead) ctx.globalAlpha = (Math.floor(tsec*18)%2) ? 0.3 : 0.85;
  ctx.translate(hipX, HIPPO_SCR_Y+bob);
  ctx.rotate(ang);
  if(img && img.complete && img.naturalHeight){
    const dh=DRAW_H[st]*veh().size, dw=dh*(img.naturalWidth/img.naturalHeight);
    ctx.drawImage(img, -dw/2, -dh/2, dw, dh);
  } else {
    ctx.fillStyle='#7d8aa0'; ctx.fillRect(-HIPPO_R,-HIPPO_R,HIPPO_R*2,HIPPO_R*2);
  }
  ctx.restore();
}

let last=performance.now(), dtGlobal=0;
function loop(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05; dtGlobal=dt; tsec+=dt;
  if(!dead){
    const V=veh(), hr=HIPPO_R*V.size;   // 乗り物性能・当たり半径(大きさ依存)
    boosting=pressed; if(boosting) started=true;
    windDir=0; for(const wz of winds){ if(hippoY>=wz.y0 && hippoY<=wz.y1) windDir=wz.dir; } // 現在地の風
    if(started){
      let a=-GRAV*V.grav+(boosting?THRUST*V.thrust:0)+windDir*WIND_FORCE; // 風ゾーンが上下に押す
      vel+=a*dt; if(vel>V_RISE*V.vrise)vel=V_RISE*V.vrise; if(vel<-V_FALL*V.vfall)vel=-V_FALL*V.vfall;
      hippoY+=vel*dt;
    }
    // 横移動（任意の第2軸：←→/A D、または相対ドラッグ）。慣性つき＝雑なごしごしは効かない
    const dragd = ptrActive ? (ptrX-ptrPrevX) : 0; ptrPrevX = ptrX;
    let want = (steerR?1:0)-(steerL?1:0);
    if(!want && ptrActive) want = Math.max(-1, Math.min(1, dragd*0.5));
    const tgt = want*V.smax;                                   // 目標の横速度
    hvel += Math.max(-V.sacc*dt, Math.min(V.sacc*dt, tgt-hvel)); // accで目標へ寄せる(=止まる時も慣性)
    hipX += hvel*dt;
    const hbm=hr*0.7;
    if(hipX<hbm){ hipX=hbm; hvel=0; } else if(hipX>W-hbm){ hipX=W-hbm; hvel=0; }
    alt=Math.max(alt,(hippoY-START_Y)/PXPM);
    if(iframe>0) iframe-=dt; if(hitFlash>0) hitFlash-=dt;
    if(invinc>0){ invinc=Math.max(0,invinc-dt);            // スター無敵：キラキラを撒く
      if(Math.random()<0.7) emitSparkle(hipX+(Math.random()-0.5)*48, HIPPO_SCR_Y+(Math.random()-0.5)*64, 1, 50); }
    if(hippoY<=hr){ hippoY=hr; if(started) die(); }         // 地面落下は即死
    spawnAhead();
    for(const b of birds){
      if(b.move==='diag'){             // 斜めジグザグ（帯内で四方反射）
        b.x+=b.vx*dt; b.y+=b.vy*dt;
        if(b.y<b.cy-b.band){b.y=b.cy-b.band;b.vy=Math.abs(b.vy);}
        else if(b.y>b.cy+b.band){b.y=b.cy+b.band;b.vy=-Math.abs(b.vy);}
        if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);} else if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);}
      }else if(b.move==='elite'){      // ゆっくり横ホーミング＝位置取りを強要
        b.x += Math.sign(hipX-b.x)*Math.min(Math.abs(hipX-b.x), b.spd*dt);
      }else{                           // ゆらゆら（横ゆっくり＋上下サイン）
        b.x+=b.vx*dt; b.swayT+=dt;
        b.y=b.cy+Math.sin(b.swayT*b.freq+b.phase)*b.amp;
        if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);} else if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);}
      }
      const dx=b.x-hipX, dy=screenY(b.y)-HIPPO_SCR_Y;
      if(Math.hypot(dx,dy) < b.r*0.78+hr*0.66){ // 当たりは見た目より気持ち甘め（大きさ依存）
        if(invinc>0){ b.pop=true; emitSparkle(b.x, screenY(b.y), 10, 170); } // 無敵中は弾き飛ばす
        else if(iframe<=0){ hp--; iframe=IFRAME; hitFlash=0.35; if(hp<=0){ die(); break; } }
      }
    }
    birds=birds.filter(b=>b.y>hippoY-H && !b.pop);
    // スター取得＝無敵
    for(const s of stars){ s.t+=dt;
      const dx=s.x-hipX, dy=screenY(s.y)-HIPPO_SCR_Y;
      if(Math.hypot(dx,dy) < s.r+hr){ s.got=true; invinc=INVINC; emitSparkle(s.x, screenY(s.y), 18, 200); }
    }
    stars=stars.filter(s=>!s.got && s.y>hippoY-H);
    // 雲バンク：中にいる間だけ視界が狭まる（ダメージ無し）
    let inCloud=0;
    for(const bk of banks){ if(Math.abs(screenY(bk.y)-HIPPO_SCR_Y) < bk.h/2) inCloud=1; }
    fog += (inCloud-fog)*Math.min(1,4*dt);   // なめらかに出入り
    banks=banks.filter(bk=>bk.y>hippoY-H-bk.h);
    winds=winds.filter(wz=>wz.y1>hippoY-H);
    if(boosting&&started) emitFlame();
  }
  updateParts(dt); updateSparks(dt);
  draw();
  requestAnimationFrame(loop);
}
function die(){ if(dead)return; dead=true; best=Math.max(best,Math.floor(alt)); pressed=false; }

// 雲スプライトをパララックスで敷く（imgを使い回し・縦に無限ループ）
function drawClouds(img, par, n, baseScale, alpha, sx){
  if(!img || !img.complete || !img.naturalWidth) return;
  ctx.globalAlpha=alpha;
  const span=H+300;
  for(let k=0;k<n;k++){
    const s=baseScale*(0.8+(k*37%50)/100);      // 大きさを少し散らす
    const w=img.naturalWidth*s, h=img.naturalHeight*s;
    const yy=((((k*span/n) + hippoY*par)%span)+span)%span - 140; // 登る=雲は下へ流れる(地面と同じ向き)
    const x=((k*sx)%(W+120))-60;
    ctx.drawImage(img, x-w/2, yy-h/2, w, h);
  }
  ctx.globalAlpha=1;
}

// 雲バンク（中に入ると視界が狭まる・ダメージ無し）。半透明なので鳥はうっすら見える
function drawBanks(){
  for(const bk of banks){ const sy=screenY(bk.y); if(sy<-bk.h||sy>H+bk.h) continue;
    const top=sy-bk.h/2, bot=sy+bk.h/2;
    ctx.fillStyle='rgba(238,244,255,0.60)'; ctx.fillRect(0,top,W,bk.h);
    ctx.fillStyle='rgba(240,246,255,0.85)'; const r=26;
    for(let x=-r;x<W+r;x+=r*1.05){ ctx.beginPath(); ctx.arc(x,top,r,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(x,bot,r,0,7); ctx.fill(); }
  }
}
// アーチ式スピードメーター（真上=0 / 右=上昇(緑) / 左=落下(橙)・固定スケール＋機体MAXマーカー）
function drawSpeedo(){
  const cx=W/2, cy=Math.round(H*0.80), R=60, A0=Math.PI, A1=2*Math.PI, UP=1.5*Math.PI;
  const REF_RISE=V_RISE, REF_FALL=V_FALL*1.1, V=veh();
  ctx.save();
  ctx.fillStyle='rgba(18,22,32,0.42)';
  ctx.beginPath(); ctx.arc(cx,cy,R+9,A0,A1); ctx.closePath(); ctx.fill();
  ctx.lineWidth=7; ctx.lineCap='round';
  ctx.strokeStyle='#ff7a4d'; ctx.beginPath(); ctx.arc(cx,cy,R,A0,UP); ctx.stroke();      // 落下(左)
  ctx.strokeStyle='#46e0a0'; ctx.beginPath(); ctx.arc(cx,cy,R,UP,A1); ctx.stroke();      // 上昇(右)
  ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=1.5;                            // 目盛り
  for(let i=0;i<=8;i++){ const a=A0+(A1-A0)*i/8;
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*(R-9),cy+Math.sin(a)*(R-9)); ctx.lineTo(cx+Math.cos(a)*(R+2),cy+Math.sin(a)*(R+2)); ctx.stroke(); }
  // 機体ごとの最高速マーカー
  const aR=UP+Math.min(1,V.vrise*V_RISE/REF_RISE)*(Math.PI/2);
  const aF=UP-Math.min(1,V.vfall*V_FALL/REF_FALL)*(Math.PI/2);
  ctx.lineWidth=3;
  ctx.strokeStyle='#d6ffec'; ctx.beginPath(); ctx.moveTo(cx+Math.cos(aR)*(R-12),cy+Math.sin(aR)*(R-12)); ctx.lineTo(cx+Math.cos(aR)*(R+5),cy+Math.sin(aR)*(R+5)); ctx.stroke();
  ctx.strokeStyle='#ffd4c2'; ctx.beginPath(); ctx.moveTo(cx+Math.cos(aF)*(R-12),cy+Math.sin(aF)*(R-12)); ctx.lineTo(cx+Math.cos(aF)*(R+5),cy+Math.sin(aF)*(R+5)); ctx.stroke();
  // 針
  let ang = vel>=0 ? UP+Math.min(1,vel/REF_RISE)*(Math.PI/2) : UP-Math.min(1,-vel/REF_FALL)*(Math.PI/2);
  ctx.strokeStyle='#fff'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ang)*(R-6),cy+Math.sin(ang)*(R-6)); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,4,0,7); ctx.fill();
  ctx.font='bold 11px system-ui'; ctx.textAlign='center';
  ctx.fillStyle='#ffb59a'; ctx.fillText('落下', cx-R+4, cy-3);
  ctx.fillStyle='#9af0c8'; ctx.fillText('上昇', cx+R-4, cy-3);
  ctx.fillStyle='#fff'; ctx.font='bold 16px system-ui'; ctx.fillText(Math.round(Math.abs(vel)/PXPM), cx, cy-R-4);
  ctx.restore();
}
// 機体ステータスバー（エアライド風）
function drawStats(x,y){
  // 大きさ(回避)はバーに出さない＝機体スプライトのサイズ変化そのもので伝える
  const V=veh(), rows=[
    ['加速',(V.thrust-0.6)/0.42],
    ['軽さ',(1.1-V.grav)/0.74],
    ['旋回',(V.smax-150)/210],
  ];
  ctx.fillStyle='rgba(18,22,32,0.34)'; ctx.fillRect(x-6,y-4,128,51);
  ctx.textAlign='left';
  for(let i=0;i<rows.length;i++){
    const n=Math.max(0,Math.min(1,rows[i][1])), yy=y+i*15;
    ctx.font='10px system-ui'; ctx.fillStyle='#cdd6e6'; ctx.fillText(rows[i][0], x, yy+9);
    for(let s=0;s<5;s++){ ctx.fillStyle = s<Math.round(n*5)?'#7ec8ff':'rgba(255,255,255,0.18)';
      ctx.fillRect(x+36+s*11, yy+1, 8, 8); }
  }
}

function draw(){
  const sky=Math.min(alt/300,1), SK=stage().sky;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${SK[0][0]-sky*40},${SK[0][1]-sky*30},${SK[0][2]-sky*20})`);
  g.addColorStop(1,`rgb(${SK[1][0]-sky*30},${SK[1][1]-sky*20},${SK[1][2]-sky*10})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // 雲（3層パララックス・スプライト／上空でも残して動きの基準を確保）
  const cloudFade=Math.max(0.25,1-sky*0.5);
  drawClouds(sprites.cloud_small, 0.10, 6, 0.09, 0.5*cloudFade, 199); // 最遠：小・遅・薄
  drawClouds(sprites.cloud_small, 0.18, 5, 0.13, 0.72*cloudFade, 137); // 中景
  drawClouds(sprites.cloud_big,   0.32, 3, 0.21, 0.92*cloudFade, 311); // 近景：大・速

  drawWind();

  // 地面まわり（遠景の丘→地面板→発射台。すべて画像）
  const gy=screenY(0);
  if(gy<H+80){
    const hl=sprites.hills;
    if(hl.complete&&hl.naturalWidth){ const hh=hl.naturalHeight*W/hl.naturalWidth;
      ctx.drawImage(hl, 0, gy+6-hh, W, hh); }           // 丘：底を接地線あたりに
    const gr=sprites.ground;
    if(gr.complete&&gr.naturalWidth){ ctx.drawImage(gr, 0, gy, W, H-gy+40); }
    else { ctx.fillStyle='#6e5836'; ctx.fillRect(0,gy,W,H-gy+40); }
    const pd=sprites.pad;
    if(pd.complete&&pd.naturalWidth){ const pw=104, ph=pd.naturalHeight*pw/pd.naturalWidth;
      ctx.drawImage(pd, HIPPO_X-pw/2, gy-ph*0.30, pw, ph); } // 発射台：天面が接地線に来るよう配置
  }

  // スター（パワーアップ・くるくる＋ふわふわ＋淡い光輪）
  const stImg=sprites.star;
  for(const s of stars){ const sy=screenY(s.y); if(sy<-40||sy>H+40) continue;
    const pulse=1+Math.sin(s.t*4)*0.08, bob=Math.sin(s.t*3)*4;
    ctx.save(); ctx.translate(s.x, sy+bob);
    ctx.globalAlpha=0.35; ctx.fillStyle='#ffe06a';
    ctx.beginPath(); ctx.arc(0,0,s.r*1.7,0,7); ctx.fill(); ctx.globalAlpha=1;
    if(stImg&&stImg.complete&&stImg.naturalWidth){ const d=s.r*2.4*pulse;
      ctx.drawImage(stImg,-d/2,-d/2,d,d*stImg.naturalHeight/stImg.naturalWidth);
    } else { ctx.fillStyle='#ffcc33'; ctx.beginPath(); ctx.arc(0,0,s.r,0,7); ctx.fill(); }
    ctx.restore();
  }

  drawBanks(); // 雲バンク（鳥より奥・うっすら透ける）

  // 鳥（スプライト・進行方向に反転）
  for(const b of birds){ const sy=screenY(b.y); if(sy<-60||sy>H+60) continue;
    const def=BIRD[b.type], img=sprites[def.sprite];
    if(img&&img.complete&&img.naturalWidth){
      const dh=def.drawH*(b.ds||1), dw=dh*(img.naturalWidth/img.naturalHeight);
      const bob=Math.sin(tsec*11+b.cy*0.05)*dh*0.03; // 羽ばたきの微ゆれ(code)
      ctx.save(); ctx.translate(b.x,sy+bob);
      ctx.scale(b.vx<0?-1:1,1);                       // 原画は右向き→左進行で反転
      ctx.drawImage(img,-dw/2,-dh/2,dw,dh);
      ctx.restore();
    } else {
      ctx.fillStyle='#d8607a';
      ctx.beginPath(); ctx.arc(b.x,sy,b.r,0,7); ctx.fill();
    }
  }

  drawParts();
  // 無敵オーラ（カバの後ろに虹色っぽい光輪）
  if(invinc>0 && !dead){
    const pul=0.5+0.5*Math.sin(tsec*10), rad=DRAW_H.power*veh().size*0.62+pul*6;
    const grd=ctx.createRadialGradient(hipX,HIPPO_SCR_Y,rad*0.4,hipX,HIPPO_SCR_Y,rad);
    grd.addColorStop(0,`rgba(255,230,120,${0.45+0.2*pul})`);
    grd.addColorStop(1,'rgba(255,230,120,0)');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(hipX,HIPPO_SCR_Y,rad,0,7); ctx.fill();
  }
  drawHippo();
  drawSparks();

  // 雲の中＝視界が狭まる（カバの周りだけ見える）
  if(fog>0.01){
    const clear=Math.max(70, 250*(1-fog));
    const g=ctx.createRadialGradient(hipX,HIPPO_SCR_Y,clear*0.4,hipX,HIPPO_SCR_Y,clear+170);
    g.addColorStop(0,'rgba(244,248,255,0)');
    g.addColorStop(1,`rgba(244,248,255,${0.82*fog})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  // 被弾フラッシュ（赤）
  if(hitFlash>0){ ctx.fillStyle=`rgba(220,40,40,${0.32*(hitFlash/0.35)})`; ctx.fillRect(0,0,W,H); }

  // HUD
  ctx.fillStyle='#173'; ctx.font='bold 30px system-ui'; ctx.textAlign='left';
  ctx.fillStyle='#fff'; ctx.fillText(Math.floor(Math.max(0,(hippoY-START_Y)/PXPM))+' m',16,46); // 今の高さ(落ちれば下がる)
  ctx.font='14px system-ui'; ctx.fillStyle='#eef'; ctx.fillText('BEST '+best+' m',16,68);
  ctx.font='bold 13px system-ui'; ctx.fillStyle='#fff';
  ctx.fillText('のりもの：'+veh().name,16,90);

  // HP（ハート・右上／右から減る）
  ctx.font='22px system-ui'; ctx.textAlign='left';
  const hx=W-8-MAX_HP*26;
  for(let i=0;i<MAX_HP;i++){
    ctx.fillStyle = i<hp ? '#ff4d6d' : 'rgba(255,255,255,0.25)';
    ctx.fillText('♥', hx+i*26, 34);
  }

  // 無敵タイマー（金色バー・ハートの下）
  if(invinc>0){
    const bw=MAX_HP*26-4, bx=W-8-MAX_HP*26;
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(bx,42,bw,6);
    ctx.fillStyle='#ffd23f'; ctx.fillRect(bx,42,bw*(invinc/INVINC),6);
    ctx.font='bold 11px system-ui'; ctx.textAlign='right'; ctx.fillStyle='#ffe06a';
    ctx.fillText('★ むてき',W-8,66);
  }

  drawSpeedo();          // 速度メーター（下部中央・カバとは重ならない）
  drawStats(14,100);     // 機体ステータスバー
  // ゾーン表示（検証用）
  ctx.font='bold 12px system-ui'; ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,0.82)';
  ctx.fillText(stage().name+'（'+stage().beats[beatI].type+'）', W/2, 18);
  if(windDir!==0){ ctx.fillStyle=windDir>0?'#9af0c8':'#ffb59a'; ctx.font='bold 13px system-ui';
    ctx.fillText(windDir>0?'↑ 追い風':'↓ 向かい風', W/2, 34); }

  if(!started&&!dead){ ctx.fillStyle='#fff'; ctx.font='16px system-ui'; ctx.textAlign='center';
    ctx.fillText('押してスタート',W/2,H*0.4); }
  if(dead){ ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.font='bold 40px system-ui'; ctx.fillText(Math.floor(alt)+' m',W/2,H*0.42);
    ctx.font='16px system-ui'; ctx.fillText('BEST '+best+' m',W/2,H*0.42+30);
    ctx.fillText('押してリトライ',W/2,H*0.55); }
}
requestAnimationFrame(loop);
</script>
