<!doctype html><html lang="ja"><meta charset="utf-8">
<title>SELECT シーン背景 合成プレビュー</title>
<style>
  :root{ --sky:#3A7AD4; --coral:#E85D43; --coralDeep:#C8412B; --cream:#FFF4E2; --ink:#2A3550; --plum:#5B4167; --gold:#FFCB3E; --goldDeep:#E5A91E; }
  *{box-sizing:border-box;font-family:"M PLUS Rounded 1c",system-ui,"Segoe UI",sans-serif}
  body{margin:0;background:#0f141c;color:#cdd6e6;padding:22px;display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap}
  h1{font-size:15px;color:#fff;margin:0 0 10px;width:100%}
  .cap{font-weight:800;color:#fff;margin:10px 2px 2px;font-size:13px}
  .note{font-size:11px;color:#9fb0c8;max-width:300px;line-height:1.6}
  .frame{width:300px;height:533px;border-radius:18px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.5);position:relative}
  .scaler{width:432px;height:768px;transform:scale(.6944);transform-origin:top left;position:relative}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  /* ヘッダー */
  .gear{position:absolute;left:20px;top:18px;width:44px;height:44px;border-radius:50%;border:none;font-size:19px;color:var(--sky);z-index:6;
    background:rgba(255,255,255,.94);box-shadow:0 6px 16px rgba(20,40,80,.22)}
  .coin{position:absolute;right:20px;top:20px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);border-radius:999px;
    padding:8px 16px 8px 10px;font-weight:800;color:var(--ink);font-size:19px;box-shadow:0 6px 16px rgba(20,40,80,.22);z-index:6}
  .cc{width:22px;height:22px;border-radius:999px;background:radial-gradient(circle at 35% 30%,#FFE9A8,var(--gold) 65%,var(--goldDeep))}
  .title{position:absolute;left:0;right:0;top:30px;text-align:center;font-weight:800;font-size:23px;color:#fff;z-index:5;text-shadow:0 2px 10px rgba(20,40,80,.45)}
  /* 機体(発射台の上) */
  .veh{position:absolute;left:50%;top:50%;width:150px;transform:translate(-50%,-50%);z-index:4;filter:drop-shadow(0 14px 12px rgba(34,50,78,.34));animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 9px))}}
  .arr{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.95);color:var(--sky);font-size:23px;font-weight:800;z-index:5;box-shadow:0 6px 14px rgba(20,40,80,.22)}
  .arr.l{left:18px}.arr.r{right:18px}
  /* 名前/説明/ステータス */
  .nm{position:absolute;left:0;right:0;top:430px;text-align:center;font-weight:800;font-size:21px;color:#fff;z-index:5;text-shadow:0 2px 6px rgba(20,40,80,.5)}
  .stats{position:absolute;left:78px;right:78px;top:462px;background:rgba(255,255,255,.62);border-radius:14px;padding:8px 14px;z-index:5;display:flex;flex-direction:column;gap:5px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .sr{display:flex;align-items:center;gap:8px}.sr .n{font-size:11px;font-weight:800;color:var(--plum);width:30px}
  .pip{width:9px;height:9px;border-radius:999px;background:rgba(91,65,103,.18)}.pip.on{background:var(--coral)}
  .chips{position:absolute;left:24px;right:24px;top:548px;display:flex;gap:10px;justify-content:center;z-index:5}
  .chip{border:none;border-radius:999px;font-weight:800;font-size:13px;color:var(--sky);padding:11px 18px;background:rgba(255,255,255,.86);box-shadow:0 4px 12px rgba(20,40,80,.18)}
  .chip.on{background:var(--coral);color:#fff;box-shadow:0 6px 16px rgba(232,93,67,.4)}
  /* フッター */
  .foot{position:absolute;left:24px;right:24px;bottom:28px;display:flex;gap:12px;z-index:5}
  .go{flex:1.5;border:none;border-radius:18px;color:#fff;font-weight:800;font-size:21px;padding:16px;letter-spacing:1px;background:var(--coral);box-shadow:0 9px 22px rgba(232,93,67,.4)}
  .shop{flex:1;border:none;border-radius:18px;color:var(--ink);font-weight:800;font-size:17px;padding:16px;background:rgba(255,255,255,.92);box-shadow:0 8px 18px rgba(20,40,80,.2)}
</style>

<h1>SELECT＝雲上ガレージ：シーン背景(生成画像) ＋ UI合成プレビュー</h1>

<div>
  <div class="frame"><div class="scaler">
    <img class="bg" src="select_bg_v1.png">
  </div></div>
  <div class="cap">① 生成したシーン背景のみ</div>
  <div class="note">グラデではなく「ガレージ」。中央=空の発射台、手前=木デッキ(ボタン用)、上=空(タイトル用)。色は全部KV由来。</div>
</div>

<div>
  <div class="frame"><div class="scaler">
    <img class="bg" src="select_bg_v1.png">
    <button class="gear">⚙</button>
    <div class="coin"><span class="cc"></span>1280</div>
    <div class="title">雲上ガレージ</div>
    <button class="arr l">‹</button>
    <img class="veh" src="../sprites/idle.png">
    <button class="arr r">›</button>
    <div class="nm">ふつう</div>
    <div class="stats">
      <div class="sr"><span class="n">加速</span><span class="pip on"></span><span class="pip on"></span><span class="pip on"></span><span class="pip"></span><span class="pip"></span></div>
      <div class="sr"><span class="n">軽さ</span><span class="pip on"></span><span class="pip on"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
      <div class="sr"><span class="n">旋回</span><span class="pip on"></span><span class="pip on"></span><span class="pip on"></span><span class="pip on"></span><span class="pip"></span></div>
    </div>
    <div class="chips"><button class="chip on">群れの空</button><button class="chip">雲海</button><button class="chip">嵐</button></div>
    <div class="foot"><button class="go">出発する</button><button class="shop">ショップ</button></div>
  </div></div>
  <div class="cap">② 背景＋UI合成（カバを発射台に・ボタンは新coralパレット＝後で画像化）</div>
  <div class="note">これが「フル画面」の見え方。背景がシーンになるだけで一気にゲームらしくなる。ボタン位置/サイズ・機体の乗り位置は要微調整。</div>
</div>
</html>
